apiVersion: v2
kind: Factory
name: Sentry Intake Test Project
stages:
  - key: backlog
    name: Backlog
    kind: backlog
    automations:
      - id: task-analysis
        name: Backlog
        uses: '@superplane/task-analysis'
        with:
          agents:
            refine-task:
              execution_timeout_seconds: 1800
              skip_setup_commands: true
      - id: 9efb9cc74a6725d3
        name: CloudFlare security audit
        uses: automations/9efb9cc74a6725d3.yaml
      - id: f620c8321bd9f13f
        name: CloudFlare security audit 2
        uses: automations/f620c8321bd9f13f.yaml
      - id: ab115904ec04950a
        name: CloudFlare security auditasdf
        uses: automations/ab115904ec04950a.yaml
      - id: d3990b436148de17
        name: Custom automation asdf
        uses: automations/d3990b436148de17.yaml
      - id: intake-github-issues
        name: GitHub issues
        uses: '@superplane/intake/github-issues'
      - id: code-review
        name: Code review
        uses: automations/code-review.yaml
  - key: implementation
    name: Implement
    kind: phase
    run: implement
    automations:
      - id: implement
        name: Implement
        uses: '@superplane/implement'
        with:
          additional_instructions: ""
          agents:
            implementation-agent-no-issue:
              execution_timeout_seconds: 3600
  - key: verify
    name: Verify
    kind: verify
    automations:
      - id: pr-discussion
        name: Address PR feedback
        uses: '@superplane/pr-discussion'
        with:
          agents:
            address-pr-feedback:
              execution_timeout_seconds: 3600
            address-pr-review-feedback:
              execution_timeout_seconds: 3600
            address-pr-review-reply-feedback:
              execution_timeout_seconds: 3600
      - id: merge-confidence
        name: Merge confidence
        uses: '@superplane/merge-confidence'
        with:
          agents:
            assess-risk:
              execution_timeout_seconds: 1800
              skip_setup_commands: true
  - key: done
    name: Done
    kind: done
    automations:
      - id: pr-closure
        name: PR Closure
        uses: '@superplane/pr-closure'
