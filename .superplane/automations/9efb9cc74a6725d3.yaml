apiVersion: v2
kind: Automation
name: CloudFlare security audit
icon: shield-check
timeout_seconds: 3600
runs_on_task: false
skip_setup_commands: false
skip_repository_checkout: false
agent:
  model: openai/gpt-6-luna
triggers:
  - use: schedule
    config:
      cron: 0 9 * * *
      utc_offset: 1
  - use: manual
steps:
  - name: Security Audit
    prompt: |-
      Download this skill https://github.com/cloudflare/security-audit-skill.
      Find up to 5 security problems in the superplane source code, and create tasks.

      1/ Create tasks only for real and verifiable issues
      2/ Be fast instead of trying to find every issue, ideally a run should be less than 20 minutes
      3/ Open max 5 tasks in SuperPlane
      4/ Prefix every created task with [SECURITY]
