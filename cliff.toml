# git-cliff configuration
# Docs: https://git-cliff.org/docs/integration/github/
# Component scope routing is applied by release/component-release.js before
# git-cliff renders these release notes.

[changelog]
header = ""
body = """
{% if version %}
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}**breaking** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/superplanehq/superplane/commit/{{ commit.id }})){% if commit.remote.username %} by [@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }}){% endif %}
{% endfor %}

{% endfor %}
{% if version and previous.version %}
---

**Full Changelog**: https://github.com/superplanehq/superplane/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"

commit_parsers = [
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^feat", group = "New features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Improvements" },
  { message = "^refactor", group = "Improvements" },
  { message = "^chore", group = "Improvements" },
  { message = "^docs", group = "Improvements" },
  { message = "^style", group = "Improvements" },
  { message = "^test", group = "Improvements" },
  { message = "^ci", group = "Improvements" },
  { message = "^build", group = "Improvements" },

  # fallback for non-conventional commits
  { message = ".*", group = "Improvements" },
]

filter_commits = false
protect_breaking_commits = false

[remote.github]
owner = "superplanehq"
repo = "superplane"
token = "${GITHUB_TOKEN}"
