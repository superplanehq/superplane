apiVersion: v1
kind: Canvas
metadata:
  name: Sentry
  description: Create a task when Sentry opens an issue in the factory project.
spec:
  edges:
    - channel: default
      sourceId: on-sentry-issue
      targetId: factory-project
    - channel: 'true'
      sourceId: factory-project
      targetId: get-sentry-issue
    - channel: success
      sourceId: get-sentry-issue
      targetId: get-sentry-event
    - channel: failure
      sourceId: get-sentry-issue
      targetId: get-sentry-event
    - channel: success
      sourceId: get-sentry-event
      targetId: create-work-order
    - channel: failure
      sourceId: get-sentry-event
      targetId: create-work-order
  nodes:
    - id: on-sentry-issue
      name: On Issue
      type: TYPE_TRIGGER
      component: sentry.onIssue
      configuration:
        actions:
          - created
      position:
        x: 576
        'y': 258
      isCollapsed: false
    - id: factory-project
      name: Factory project?
      type: TYPE_ACTION
      component: filter
      configuration:
        expression: root().data.data.issue.project.slug == "refunds"
      position:
        x: 576
        'y': 618
      isCollapsed: false
    - id: get-sentry-issue
      name: Get Sentry Issue
      type: TYPE_ACTION
      component: http
      configuration:
        method: GET
        url: '{{ root().data.issueApiUrl }}'
        authorization:
          type: integration_bearer
          integration:
            name: Sentry
          integrationKey: SENTRY_AUTH_TOKEN
      position:
        x: 576
        'y': 978
      isCollapsed: false
    - id: get-sentry-event
      name: Get Sentry Event
      type: TYPE_ACTION
      component: http
      configuration:
        method: GET
        url: '{{ root().data.issueApiUrl }}events/latest/'
        authorization:
          type: integration_bearer
          integration:
            name: Sentry
          integrationKey: SENTRY_AUTH_TOKEN
      position:
        x: 576
        'y': 1338
      isCollapsed: false
    - id: create-work-order
      name: Create Task
      type: TYPE_ACTION
      component: createWorkOrder
      configuration:
        title: '{{ root().data.data.issue.title }}'
        description: '{{ root().data.description }}{{ $["Get Sentry Event"].data.body?.message ? "\n\n## Latest event\n\n" + $["Get Sentry Event"].data.body.message : "" }}'
      position:
        x: 576
        'y': 1698
      isCollapsed: false
