apiVersion: v1
kind: Canvas
metadata:
  name: Sentry
  description: Create a task when Sentry opens an issue in the factory project.
spec:
  edges:
    - channel: default
      sourceId: on-sentry-issue
      targetId: factory-project
    - channel: 'true'
      sourceId: factory-project
      targetId: enrich-issue
    - channel: default
      sourceId: enrich-issue
      targetId: create-work-order
  nodes:
    - id: on-sentry-issue
      name: On Issue
      type: TYPE_TRIGGER
      component: sentry.onIssue
      configuration:
        actions:
          - created
      position:
        x: 576
        'y': 258
      isCollapsed: false
    - id: factory-project
      name: Factory project?
      type: TYPE_ACTION
      component: filter
      configuration:
        expression: root().data.data.issue.project.slug == "refunds"
      position:
        x: 576
        'y': 618
      isCollapsed: false
    - id: enrich-issue
      name: Enrich Issue
      type: TYPE_ACTION
      component: sentry.enrichIssue
      configuration:
        issue: '{{ root().data.data.issue }}'
      position:
        x: 576
        'y': 978
      isCollapsed: false
    - id: create-work-order
      name: Create Task
      type: TYPE_ACTION
      component: createWorkOrder
      configuration:
        title: '{{ root().data.data.issue.title }}'
        description: '{{ $["Enrich Issue"].data.description }}'
      position:
        x: 576
        'y': 1338
      isCollapsed: false
