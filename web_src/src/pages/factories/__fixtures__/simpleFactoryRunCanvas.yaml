apiVersion: v1
kind: Canvas
metadata:
  name: CI verification
  description: Loop Semaphore CI and fix failures.
spec:
  nodes:
    - id: on-run
      name: CI verification
      type: TYPE_TRIGGER
      component: onRun
      position:
        x: 120
        "y": 0
    - id: loop
      name: loop
      type: TYPE_ACTION
      component: loop
      configuration:
        maxIterations: 5
      position:
        x: 120
        "y": 200
    - id: mark-pr-ready
      name: Mark Pull Request Ready
      type: TYPE_ACTION
      component: github.markPullRequestReadyForReview
      position:
        x: 520
        "y": 200
    - id: run-workflow
      name: Run Semaphore CI
      type: TYPE_ACTION
      component: semaphore.runWorkflow
      position:
        x: 120
        "y": 400
    - id: run-claude
      name: Fix CI
      type: TYPE_ACTION
      component: runnerClaudeCode
      position:
        x: 520
        "y": 560
  edges:
    - sourceId: on-run
      targetId: loop
      channel: default
    - sourceId: loop
      targetId: mark-pr-ready
      channel: done
    - sourceId: loop
      targetId: run-workflow
      channel: next
    - sourceId: run-workflow
      targetId: loop
      channel: passed
    - sourceId: run-workflow
      targetId: run-claude
      channel: failed
    - sourceId: run-claude
      targetId: loop
      channel: passed
    - sourceId: run-claude
      targetId: loop
      channel: failed
