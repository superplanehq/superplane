apiVersion: v1
kind: Console
metadata:
  name: Factory Line App
  canvasId: __FACTORY_CANVAS_ID__
spec:
  panels:
    - id: about
      type: markdown
      content:
        title: About this app
        body: |
          > [!SECTION:setup] Factory line step
          >
          > This app is one step of a factory line. The line runs it through its
          > `onRun` entrypoint and passes the current work order.
          >
          > Work moves between steps through work-order artifacts (plan, branch,
          > pull request). Open the factory line to see the full sequence.
  layout:
    - i: about
      x: 0
      'y': 0
      w: 12
      h: 6
      minW: 3
      minH: 5
