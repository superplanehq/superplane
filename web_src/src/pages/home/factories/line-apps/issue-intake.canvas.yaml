apiVersion: v1
kind: Canvas
metadata:
  name: Issue Ingestion
  description: Scan the backlog on a schedule and ingest newly opened issues into draft work orders with an implementation plan.
spec:
  edges:
    - channel: default
      sourceId: on-schedule
      targetId: pick-issue
    - channel: default
      sourceId: manual-start
      targetId: pick-issue
    - channel: passed
      sourceId: pick-issue
      targetId: issue-selected
    - channel: default
      sourceId: issue-selected
      targetId: find-work-order
    - channel: default
      sourceId: on-issue-opened
      targetId: find-work-order
    - channel: notFound
      sourceId: find-work-order
      targetId: prepare-work-order
    - channel: passed
      sourceId: prepare-work-order
      targetId: create-work-order
    - channel: default
      sourceId: create-work-order
      targetId: attach-issue-link
    - channel: default
      sourceId: attach-issue-link
      targetId: add-plan-artifact
    - channel: default
      sourceId: add-plan-artifact
      targetId: report-confidence
  nodes:
    - id: on-schedule
      name: Every 10 Minutes
      type: TYPE_TRIGGER
      component: schedule
      configuration:
        type: minutes
        minutesInterval: 10
      position:
        x: 144
        "y": 72
      isCollapsed: false
    - id: manual-start
      name: Scan Backlog Now
      type: TYPE_TRIGGER
      component: start
      configuration:
        templates:
          - name: Scan backlog now
            payload:
              source: manual
      position:
        x: -324
        "y": 72
      isCollapsed: false
    - id: pick-issue
      name: Pick Issue
      type: TYPE_ACTION
      component: runnerClaudeCode
      concurrency:
        max: 1
      configuration:
        credentials:
          source: integration
          integration:
            name: claude
        environmentFrom:
          - source: integration
            integration:
              name: github
        environment:
          - name: APP_REPO
            value: "{{ install_params.appRepository }}"
            valueSource: literal
          - name: BACKLOG_REPO
            value: "{{ install_params.backlogRepository }}"
            valueSource: literal
        executionTimeoutSeconds: 1800
        machineType: e1-large-amd64
        model: sonnet
        steps:
          - name: Clone app repository
            type: bash
            command: |-
              git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${APP_REPO}.git" repo
              cd repo
          - name: Choose one open issue
            type: prompt
            prompt: |-
              You are choosing one GitHub issue for a SuperPlane factory to implement next.

              App repository (cloned in the current working directory): {{ install_params.appRepository }}
              Backlog repository: {{ install_params.backlogRepository }}

              1. Using GITHUB_TOKEN, list open issues in the backlog repository. Exclude pull requests.
              2. Inspect the cloned app repository enough to judge which remaining issue you are most confident you can implement.
              3. Write a JSON object to /tmp/pick.json.

              If you select an issue, write:
              {"selected": true, "number": 123, "html_url": "https://github.com/owner/repo/issues/123"}

              If no issue is a good fit, write:
              {"selected": false}

              Do not create files inside the repository. Do not commit anything. Select at most one issue.
          - name: Emit pick result
            type: bash
            command: |-
              if [ ! -s /tmp/pick.json ]; then
                echo '{"selected": false}' > /tmp/pick.json
              fi
              cat /tmp/pick.json > "$SUPERPLANE_RESULT_FILE"
      position:
        x: 144
        "y": 432
      isCollapsed: false
    - id: issue-selected
      name: Issue Selected?
      type: TYPE_ACTION
      component: filter
      configuration:
        expression: previous().data.result.selected == true
      position:
        x: 144
        "y": 792
      isCollapsed: true
    - id: on-issue-opened
      name: On Issue Opened
      type: TYPE_TRIGGER
      component: github.onIssue
      configuration:
        actions:
          - opened
        repository: "{{ install_params.backlogRepository }}"
      position:
        x: 612
        "y": 72
      isCollapsed: false
    - id: find-work-order
      name: Find Work Order
      type: TYPE_ACTION
      component: findWorkOrder
      configuration:
        artifactKey: '{{ "issue" in root().data ? root().data.issue.html_url : $["Pick Issue"].data.result.html_url }}'
        by: artifactKey
      position:
        x: 612
        "y": 792
      isCollapsed: true
    - id: prepare-work-order
      name: Prepare Work Order
      type: TYPE_ACTION
      component: runnerClaudeCode
      concurrency:
        max: 5
      configuration:
        credentials:
          source: integration
          integration:
            name: claude
        environmentFrom:
          - source: integration
            integration:
              name: github
        environment:
          - name: APP_REPO
            value: "{{ install_params.appRepository }}"
            valueSource: literal
          - name: BACKLOG_REPO
            value: "{{ install_params.backlogRepository }}"
            valueSource: literal
          - name: ISSUE_NUMBER
            value: '{{ "issue" in root().data ? string(root().data.issue.number) : string($["Pick Issue"].data.result.number) }}'
            valueSource: literal
          - name: ISSUE_URL
            value: '{{ "issue" in root().data ? root().data.issue.html_url : $["Pick Issue"].data.result.html_url }}'
            valueSource: literal
        executionTimeoutSeconds: 3600
        machineType: e1-large-amd64
        model: sonnet
        steps:
          - name: Clone app repository
            type: bash
            command: |-
              git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${APP_REPO}.git" repo
              cd repo
          - name: Write title, description, and plan
            type: prompt
            prompt: |-
              You are preparing a SuperPlane draft work order from a GitHub issue.

              App repository (cloned in the current working directory): {{ install_params.appRepository }}
              Backlog repository: {{ install_params.backlogRepository }}
              Issue number: use the ISSUE_NUMBER environment variable
              Issue URL: use the ISSUE_URL environment variable

              1. Using GITHUB_TOKEN, read the full issue and its comments from the backlog repository.
              2. Inspect the cloned app repository as needed.
              3. Assess how confident you are that a coding agent can implement and verify the change from the available information.
              4. Write five files:
                 - /tmp/title.txt — one line. A clear work-order title. No surrounding quotes.
                 - /tmp/description.md — a work-order description. Include the problem, relevant context, and a link to the GitHub issue. Write for a human reviewer.
                 - /tmp/plan.md — an implementation plan. Start with a very short, high-level summary: 1-3 concise sentences or a few bullets. No heading above that summary. Then list the concrete steps.
                 - /tmp/confidence.txt — one integer from 0 through 100.
                 - /tmp/confidence.md — explain the score. Identify evidence, assumptions, and the main implementation risks.

              Do not create files inside the repository. Do not commit anything.
          - name: Emit work-order draft
            type: bash
            command: |-
              if [ ! -s /tmp/title.txt ] || [ ! -s /tmp/description.md ] || [ ! -s /tmp/plan.md ] || [ ! -s /tmp/confidence.txt ] || [ ! -s /tmp/confidence.md ]; then
                echo "Missing title, description, plan, or confidence assessment" >&2
                exit 1
              fi
              TITLE="$(tr -d '\n' < /tmp/title.txt)"
              CONFIDENCE="$(tr -d '[:space:]' < /tmp/confidence.txt)"
              if ! echo "$CONFIDENCE" | grep -Eq '^[0-9]+$' || [ "$CONFIDENCE" -gt 100 ]; then
                echo "Confidence must be an integer from 0 through 100" >&2
                exit 1
              fi
              jq -n \
                --arg title "$TITLE" \
                --rawfile description /tmp/description.md \
                --rawfile plan /tmp/plan.md \
                --argjson confidence "$CONFIDENCE" \
                --rawfile confidence_analysis /tmp/confidence.md \
                --arg html_url "$ISSUE_URL" \
                --arg number "$ISSUE_NUMBER" \
                '{
                  title: $title,
                  description: ($description | @base64),
                  plan: ($plan | @base64),
                  confidence: $confidence,
                  confidence_summary: ("Implementation confidence: " + ($confidence | tostring) + "%"),
                  confidence_analysis: ($confidence_analysis | @base64),
                  html_url: $html_url,
                  number: $number
                }' > "$SUPERPLANE_RESULT_FILE"
      position:
        x: 612
        "y": 1152
      isCollapsed: false
    - id: create-work-order
      name: Create Work Order
      type: TYPE_ACTION
      component: createWorkOrder
      configuration:
        description: '{{ fromBase64($["Prepare Work Order"].data.result.description) }}'
        title: '{{ $["Prepare Work Order"].data.result.title }}'
      position:
        x: 612
        "y": 1512
      isCollapsed: true
    - id: attach-issue-link
      name: Attach Issue Link
      type: TYPE_ACTION
      component: addWorkOrderArtifact
      configuration:
        artifactKey: '{{ $["Prepare Work Order"].data.result.html_url }}'
        artifactType: link
        orderId: '{{ $["Create Work Order"].data.workOrder.id }}'
        title: 'Issue #{{ $["Prepare Work Order"].data.result.number }}'
        url: '{{ $["Prepare Work Order"].data.result.html_url }}'
      position:
        x: 612
        "y": 1692
      isCollapsed: true
    - id: add-plan-artifact
      name: Add Plan Artifact
      type: TYPE_ACTION
      component: addWorkOrderArtifact
      configuration:
        artifactType: markdown
        body: '{{ fromBase64($["Prepare Work Order"].data.result.plan) }}'
        orderId: '{{ $["Create Work Order"].data.workOrder.id }}'
        title: PLAN.md
      position:
        x: 612
        "y": 1872
      isCollapsed: true
    - id: report-confidence
      name: Report Implementation Confidence
      type: TYPE_ACTION
      component: reportWorkOrderCheck
      configuration:
        orderId: '{{ $["Create Work Order"].data.workOrder.id }}'
        checkKey: implementation-confidence
        name: Implementation confidence
        format: percent
        score: '{{ $["Prepare Work Order"].data.result.confidence }}'
        maxScore: "100"
        direction: higherIsBetter
        cautionAt: 70
        criticalAt: 40
        summary: '{{ $["Prepare Work Order"].data.result.confidence_summary }}'
        analysis: '{{ fromBase64($["Prepare Work Order"].data.result.confidence_analysis) }}'
      position:
        x: 612
        "y": 2052
      isCollapsed: true
