apiVersion: v1
kind: Canvas
metadata:
  name: PR Creation
  description: Generate a pull request title and body, then open a draft PR.
spec:
  edges:
    - channel: default
      sourceId: onrun-open-pr
      targetId: pr-does-not-exist
    - channel: default
      sourceId: pr-does-not-exist
      targetId: generate-pr-text
    - channel: passed
      sourceId: generate-pr-text
      targetId: create-draft-pr
    - channel: default
      sourceId: create-draft-pr
      targetId: add-pr-label
    - channel: default
      sourceId: add-pr-label
      targetId: attach-pr-artifact
    - channel: default
      sourceId: attach-pr-artifact
      targetId: set-pr-closure-note
  nodes:
    - id: onrun-open-pr
      name: Open Pull Request
      type: TYPE_TRIGGER
      component: onRun
      configuration: {}
      position:
        x: 1753
        'y': -216
      isCollapsed: true
    - id: pr-does-not-exist
      name: PR does not exist?
      type: TYPE_ACTION
      component: filter
      configuration:
        expression: none(order().artifacts, {.type == "pr"})
      position:
        x: 1753
        'y': -48
      isCollapsed: true
    - id: generate-pr-text
      name: Generate PR title and description
      type: TYPE_ACTION
      component: runnerClaudeCode
      concurrency:
        max: 5
      configuration:
        credentials:
          source: integration
          integration:
            name: claude
        environmentFrom:
          - source: integration
            integration:
              name: github
        environment:
          - name: REPO
            value: '{{ install_params.appRepository }}'
            valueSource: literal
          - name: PLAN
            value: '{{ toBase64(find(order().artifacts, {#.type == "markdown" && #.data.title == "PLAN.md"}).data.body) }}'
            valueSource: literal
          - name: BRANCH
            value: '{{ find(order().artifacts, {.type == "branch"}).data.name }}'
            valueSource: literal
          - name: ORDER_DESCRIPTION
            value: '{{ toBase64(order().description) }}'
            valueSource: literal
        executionTimeoutSeconds: 3600
        machineType: e1-large-amd64
        steps:
          - name: Inject Plan
            type: bash
            command: |-
              echo $PLAN | base64 -d > /tmp/PLAN.md
              cat /tmp/PLAN.md
          - name: Inject order description
            type: bash
            command: |-
              echo $ORDER_DESCRIPTION | base64 -d > /tmp/ORDER.md
              cat /tmp/ORDER.md
          - name: Checkout Branch
            type: bash
            command: |-
              git clone --depth 1 --branch "$BRANCH" "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" repo
              cd repo
          - name: Generate PR title and description
            type: prompt
            prompt: |-
              You are writing a pull request title and description for an implementation done to complete a SuperPlane Work Order.
              The repository is cloned out in your current working directory.

              Work order title: {{ order().title }}

              1/ The work order description is at /tmp/ORDER.md
              2/ The plan used for the implementation is in the /tmp/PLAN.md file.
              3/ Analyze the plan and the changes in the current branch, compared to main, and compose a concise title and description for the pull request.
              4/ The title should follow conventional commits structure. Use only feat, fix, chore, or docs.
              5/ The description should have a brief summary of the changes, and include sections to describe the changes made in each logical part of the system (UI, API, workers, database, ...).
              6/ Write the title to /tmp/TITLE and the description to /tmp/DESCRIPTION.md

              Write clearly, for humans, in ASD-STE100 / Simplified Technical English
          - name: Push output
            type: bash
            command: |-
              if [ -s /tmp/TITLE ] && [ -s /tmp/DESCRIPTION.md ]; then
                echo "Title and description found. Using as output"
                jq -n \
                  --rawfile title /tmp/TITLE \
                  --rawfile description /tmp/DESCRIPTION.md \
                  '{title: ($title | @base64), description: ($description | @base64)}' \
                  > "$SUPERPLANE_RESULT_FILE"
              else
                jq -n '{error: "Missing title and/or description at /tmp/TITLE and /tmp/DESCRIPTION.md"}' \
                  > "$SUPERPLANE_RESULT_FILE"
                echo "Missing title and/or description at /tmp/TITLE and /tmp/DESCRIPTION.md" >&2
              fi
      position:
        x: 1753
        'y': 120
      isCollapsed: false
    - id: create-draft-pr
      name: Create Draft Pull Request
      type: TYPE_ACTION
      component: github.createPullRequest
      configuration:
        base: main
        body: |-
          [Work Order]({{ order().url }}).

          {{ fromBase64(previous().data.result.description) }}

          <hr>

          Created via [SuperPlane](https://superplane.com).
        draft: true
        head: '{{ find(order().artifacts, {.type == "branch"}).data.name }}'
        repository: '{{ install_params.appRepository }}'
        title: '{{ fromBase64(previous().data.result.title) }}'
      position:
        x: 1706
        'y': 288
      isCollapsed: true
    - id: add-pr-label
      name: Add Label to Pull Request
      type: TYPE_ACTION
      component: github.addIssueLabel
      configuration:
        issueNumber: '{{ previous().data.number }}'
        labels:
          - factory
        repository: '{{ install_params.appRepository }}'
      position:
        x: 1706
        'y': 456
      isCollapsed: true
    - id: attach-pr-artifact
      name: Attach PR to Work Order
      type: TYPE_ACTION
      component: addWorkOrderArtifact
      configuration:
        artifactKey: '{{ $["Create Draft Pull Request"].data.html_url }}'
        artifactType: pr
        number: '{{ $["Create Draft Pull Request"].data.number }}'
        orderId: '{{ order().id }}'
        title: '{{ $["Create Draft Pull Request"].data.title }}'
        url: '{{ $["Create Draft Pull Request"].data.html_url }}'
      position:
        x: 1706
        'y': 624
      isCollapsed: true
    - id: set-pr-closure-note
      name: Set PR closure note
      type: TYPE_ACTION
      component: setWorkOrderStatusNote
      configuration:
        orderId: '{{ order().id }}'
        noteKey: pr-closure
        headline: Review the pull request
        body: When the pull request merges, this work order completes. If it closes without a merge, SuperPlane rejects the work order.
        ctaLabel: 'Review PR #{{ $["Create Draft Pull Request"].data.number }}'
        ctaUrl: '{{ $["Create Draft Pull Request"].data.html_url }}'
        showOnlyWhenWaiting: true
      position:
        x: 1706
        'y': 792
      isCollapsed: true
