apiVersion: v1
kind: Canvas
metadata:
  name: Implementation
  description: Create a branch and implement the plan with an agent.
spec:
  edges:
    - channel: default
      sourceId: onrun-implement
      targetId: create-branch
    - channel: passed
      sourceId: create-branch
      targetId: add-branch-artifact
    - channel: default
      sourceId: add-branch-artifact
      targetId: from-gh-issue-check
    - channel: "true"
      sourceId: from-gh-issue-check
      targetId: implementation-agent
    - channel: "false"
      sourceId: from-gh-issue-check
      targetId: implementation-agent-no-issue
  nodes:
    - id: onrun-implement
      name: Implement
      type: TYPE_TRIGGER
      component: onRun
      configuration: {}
      position:
        x: 1536
        'y': 144
      isCollapsed: true
    - id: create-branch
      name: Create Branch
      type: TYPE_ACTION
      component: runnerBash
      configuration:
        enable_setup_commands: false
        environmentFrom:
          - source: integration
            integration:
              name: github
        environment:
          - name: REPO
            value: '{{ install_params.appRepository }}'
            valueSource: literal
          - name: WORK_ORDER_TITLE
            value: '{{ order().title }}'
            valueSource: literal
          - name: BASE
            value: main
            valueSource: literal
        execution_mode: host
        execution_timeout_seconds: 3600
        machine_type: e1-large-amd64
        script: |-
          #!/usr/bin/env bash
          set -euo pipefail

          BASE="${BASE:-main}"
          SESSION_ID=$(date +%s)

          # Build a unique branch name: fix/{slug-of-issue-title}-{unix-timestamp}-{random}
          SLUG="$(printf '%s' "${WORK_ORDER_TITLE:-}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-50 | sed -E 's/-+$//')"
          [ -z "$SLUG" ] && SLUG="issue"
          RAND="$(openssl rand -hex 4 2>/dev/null || head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          BRANCH="fix/${SLUG}-${SESSION_ID}-${RAND}"

          GITURL="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          WORKDIR="repo"
          rm -rf "$WORKDIR"

          git config --global user.email "superplaneagent@superplane.com"
          git config --global user.name "SuperPlane Agent"

          git clone --depth 1 "$GITURL" "$WORKDIR"
          cd "$WORKDIR"

          # Create an empty branch off the base: a single empty commit so a draft PR can be opened,
          # with no files added.
          git checkout -b "$BRANCH"
          git commit -s --allow-empty -m "chore: initialize ${BRANCH}"
          git push -u origin "$BRANCH"

          echo "Pushed empty branch ${BRANCH}"

          # Respond with branch and session id
          printf '{"branch":"%s", "session":"%s"}\n' "$BRANCH" "$SESSION_ID" > "$SUPERPLANE_RESULT_FILE"
      position:
        x: 1536
        'y': 312
      isCollapsed: false
    - id: add-branch-artifact
      name: Add Branch Artifact
      type: TYPE_ACTION
      component: addWorkOrderArtifact
      configuration:
        artifactType: branch
        name: '{{ $["Create Branch"].data.result.branch }}'
        orderId: '{{ order().id }}'
        repository: '{{ install_params.appRepository }}'
      position:
        x: 1489
        'y': 480
      isCollapsed: true
    - id: from-gh-issue-check
      name: From GH issue?
      type: TYPE_ACTION
      component: if
      configuration:
        expression: '"source" in order()'
      position:
        x: 1489
        'y': 648
      isCollapsed: true
    - id: implementation-agent
      name: Agent - Implement from GH issue
      type: TYPE_ACTION
      component: runnerClaudeCode
      concurrency:
        max: 5
      configuration:
        credentials:
          source: integration
          integration:
            name: claude
        environmentFrom:
          - source: integration
            integration:
              name: github
        environment:
          - name: REPO
            value: '{{ order().source.repository.full_name }}'
            valueSource: literal
          - name: BRANCH
            value: '{{ $["Create Branch"].data.result.branch }}'
            valueSource: literal
          - name: ISSUE_NUMBER
            value: '{{ order().source.issue.number }}'
            valueSource: literal
          - name: PLAN
            value: '{{ toBase64(find(order().artifacts, {#.type == "markdown" && #.data.title == "PLAN.md"}).data.body) }}'
            valueSource: literal
        executionTimeoutSeconds: 3600
        machineType: e1-large-amd64
        model: sonnet
        steps:
          - name: Set Up Git User
            type: bash
            command: |-
              echo "Using superplaneagent@superplane.com"
              git config --global user.email "superplaneagent@superplane.com"
              git config --global user.name "SuperPlane Agent"
          - name: Provide Plan
            type: bash
            command: |-
              echo $PLAN | base64 -d > /tmp/PLAN.md
              cat /tmp/PLAN.md
          - name: Checkout Branch
            type: bash
            command: |-
              rm -rf repo
              git clone --depth 1 --branch "$BRANCH" "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" repo
              cd repo
          - name: Set Up DCO Signing
            type: bash
            workingDirectory: repo
            command: |-
              cat > .git/hooks/prepare-commit-msg <<'HOOK'
              printf '\n%s\n' "Signed-off-by: SuperPlane Agent <superplaneagent@superplane.com>" >> "$1"
              HOOK

              chmod +x .git/hooks/prepare-commit-msg
          - name: Implementation
            type: prompt
            workingDirectory: repo
            prompt: |-
              You are implementing a fix for a SuperPlane work order. The repository is already checked out in your current working directory, on the branch to work on.

              Repository: {{ order().source.repository.full_name }}
              Issue number: {{ order().source.issue.number }}
              Issue title: {{ order().source.issue.title }}

              1/ The preliminary plan is at /tmp/PLAN.md. Read it before writing any implementation.
              2/ Gather context. Using the GitHub token in the GITHUB_TOKEN environment variable, read the FULL issue and ALL of its comments before writing any code.
              3/ Implement. Make the code changes required to resolve the issue and address the discussion in the comments.
              4/ Keep the change focused and commit your work to the current branch with clear commit messages.

              Guidelines:

              1/ Focus on clean code.
              2/ Make long term fixes, not fast patches.
              3/ Add tests where it makes sense.
          - name: Commit and Push
            type: bash
            workingDirectory: repo
            command: |-
              set -euo pipefail
              git add -A
              if ! git diff --cached --quiet; then
                git commit -s -m "fix: implement issue #${ISSUE_NUMBER} via SuperPlane"
              fi
              if git rev-parse --verify "origin/${BRANCH}" >/dev/null 2>&1; then
                if [ "$(git rev-list --count "origin/${BRANCH}..HEAD")" -eq 0 ]; then
                  echo "No file changes and no unpushed commits on ${BRANCH}" >&2
                  exit 1
                fi
              fi
              git push origin "$BRANCH"
              echo "Pushed implementation to $BRANCH"
      position:
        x: 1442
        'y': 816
      isCollapsed: false
    - id: implementation-agent-no-issue
      name: Agent - Implement from order description
      type: TYPE_ACTION
      component: runnerClaudeCode
      concurrency:
        max: 5
      configuration:
        credentials:
          source: integration
          integration:
            name: claude
        environmentFrom:
          - source: integration
            integration:
              name: github
        environment:
          - name: REPO
            value: '{{ install_params.appRepository }}'
            valueSource: literal
          - name: BRANCH
            value: '{{ $["Create Branch"].data.result.branch }}'
            valueSource: literal
          - name: ORDER_DESCRIPTION
            value: '{{ toBase64(order().description) }}'
            valueSource: literal
          - name: PLAN
            value: '{{ toBase64(find(order().artifacts, {#.type == "markdown" && #.data.title == "PLAN.md"}).data.body) }}'
            valueSource: literal
        executionTimeoutSeconds: 3600
        machineType: e1-large-amd64
        model: sonnet
        steps:
          - name: Set Up Git User
            type: bash
            command: |-
              echo "Using superplaneagent@superplane.com"
              git config --global user.email "superplaneagent@superplane.com"
              git config --global user.name "SuperPlane Agent"
          - name: Provide order
            type: bash
            command: |-
              echo $ORDER_DESCRIPTION | base64 -d > /tmp/ORDER.md
              cat /tmp/ORDER.md
          - name: Provide Plan
            type: bash
            command: |-
              echo $PLAN | base64 -d > /tmp/PLAN.md
              cat /tmp/PLAN.md
          - name: Checkout Branch
            type: bash
            command: |-
              rm -rf repo
              git clone --depth 1 --branch "$BRANCH" "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" repo
              cd repo
          - name: Set Up DCO Signing
            type: bash
            workingDirectory: repo
            command: |-
              cat > .git/hooks/prepare-commit-msg <<'HOOK'
              printf '\n%s\n' "Signed-off-by: SuperPlane Agent <superplaneagent@superplane.com>" >> "$1"
              HOOK

              chmod +x .git/hooks/prepare-commit-msg
          - name: Implementation
            type: prompt
            workingDirectory: repo
            prompt: |-
              You are implementing a fix for a SuperPlane work order. The repository is already checked out in your current working directory, on the branch to work on.

              Repository: {{ install_params.appRepository }}
              Work order title: {{ order().title }}

              1/ The original work order description is at /tmp/ORDER.md. Read it before implementing.
              2/ The preliminary plan is at /tmp/PLAN.md. Read it before writing any implementation.
              3/ Implement. Make the code changes required to resolve the work order description and plan.
              4/ Keep the change focused and commit your work to the current branch with clear commit messages.

              Guidelines:

              1/ Focus on clean code.
              2/ Make long term fixes, not fast patches.
              3/ Add tests where it makes sense.
          - name: Commit and Push
            type: bash
            workingDirectory: repo
            command: |-
              set -euo pipefail
              git add -A
              if ! git diff --cached --quiet; then
                git commit -s -m "fix: implement work order via SuperPlane"
              fi
              if git rev-parse --verify "origin/${BRANCH}" >/dev/null 2>&1; then
                if [ "$(git rev-list --count "origin/${BRANCH}..HEAD")" -eq 0 ]; then
                  echo "No file changes and no unpushed commits on ${BRANCH}" >&2
                  exit 1
                fi
              fi
              git push origin "$BRANCH"
              echo "Pushed implementation to $BRANCH"
      position:
        x: 1770
        'y': 816
      isCollapsed: false
