apiVersion: v1
kind: Console
metadata:
  name: Software Factory
  canvasId: __FACTORY_CANVAS_ID__
spec:
  panels:
    - id: instructions
      type: markdown
      content:
        body: |
          > [!SECTION:setup] Quick start
          >
          > 1. Describe the work in **Create a task** and submit.
          > 2. Or add the `factory` label to an existing issue.
          > 3. Or assign the issue to `superplaneagent`.
          > 4. Or mention `@superplaneagent` on an issue.
          >
          > Each path fires the factory and shows up on the **PR pipeline** board.
          > [!SECTION:runbook] How the factory works
          >
          > 1. [Create Branch](node:runner-create-branch-2) and [Open Draft PR](node:github-create-pr-2) set up the workstream.
          > 2. [Write Plan](node:implementation-implementation-2-ilbopr) drafts the approach.
          > 3. [Implementation](node:run-claude-code-implementation) applies the change.
          > 4. [Wait for PR Checks](node:wait-for-pr-checks) watches CI; [Checks Loop](node:ci-loop) retries repairs up to five times.
          > 5. [Mark PR Ready](node:github-markpullrequestreadyforreview-github-markpullrequestreadyforreview-wie92w) moves the card to **Human review**.
          > [!SECTION:run] Follow-ups
          >
          > Mention `@superplaneagent` on a PR conversation or review comment.
          > The request is applied on the existing branch and CI is babysat again via
          > [On mention on PR](node:on-pr-comment-trigger).
          > [!SECTION:troubleshoot] Board columns
          >
          > | Column | Meaning |
          > | ------ | ------- |
          > | In progress | Draft PR open; plan, implement, or CI still running |
          > | Human review | Ready for a person to review |
          > | Failed | Run failed or was cancelled |
          > | Done | Run passed |
        title: How the factory works
    - id: submit-task
      type: nodes
      content:
        nodes:
          - formMode: inline
            node: create-task-start
            promptConfirmation: false
            showFieldLabels: false
            showNodeLabel: false
            showRun: true
            submitLabel: Start factory
            triggerName: Create Task
        title: Create a task
    - id: pipeline-board
      type: board
      content:
        dataSource:
          kind: memory
          namespace: factory_tasks
        render:
          card:
            fields:
              - field: pr_number
                format: link
                href: '{{ pr_url }}'
                label: PR
              - field: issue_number
                format: link
                href: '{{ issue_url }}'
                label: Issue
              - field: '{{ epochMs(updatedAt) - epochMs(createdAt) }}'
                format: duration
                label: Elapsed
              - field: cost_usd
                format: number
                label: Cost
              - field: total_tokens
                format: number
                label: Tokens
            titleField: title
          emptyMessage: No factory tasks yet. Submit a task above to start one.
          groupBy: status
          kind: board
          lanes:
            - label: In progress
              value: in_progress
            - label: Human review
              value: human_review
            - label: Failed
              value: failed
            - label: Done
              value: done
          otherLane: false
          sort:
            field: updatedAt
            order: desc
        title: PR pipeline
  layout:
    - i: instructions
      x: 0
      'y': 8
      w: 3
      h: 6
      minW: 3
      minH: 5
    - i: submit-task
      x: 0
      'y': 0
      w: 3
      h: 8
      minW: 3
      minH: 5
    - i: pipeline-board
      x: 3
      'y': 0
      w: 9
      h: 14
      minW: 8
      minH: 7
