    - id: runner-create-branch-2
      name: Create Branch
      type: TYPE_ACTION
      component: runnerBash
      configuration:
        enable_setup_commands: false
        environmentFrom:
          - source: integration
            integration:
              name: github
        environment:
          - name: REPO
            value: '{{ install_params.appRepository }}'
            valueSource: literal
          - name: ISSUE_TITLE
            value: '{{ root().data.issue.title }}'
            valueSource: literal
        execution_mode: host
        execution_timeout_seconds: 600
        machine_type: e1-large-amd64
        script: |
          #!/usr/bin/env bash
          set -euo pipefail

          export GH_TOKEN="$GITHUB_TOKEN"
          : "${REPO:?REPO is required}"

          # Resolve the repository default branch (not every repo uses main).
          BASE="$(gh api "repos/${REPO}" --jq .default_branch)"
          : "${BASE:?failed to resolve default branch}"

          # Build branch name: fix/<slug-of-issue-title>-<unix-timestamp>-<randbytes>
          SLUG="$(printf '%s' "${ISSUE_TITLE:-}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-50 | sed -E 's/-+$//')"
          [ -n "$SLUG" ] || SLUG="task"
          TIMESTAMP="$(date +%s)"
          RAND="$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          BRANCH="fix/${SLUG}-${TIMESTAMP}-${RAND}"

          GITURL="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          WORKDIR="repo"

          echo "REPLACE ME WITH: git user.name and user.email for automation commits"
          git config --global user.email "automation@example.com"
          git config --global user.name "Factory Automation"

          rm -rf "$WORKDIR"
          git clone --depth 1 --branch "$BASE" "$GITURL" "$WORKDIR"
          cd "$WORKDIR"

          # Create an empty branch off the base: a single empty commit so a draft PR can be opened,
          # with no files added.
          git checkout -b "$BRANCH"
          git commit -s --allow-empty -m "chore: initialize ${BRANCH}"
          git push -u origin "$BRANCH"

          echo "Pushed empty branch ${BRANCH} (base ${BASE})"

          # Respond with branch metadata
          printf '{"branch":"%s","base":"%s","session":"%s","slug":"%s","rand":"%s"}\n' "$BRANCH" "$BASE" "$TIMESTAMP" "$SLUG" "$RAND" > "$SUPERPLANE_RESULT_FILE"
