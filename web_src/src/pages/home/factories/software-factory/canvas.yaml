            valueSource: literal
          - name: BRANCH
            value: '{{ $["Create Branch"].data.result.branch }}'
            valueSource: literal
        executionTimeoutSeconds: 3600
        machineType: e1-large-amd64
        steps:
          - command: 'echo "REPLACE ME WITH: git user.name and user.email for automation commits"'
            name: Set Up Git User
            type: bash
          - command: |-
              set -euo pipefail
              rm -rf repo
              git clone --depth 1 --branch "$BRANCH" "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" repo
              cd repo
            name: Checkout branch
            type: bash
          - command: 'echo "REPLACE ME WITH: commit signing / DCO prepare-commit-msg hook for your org"'
            name: Set Up DCO Signing
            type: bash
            workingDirectory: repo
          - command: 'echo "REPLACE ME WITH: project setup commands (install deps, start services, etc.)"'
            name: Set up DevEnv
            type: bash
            workingDirectory: repo
          - name: Implementation
            workingDirectory: repo
            prompt: |-
              You are implementing a fix for a GitHub issue. The repository is already checked out in your current working directory, on the branch to work on.

              Repository: {{ install_params.appRepository }}
              Issue number: {{ root().data.issue.number }}
              Issue title: {{ root().data.issue.title }}

              1/ Gather context. Using the GitHub token in the GITHUB_TOKEN environment variable, read the FULL issue and ALL of its comments before writing any code.
              2/ Implement. Make the code changes required to resolve the issue and address the discussion in the comments.
              3/ Keep the change focused and commit your work to the current branch with clear commit messages.

              Guidelines:

              1/ Focus on clean code.
              2/ Make long term fixes, not fast patches.
              3/ Add tests where it makes sense.
            type: prompt
          - command: 'echo "REPLACE ME WITH: project format/lint commands"'
            name: Format JS and Go code
            type: bash
            workingDirectory: repo
          - command: |
              set -euo pipefail
              echo "cwd=$(pwd -P)"
              git status
              git log --oneline -5
              git add -A
              if ! git diff --cached --quiet; then
                git commit -s -m "fix: implement issue #${ISSUE_NUMBER} via SuperPlane"
              fi
              if git rev-parse --verify "origin/${BRANCH}" >/dev/null 2>&1; then
                if [ "$(git rev-list --count "origin/${BRANCH}..HEAD")" -eq 0 ]; then
                  echo "No file changes and no unpushed commits on ${BRANCH}" >&2
                  exit 1
                fi
              fi
              git push origin "$BRANCH"
              echo "Pushed implementation to $BRANCH"
            name: Commit and push
            type: bash
            workingDirectory: repo
        credentials:
