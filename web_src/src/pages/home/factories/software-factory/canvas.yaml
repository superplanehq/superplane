    - id: wait-for-pr-checks
      name: Wait for PR Checks
      type: TYPE_ACTION
      component: runnerBash
      configuration:
        enable_setup_commands: false
        environmentFrom:
          - source: integration
            integration:
              name: github
        environment:
          - name: REPO
            value: '{{ root().data.parameters.Repository }}'
            valueSource: literal
          - name: PR_NUMBER
            value: '{{ root().data.parameters.PullRequestNumber }}'
            valueSource: literal
        execution_mode: host
        execution_timeout_seconds: 3600
        machine_type: e1-tiny-amd64
        script: |
          #!/usr/bin/env bash
          set -uo pipefail

          : "${REPO:?REPO is required}"
          : "${PR_NUMBER:?PR_NUMBER is required}"
          export GH_TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

          # Ensure the GitHub CLI is available on the runner host; install a static build if missing.
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh not found; installing GitHub CLI..."
            GH_VERSION="2.62.0"
            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64|amd64) GH_ARCH="amd64" ;;
              aarch64|arm64) GH_ARCH="arm64" ;;
              *) echo "Unsupported architecture: $ARCH" >&2; exit 1 ;;
            esac
            TMP="$(mktemp -d)"
            curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${GH_ARCH}.tar.gz" -o "$TMP/gh.tgz"
            tar -xzf "$TMP/gh.tgz" -C "$TMP"
            SRC="$TMP/gh_${GH_VERSION}_linux_${GH_ARCH}/bin/gh"
            if ! install -m 0755 "$SRC" /usr/local/bin/gh 2>/dev/null; then
              mkdir -p "$HOME/.local/bin"
              install -m 0755 "$SRC" "$HOME/.local/bin/gh"
            fi
            command -v gh >/dev/null 2>&1 || { echo "gh install failed" >&2; exit 1; }
            echo "Installed $(gh --version | head -1)"
          fi

          # Phase 1: wait up to a 1 minute grace for at least one check to REGISTER on the PR
          # head. gh pr checks --watch only waits for checks that already exist, so right after
          # a push there is a window with zero checks; we must wait for them to appear.
          GRACE_DEADLINE=$(( $(date +%s) + 60 ))
          while :; do
            PROBE="$(gh pr checks "$PR_NUMBER" --repo "$REPO" 2>&1)" || true
            if ! printf '%s' "$PROBE" | grep -qiE "no checks reported|no check runs"; then
              echo "Checks are registered on PR #${PR_NUMBER}; waiting for them to complete."
              break
            fi
            if [ "$(date +%s)" -ge "$GRACE_DEADLINE" ]; then
              echo "No checks appeared within the 1 minute grace for PR #${PR_NUMBER}; treating as no CI configured."
              printf '{"status":"success","failing_count":0,"note":"no_checks"}\n' > "$SUPERPLANE_RESULT_FILE"
              exit 0
            fi
            echo "No checks registered yet on PR #${PR_NUMBER}; waiting for them to appear..."
            sleep 10
          done

          # Phase 2: wait for all registered checks to finish. gh exits 0 when all pass,
          # non-zero when any fail.
          OUT="$(gh pr checks "$PR_NUMBER" --repo "$REPO" --watch --interval 30 2>&1)"
          RC=$?

          echo "$OUT"

          if [ "$RC" -eq 0 ]; then
            echo "All checks passed for PR #${PR_NUMBER}."
            printf '{"status":"success","failing_count":0}\n' > "$SUPERPLANE_RESULT_FILE"
            exit 0
          fi

          FAILING_COUNT="$(printf '%s\n' "$OUT" | awk -F '\t' 'tolower($2) ~ /fail|error|cancel|timed_out|action_required/ {c++} END{print c+0}')"
          echo "Detected ${FAILING_COUNT} failing check(s) for PR #${PR_NUMBER}."
          printf '{"status":"failure","failing_count":%s}\n' "$FAILING_COUNT" > "$SUPERPLANE_RESULT_FILE"
          exit 1
