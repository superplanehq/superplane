              1. Put double quotes around every key and every string value.
              2. Include exactly two keys: "title" and "body".
              3. Escape every character that would otherwise break JSON — in particular, encode newlines inside "body" as \n and escape any double quotes as \".
              4. No trailing commas, and no text before or after the object.

