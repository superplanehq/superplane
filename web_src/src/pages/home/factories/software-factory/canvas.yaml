    - id: implementation-implementation-2-ilbopr
      name: Write Plan
      type: TYPE_ACTION
      component: runnerClaudeCode
      configuration:
        environmentFrom:
          - source: integration
            integration:
              name: github
        environment:
          - name: REPO
            value: '{{ install_params.appRepository }}'
            valueSource: literal
          - name: BRANCH
            value: '{{ $["Create Branch"].data.result.branch }}'
            valueSource: literal
          - name: PR_NUMBER
            value: '{{ $["Open Draft PR"].data.number }}'
            valueSource: literal
        executionTimeoutSeconds: 3600
        machineType: e1-large-amd64
        steps:
          - command: |-
              export GH_TOKEN="$GITHUB_TOKEN"
              rm -rf repo
              git clone --depth 1 --branch "$BRANCH" "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" repo
              cd repo
            name: Checkout branch
            type: bash
          - name: Write implementation plan
            workingDirectory: repo
            prompt: |-
              You are writing an implementation plan for a GitHub issue. The repository is checked out in your current working directory on the working branch.

              Repository: {{ install_params.appRepository }}
              Issue number: {{ root().data.issue.number }}
              Issue title: {{ root().data.issue.title }}

              1/ Gather context: using the GitHub token in the GITHUB_TOKEN environment variable, read the FULL issue and all of its comments, and inspect the codebase as needed.
              2/ Write the plan to the file /tmp/plan.md. Do NOT create any files inside the repository, and do NOT commit anything.

              Format the plan EXACTLY like this, and output nothing else to the file:
              - Start with a very short, high-level summary: 1-3 concise sentences or a few bullets. Clear and to the point. No heading above it.
              - Then a collapsed details section that covers everything else (approach, concrete steps, architecture, tradeoffs, pros/cons, and mermaid diagrams if helpful), using exactly this structure:

              <details>
              <summary>Implementation plan</summary>

              ...full details here...

              </details>

              Write clearly, for humans. Keep the top summary genuinely short.
            type: prompt
          - command: |-
              export GH_TOKEN="$GITHUB_TOKEN"
              [ -s /tmp/plan.md ] || { echo "No plan produced at /tmp/plan.md" >&2; exit 1; }
              CUR="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body -q .body)"
              NEW="$(CUR="$CUR" python3 -c 'import os
              cur=os.environ["CUR"]
              plan=open("/tmp/plan.md").read().strip()
              marker="### Summary\n\nTODO"
              if marker in cur:
                  print(cur.replace(marker, "### Summary\n\n"+plan, 1))
              else:
                  print(cur.replace("TODO", plan, 1))')"
              gh pr edit "$PR_NUMBER" --repo "$REPO" --body "$NEW"
              echo "Updated PR #$PR_NUMBER description with the implementation plan"
            name: Update PR description
            type: bash
        credentials:
          source: integration
          integration:
            name: claude
