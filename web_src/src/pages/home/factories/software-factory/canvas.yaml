    - id: fix-ci-claude
      name: Review & Fix PR Checks
      type: TYPE_ACTION
      component: runnerClaudeCode
      configuration:
        environmentFrom:
          - source: integration
            integration:
              name: github
        environment:
          - name: REPO
            value: '{{ root().data.parameters.Repository }}'
            valueSource: literal
          - name: PR_NUMBER
            value: '{{ root().data.parameters.PullRequestNumber }}'
            valueSource: literal
        executionTimeoutSeconds: 3600
        machineType: e1-large-amd64
        steps:
          - command: 'echo "REPLACE ME WITH: git user.name and user.email for automation commits"'
            name: Set Up Git User
            type: bash
          - command: |-
              export GH_TOKEN="$GITHUB_TOKEN"
              rm -rf repo
              gh repo clone "$REPO" repo
              cd repo
              gh pr checkout "$PR_NUMBER"
              # Embed the token so later git push is non-interactive (gh clone leaves a bare https remote).
              git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
            name: Checkout PR
            type: bash
          - command: 'echo "REPLACE ME WITH: commit signing / DCO prepare-commit-msg hook for your org"'
            name: Set Up DCO Signing
            type: bash
            workingDirectory: repo
          - name: Review and fix failing checks
            workingDirectory: repo
            prompt: |-
              One or more checks are failing on this pull request. The repository is already checked out in your current working directory, on the PR branch.

              Repository: {{ root().data.parameters.Repository }}
              Pull Request: #{{ root().data.parameters.PullRequestNumber }}

              1/ List every check on this PR and identify the failing ones:
                 gh pr checks "{{ root().data.parameters.PullRequestNumber }}" --repo "{{ root().data.parameters.Repository }}"
                 This includes GitHub Actions runs, third-party check apps, and commit statuses. Review ALL of them, not just "CI".

              2/ Understand each failure:
                 - For GitHub Actions checks, inspect the logs: find the run id and run `gh run view <run-id> --repo "$REPO" --log-failed`.
                 - For other checks/statuses, open the check's details URL from `gh pr checks`, and/or reproduce locally by running the project's build, tests, linters, or type checks.

