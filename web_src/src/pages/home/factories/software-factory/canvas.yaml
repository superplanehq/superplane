    - id: run-claude-code-implementation
      name: Implementation
      type: TYPE_ACTION
      component: runnerClaudeCode
      configuration:
        environmentFrom:
          - source: integration
            integration:
              name: github
        environment:
          - name: REPO
            value: '{{ install_params.appRepository }}'
            valueSource: literal
          - name: ISSUE_NUMBER
