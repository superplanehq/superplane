      <rect x="598" y="375" width="42" height="48" rx="4" opacity="0.80"/>
      <rect x="672" y="323" width="42" height="100" rx="4"/>
      <rect x="746" y="388" width="42" height="35" rx="4" opacity="0.72"/>
      <rect x="820" y="416" width="42" height="7" rx="4" opacity="0.50"/>
