      <rect x="154" y="354" width="42" height="69" rx="4" opacity="0.88"/>
      <rect x="228" y="371" width="42" height="52" rx="4" opacity="0.82"/>
      <rect x="302" y="406" width="42" height="17" rx="4" opacity="0.58"/>
      <rect x="376" y="406" width="42" height="17" rx="4" opacity="0.58"/>
