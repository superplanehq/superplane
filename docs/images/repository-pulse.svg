      <rect x="64" y="7" width="11" height="16" rx="2" fill="#A88E33"/><rect x="80" y="1" width="11" height="22" rx="2" fill="#F4D35E"/>
      <rect x="96" y="10" width="11" height="13" rx="2" fill="#7B6929"/><rect x="112" y="5" width="11" height="18" rx="2" fill="#C7A93F"/>
      <rect x="128" y="13" width="11" height="10" rx="2" fill="#4C4220"/><rect x="144" y="8" width="11" height="15" rx="2" fill="#A88E33"/>
      <rect x="160" y="2" width="11" height="21" rx="2" fill="#F4D35E"/><rect x="176" y="6" width="11" height="17" rx="2" fill="#C7A93F"/>
      <rect x="192" y="14" width="11" height="9" rx="2" fill="#4C4220"/><rect x="208" y="9" width="11" height="14" rx="2" fill="#7B6929"/>
      <rect x="224" y="4" width="11" height="19" rx="2" fill="#D9BB4D"/><rect x="240" y="12" width="11" height="11" rx="2" fill="#675824"/>
      <rect x="256" y="7" width="11" height="16" rx="2" fill="#A88E33"/><rect x="272" y="1" width="11" height="22" rx="2" fill="#F4D35E"/>
