    <path d="M60 501C60 494 70 492 70 500C70 492 80 494 80 501C80 508 70 514 70 514C70 514 60 508 60 501Z" stroke="#58D68D" stroke-width="2"/>
    <text x="94" y="509" fill="#58D68D" font-size="13" font-weight="700" letter-spacing="0.8">TOP CONTRIBUTORS</text>
    <text x="300" y="508" fill="#B9F6CF" font-size="14">Pedro Leão</text>
    <text x="492" y="508" fill="#B9F6CF" font-size="14">Igor Šarčević</text>
