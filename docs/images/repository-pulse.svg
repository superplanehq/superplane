<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SuperPlane repository activity</title>
  <desc id="desc">A yellow and black dashboard showing recent commits, open issues, open pull requests and top contributors.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11110D"/>
      <stop offset="0.52" stop-color="#171610"/>
      <stop offset="1" stop-color="#211D0D"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFE995"/>
      <stop offset="1" stop-color="#F4D35E"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#F4D35E" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="558" rx="22" fill="url(#bg)" stroke="#3B382A" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="556" rx="21" fill="url(#grid)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
