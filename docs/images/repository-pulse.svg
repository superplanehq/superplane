    <text x="88" y="55" fill="#F8F5E9" font-size="28" font-weight="700">Repository activity</text>
    <text x="1160" y="52" fill="#A9A596" font-size="14" text-anchor="end">Last updated Sep 1, 2026</text>

    <rect x="36" y="82" width="1128" height="70" rx="12" fill="#171712" stroke="#4B4633"/>
    <circle cx="64" cy="117" r="8" fill="#F4D35E" filter="url(#glow)"/>
    <text x="84" y="113" fill="#F4D35E" font-size="13" font-weight="700" letter-spacing="1.2">LAST 30 DAYS</text>
    <text x="84" y="135" fill="#F8F5E9" font-size="18" font-weight="650">242 commits across the SuperPlane project</text>
    <g transform="translate(830 103)">
