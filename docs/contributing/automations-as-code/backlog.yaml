apiVersion: v2
kind: Automation
name: Inspect incoming tasks
icon: search
timeout_seconds: 900

triggers:
  - use: manual
  - use: task_enters_stage

steps:
  - name: Inspect the checkout
    bash: git status --short
  - name: Summarize the task
    prompt: |
      Summarize the requested change.
      Identify the files and tests most relevant to it.
