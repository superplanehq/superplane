apiVersion: v2
kind: Automation
name: Print the automation marker
triggers:
  - id: weekday-morning
    use: schedule
    config:
      cron: "0 9 * * 1-5"
      utc_offset: 1
  - id: friday-afternoon
    use: schedule
    config:
      cron: "30 16 * * 5"
      utc_offset: 1
steps:
  - name: Print the marker
    bash: |
      printf '%s\n' 'automation-v2-marker'
