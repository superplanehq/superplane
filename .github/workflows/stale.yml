name: Close stale pull requests

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v10
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 14
          days-before-pr-close: 16
          stale-pr-label: stale
          stale-pr-message: >
            Thanks for sending this. It has been quiet for a couple of weeks,
            so I am marking it stale for now.

            If you still want to work on it, leave a comment and we will pick
            it up. Otherwise we will close it in another two weeks.
          close-pr-message: >
            I am going to close this one for now since it has been quiet.

            Thank you for sending it. If you want to pick it up later, talk
            with us first and open a new pull request. Happy to help you land
            it.
