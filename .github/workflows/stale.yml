name: Close stale pull requests

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v10
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 14
          days-before-pr-close: 16
          stale-pr-label: stale
          stale-pr-message: >
            Thanks for the contribution. This pull request has had no activity
            for 14 days, so I am marking it as stale.

            If you still want to work on it, leave a comment and we can pick it
            up. If there is no further activity, we will close it at 30 days.
          close-pr-message: >
            I am closing this pull request because it has been inactive.

            Thank you for the contribution. If you would like to continue,
            please talk with us first, then open a new pull request. See the
            contributing guide.
