# SuperPlane Bitbucket Forge app.
#
# Export the app ID and remote URL variables for local development.
# Defaults target the Cloud app.
#
# The scheduled trigger calls the remote directly so the system token is
# valid for at least two hours. Do not route that trigger through a function.
modules:
  trigger:
    - key: lifecycle-trigger
      endpoint: lifecycle
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app
    - key: pull-request-trigger
      endpoint: pull-request-events
      events:
        - avi:bitbucket:created:pullrequest
        - avi:bitbucket:updated:pullrequest
        - avi:bitbucket:fulfilled:pullrequest
        - avi:bitbucket:rejected:pullrequest
        - avi:bitbucket:created:pullrequest-comment
        - avi:bitbucket:created:build-status
        - avi:bitbucket:updated:build-status
  preUninstall:
    - key: uninstall-hook
      endpoint: uninstall
  scheduledTrigger:
    - key: token-refresh-trigger
      endpoint: token-refresh
      interval: fiveMinute
  webtrigger:
    - key: bootstrap-trigger
      function: bootstrap
  bitbucket:workspaceGlobalPage:
    - key: superplane-setup
      resource: setup
      resolver:
        endpoint: setup-remote
      render: native
      title: SuperPlane
  function:
    - key: bootstrap
      handler: index.bootstrap
  endpoint:
    - key: pull-request-events
      remote: superplane
      route:
        path: /api/v1/bitbucket/forge/events
      auth:
        appSystemToken:
          enabled: true
    - key: lifecycle
      remote: superplane
      route:
        path: /api/v1/bitbucket/forge/lifecycle
      auth:
        appSystemToken:
          enabled: true
    - key: token-refresh
      remote: superplane
      route:
        path: /api/v1/bitbucket/forge/scheduled
      auth:
        appSystemToken:
          enabled: true
    - key: uninstall
      remote: superplane
      route:
        path: /api/v1/bitbucket/forge/uninstall
      auth:
        appSystemToken:
          enabled: true
    - key: bootstrap-remote
      remote: superplane
      route:
        path: /api/v1/bitbucket/forge/bootstrap
      auth:
        appSystemToken:
          enabled: true
    - key: setup-remote
      remote: superplane
      auth:
        appSystemToken:
          enabled: true

environment:
  variables:
    - key: SUPERPLANE_BITBUCKET_FORGE_APP_ID
      default: ari:cloud:ecosystem::app/670a54a2-2536-4fa3-aae8-09379ab0623c
    - key: SUPERPLANE_BITBUCKET_FORGE_REMOTE_URL
      default: https://app.superplane.com

remotes:
  - key: superplane
    baseUrl: ${SUPERPLANE_BITBUCKET_FORGE_REMOTE_URL}
    operations:
      - compute
    auth:
      appSystemToken:
        enabled: true

permissions:
  scopes:
    - read:app-system-token
    - read:repository:bitbucket
    - write:repository:bitbucket
    - read:pullrequest:bitbucket
    - write:pullrequest:bitbucket
    - read:workspace:bitbucket

app:
  id: ${SUPERPLANE_BITBUCKET_FORGE_APP_ID}
  runtime:
    name: nodejs22.x
  licensing:
    enabled: false

resources:
  - key: setup
    path: src/frontend/setup.jsx
