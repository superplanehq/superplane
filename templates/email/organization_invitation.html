<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>SuperPlane invitation</title></head>
<body>
  <h1>Join {{.OrganizationName}} on SuperPlane</h1>
  <p>{{.InviterName}} invited you to join {{.OrganizationName}} with the role {{.Role}}.</p>
  <p><a href="{{.AcceptanceURL}}">Accept the invitation</a></p>
  <p>This invitation expires on {{.ExpiresAt}}.</p>
  <p>If you do not know this organization, you can ignore this email.</p>
</body>
</html>
