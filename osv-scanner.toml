# Shared OSV-Scanner license exceptions. These do not suppress vulnerabilities.
# Permitted licenses are listed in scripts/permitted-licenses.txt.

[[PackageOverrides]]
name = "@csstools/color-helpers"
ecosystem = "npm"
license.ignore = true
reason = "Package is MIT-0 (MIT No Attribution); permissive and compatible with Apache-2.0."

[[PackageOverrides]]
name = "@csstools/css-syntax-patches-for-csstree"
ecosystem = "npm"
license.ignore = true
reason = "Package is MIT-0 (MIT No Attribution); transitive jsdom/css-tree dependency, compatible with Apache-2.0."

[[PackageOverrides]]
name = "argparse"
ecosystem = "npm"
license.ignore = true
reason = "Python-2.0 license; bundled tooling dependency, compatible with Apache-2.0."

[[PackageOverrides]]
name = "elkjs"
ecosystem = "npm"
license.ignore = true
reason = "Eclipse Public License 2.0; layout library used at build time, compatible with project licensing policy."

[[PackageOverrides]]
name = "khroma"
ecosystem = "npm"
license.override = ["MIT"]
reason = "MIT license per upstream repository; deps.dev reports UNKNOWN due to missing package.json license field."

[[PackageOverrides]]
name = "posthog-js"
ecosystem = "npm"
license.ignore = true
reason = "License reported as SEE LICENSE IN LICENSE; dependency vetted for SuperPlane UI analytics use."

[[PackageOverrides]]
name = "stdlib"
ecosystem = "Go"
license.override = ["BSD-3-Clause"]
reason = "Go stdlib is licensed under BSD-3-Clause, see https://go.dev/LICENSE"

[[PackageOverrides]]
name = "robust-predicates"
ecosystem = "npm"
license.ignore = true
reason = "Unlicense; retain the existing approval for this geometry dependency."

[[PackageOverrides]]
name = "gopkg.in/dnaeon/go-vcr.v2"
ecosystem = "Go"
license.override = ["BSD-2-Clause"]
reason = "BSD-2-Clause per the upstream repository; retain the existing license decision."

[[PackageOverrides]]
name = "modernc.org/mathutil"
ecosystem = "Go"
license.override = ["BSD-3-Clause"]
reason = "BSD-3-Clause per deps.dev; retain the existing license decision."
