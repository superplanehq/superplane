apiVersion: v1
kind: Canvas
metadata:
  name: Implement
  description: Create a branch, implement the task, and open a pull request.
spec:
  edges:
    - channel: default
      sourceId: onrun-implement
      targetId: implementation-agent-no-issue
    - channel: passed
      sourceId: implementation-agent-no-issue
      targetId: add-branch-artifact
    - channel: default
      sourceId: add-branch-artifact
      targetId: find-pr
    - channel: notFound
      sourceId: find-pr
      targetId: create-pr
    - channel: found
      sourceId: find-pr
      targetId: update-pr
    - channel: default
      sourceId: create-pr
      targetId: attach-pr-artifact
    - channel: default
      sourceId: update-pr
      targetId: attach-pr-artifact-updated
    - channel: failed
      sourceId: implementation-agent-no-issue
      targetId: add-run-error
  nodes:
    - id: onrun-implement
      name: Start Implementation
      type: TYPE_TRIGGER
      component: onRun
      configuration: {}
      position:
        x: 1542
        "y": 144
      isCollapsed: true
    - id: implementation-agent-no-issue
      name: Implement From Task Description
      type: TYPE_ACTION
      component: runnerClaudeCode
      concurrency:
        max: 5
      configuration:
        credentials:
          source: integration
          integration:
            name: claude
        environmentFrom:
          - source: integration
            integration:
              name: bitbucket
        environment:
          - name: REPO_URL
            value: "{{ task().repository_url }}"
            valueSource: literal
          - name: BASE
            value: "{{ task().default_branch }}"
            valueSource: literal
          - name: COAUTHORS
            value: '{{ join(map(filter(task().assignees, {#.email != ""}), "Co-authored-by: " + #.name + " <" + #.email + ">"), "\n") }}'
            valueSource: literal
          - name: CHECKOUT_COMMIT_SETUP
            value: "1"
            valueSource: literal
        executionTimeoutSeconds: 3600
        machineType: e1-large-amd64
        model: claude-opus-5-5
        steps:
          - name: Implementation
            type: prompt
            workingDirectory: repo
            prompt: |-
              You are implementing a SuperPlane task. The repository is cloned in the current working directory on {{ task().default_branch }}.

              If the repository had no commits, the clone step already pushed an initial commit on {{ task().default_branch }}. Do not change that commit.

              Repository: {{ task().repository }}
              Task title: {{ task().title }}

              Task description:
              {{ task().description }}{{ task().spec != "" ? "\n\nSpec:\n" + task().spec : "" }}

              Repository instructions:

              Read the applicable repository instructions before making changes. Check AGENTS.md, CLAUDE.md, contribution documentation, and instructions for the affected paths. Discover and read applicable SKILL.md files, including skills referenced by those instructions.
              Follow repository conventions for implementation, testing, and commit messages. Repository instructions take precedence over the general defaults below. The automation still controls branch creation, pushing, commit identity, and pull request creation. Do not replace repository-owned instructions or skills with workspace copies.

              1/ Create a new branch. Do not commit on {{ task().default_branch }}.
              2/ Implement the task. Keep the change focused.
              3/ Commit on the working branch with clear messages.
              4/ Do not create or open the pull request. Only commit and push to the working branch. The automation opens or updates the pull request after you finish.

              Guidelines:

              1/ Focus on clean code.
              2/ Make long term fixes, not fast patches.
              3/ Follow the testing and verification guidance below.
              4/ For UI work, implement and wire the change into the production page or component.
              5/ A Storybook story, preview, or fixture does not replace the product implementation unless the task explicitly requests a prototype.
              6/ The runner manages commit identity and trailers. Do not set git user.email, and do not add Co-authored-by or Signed-off-by trailers.
              7/ Do not invent a token budget, a time budget, a step limit, or a remaining context size. The application does not set one unless the task text sets one. Do not stop early, skip work, or change the setup because of an imagined limit. If the task text sets a limit, follow that limit.

              Testing and verification:

              1/ Follow the repository's testing instructions. Use its existing tools and conventions.
              2/ For bug fixes, add a regression test that reproduces the failure when practical.
              3/ For behavior changes, add or update tests that verify observable behavior.
              4/ Avoid tests that only mirror implementation details or assert incidental layout, classes, or wording. Purely cosmetic changes do not need new tests unless repository instructions require them. Add coverage if behavior or accessibility changes.
              5/ Run the relevant tests, lint, and build checks specified by the repository. Fix failures caused by your changes.
              6/ Report which checks passed or failed. State which checks you could not run and explain why. Do not claim verification you did not perform.

          - name: Commit and Push
            type: bash
            workingDirectory: repo
            command: |-
              set -euo pipefail

              # Do not commit or push while HEAD is still the default branch.
              if [ -n "${BASE:-}" ]; then
                default_branch="$BASE"
              else
                default_branch="$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's#^origin/##')"
              fi
              if [ -z "$default_branch" ]; then
                echo "Could not read the repository default branch." >&2
                exit 1
              fi
              branch="$(git rev-parse --abbrev-ref HEAD)"
              if [ "$branch" = "HEAD" ] || [ "$branch" = "$default_branch" ]; then
                echo "Create a working branch before you push. The current branch is ${branch}." >&2
                exit 1
              fi

              # Commit leftover uncommitted work if the agent did not commit everything.
              git add -A
              if ! git diff --cached --quiet; then
                git commit -s -m "fix: implement task via SuperPlane"
              fi

              # Fail if this branch has no commits ahead of the default branch.
              if [ "$(git rev-list --count "origin/${default_branch}..HEAD")" -eq 0 ]; then
                echo "No commits to push" >&2
                exit 1
              fi

              git push -u origin HEAD
          - name: Generate PR title and description
            type: prompt
            workingDirectory: repo
            prompt: |-
              Write the pull request title and description for the change you pushed.

              Task title: {{ task().title }}

              Read the applicable repository instructions for commit and pull request writing. Check AGENTS.md, CLAUDE.md, contribution documentation, and applicable SKILL.md files. Read referenced skills instead of assuming that their availability means their instructions were followed.

              1/ Compare the current branch with {{ task().default_branch }} and review the commits you made.
              2/ Follow repository conventions for the title, description, writing style, and formatting. Discover and use the applicable pull request template. These instructions take precedence over the fallback below.
              3/ If the repository provides no guidance, write a short, descriptive title and a concise description of the problem and resulting behavior. Include relevant verification and known limitations. Use sections only when they help the reader. Do not require a Conventional Commits title or sections for each part of the system.
              4/ Do not add closing keywords (Closes, Fixes, Resolves).
              5/ If the repository has no formatting rules, use clear Markdown with each paragraph on one line. Separate paragraphs, headings, and list items with blank lines.
              6/ Include only verification results you can substantiate. Do not claim that tests, lint, or builds passed without evidence. State any checks that could not run and why.
              7/ Write the title to /tmp/TITLE and the description to /tmp/DESCRIPTION.md. Do not add these files to the repository.
              8/ Do not create or update the pull request yourself. The automation uses these files to create or update it.
          - name: Push output
            type: bash
            workingDirectory: repo
            command: |-
              set -euo pipefail

              # Emit branch name plus PR title/description for the next canvas nodes.
              if [ ! -s /tmp/TITLE ] || [ ! -s /tmp/DESCRIPTION.md ]; then
                jq -n '{error: "Missing title and/or description at /tmp/TITLE and /tmp/DESCRIPTION.md"}' \
                  > "$SUPERPLANE_RESULT_FILE"
                echo "Missing title and/or description at /tmp/TITLE and /tmp/DESCRIPTION.md" >&2
                exit 1
              fi

              echo "Title and description found. Using as output"
              BRANCH="$(git rev-parse --abbrev-ref HEAD)"

              jq -n \
                --arg branch "$BRANCH" \
                --rawfile title /tmp/TITLE \
                --rawfile description /tmp/DESCRIPTION.md \
                '{
                  branch: $branch,
                  title: ($title | gsub("[\\r\\n]"; "") | @base64),
                  description: ($description | @base64)
                }' \
                > "$SUPERPLANE_RESULT_FILE"
      position:
        x: 1475
        "y": 312
      isCollapsed: false
    - id: add-branch-artifact
      name: Add Branch Artifact
      type: TYPE_ACTION
      component: addWorkOrderArtifact
      concurrency:
        max: 100
      configuration:
        artifactType: branch
        name: '{{ $["Implement From Task Description"].data.result.branch }}'
        orderId: "{{ task().id }}"
        repository: "{{ task().repository }}"
      position:
        x: 1495
        "y": 648
      isCollapsed: true
    - id: find-pr
      name: Find Pull Request
      type: TYPE_ACTION
      component: bitbucket.findPullRequest
      concurrency:
        max: 100
      configuration:
        repository: "{{ task().repository }}"
        head: '{{ $["Implement From Task Description"].data.result.branch }}'
        base: "{{ task().default_branch }}"
        state: open
      position:
        x: 1442
        "y": 816
      isCollapsed: true
    - id: create-pr
      name: Create Pull Request
      type: TYPE_ACTION
      component: bitbucket.createPullRequest
      concurrency:
        max: 100
      configuration:
        base: "{{ task().default_branch }}"
        body: |-
          [{{ task().key }}]({{ task().url }})

          {{ fromBase64($["Implement From Task Description"].data.result.description) }}

          ---

          Created via [SuperPlane](https://superplane.com).
        draft: false
        head: '{{ $["Implement From Task Description"].data.result.branch }}'
        repository: "{{ task().repository }}"
        title: '{{ fromBase64($["Implement From Task Description"].data.result.title) }}'
      position:
        x: 1160
        "y": 984
      isCollapsed: true
    - id: update-pr
      name: Update Pull Request
      type: TYPE_ACTION
      component: bitbucket.updatePullRequest
      concurrency:
        max: 100
      configuration:
        repository: "{{ task().repository }}"
        pullNumber: '{{ $["Find Pull Request"].data.id }}'
        title: '{{ fromBase64($["Implement From Task Description"].data.result.title) }}'
        body: |-
          [{{ task().key }}]({{ task().url }})

          {{ fromBase64($["Implement From Task Description"].data.result.description) }}

          ---

          Created via [SuperPlane](https://superplane.com).
      position:
        x: 1724
        "y": 984
      isCollapsed: true
    - id: attach-pr-artifact
      name: Attach PR to Task
      type: TYPE_ACTION
      component: addPullRequest
      concurrency:
        max: 100
      configuration:
        orderId: "{{ task().id }}"
        provider: bitbucket
        repository: "{{ task().repository }}"
        number: '{{ $["Create Pull Request"].data.id }}'
        url: '{{ $["Create Pull Request"].data.links.html.href }}'
        title: '{{ $["Create Pull Request"].data.title }}'
        state: open
      position:
        x: 1160
        "y": 1152
      isCollapsed: true
    - id: attach-pr-artifact-updated
      name: Attach Updated PR to Task
      type: TYPE_ACTION
      component: addPullRequest
      concurrency:
        max: 100
      configuration:
        orderId: "{{ task().id }}"
        provider: bitbucket
        repository: "{{ task().repository }}"
        number: '{{ $["Update Pull Request"].data.id }}'
        url: '{{ $["Update Pull Request"].data.links.html.href }}'
        title: '{{ $["Update Pull Request"].data.title }}'
        state: open
      position:
        x: 1724
        "y": 1152
      isCollapsed: true
    - id: add-run-error
      name: Record Implementation Failure
      type: TYPE_ACTION
      component: addRunError
      configuration:
        message: The implementation agent failed. Open the agent logs to find the cause.
      position:
        x: 1770
        "y": 648
      isCollapsed: true
