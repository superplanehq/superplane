apiVersion: v1
kind: Canvas
metadata:
  name: Plan
  description: Read the task and write an implementation plan.
spec:
  edges:
    - channel: default
      sourceId: onrun-create-plan
      targetId: planner-agent-no-issue
    - channel: passed
      sourceId: planner-agent-no-issue
      targetId: add-plan-artifact
  nodes:
    - id: onrun-create-plan
      name: Create Implementation Plan
      type: TYPE_TRIGGER
      component: onRun
      configuration: {}
      position:
        x: 413
        'y': 888
      isCollapsed: true
    - id: planner-agent-no-issue
      name: Draft Implementation Plan
      type: TYPE_ACTION
      component: runnerClaudeCode
      concurrency:
        max: 5
      configuration:
        credentials:
          source: integration
          integration:
            name: claude
        environmentFrom:
          - source: integration
            integration:
              name: github
        environment:
          - name: REPO
            value: '{{ task().repository }}'
            valueSource: literal
          - name: ORDER_DESCRIPTION
            value: '{{ toBase64(task().description) }}'
            valueSource: literal
          - name: WORKSPACE_SETUP
            value: '{{ toBase64(workspace().setup_script) }}'
            valueSource: literal
          - name: WORKSPACE_CONTEXT
            value: '{{ toBase64(workspace().repository_context) }}'
            valueSource: literal
        executionTimeoutSeconds: 3600
        machineType: e1-large-amd64
        model: opus
        steps:
          - name: Clone Repo
            type: bash
            command: |-
              git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" repo
              cd repo
              echo $ORDER_DESCRIPTION | base64 -d > /tmp/ORDER.md
              echo "$WORKSPACE_CONTEXT" | base64 -d > /tmp/WORKSPACE.json
              cat /tmp/ORDER.md
          - name: Set Up Environment
            type: bash
            workingDirectory: repo
            command: |-
              set -euo pipefail
              SETUP_SCRIPT="$(echo "$WORKSPACE_SETUP" | base64 -d)"
              if [ -n "$SETUP_SCRIPT" ]; then
                bash -euo pipefail -c "$SETUP_SCRIPT"
              fi
          - name: Write Implementation Plan
            type: prompt
            workingDirectory: repo
            prompt: |-
              You are writing an implementation plan for a SuperPlane Task. The repository is cloned out in your current working directory.

              Repository: {{ task().repository }}
              Task Title: {{ root().data.work_order.title }}

              1/ The description is in the /tmp/ORDER.md
              2/ Write the plan to the file /tmp/plan.md. Do NOT create any files inside the repository, and do NOT commit anything.
              3/ Read /tmp/WORKSPACE.json first. It contains the detected languages and repository-native build, test, lint, and type-check commands.
              4/ Do not rediscover the complete repository tree or derive dependency-install commands again. Open only the files relevant to this task.
              5/ Name concrete files and verification commands in the plan.

              Start with a very short, high-level summary: 1-3 concise sentences or a few bullets. Clear and to the point. No heading above it.

              Write clearly, for humans. Keep the top summary genuinely short.
          - name: Use plan as output
            type: bash
            command: |-
              if [ -s /tmp/plan.md ]; then
                echo "Plan found. Using as output"
                jq -n --rawfile plan /tmp/plan.md '{plan: ($plan | @base64)}' > "$SUPERPLANE_RESULT_FILE"
              else
                jq -n '{error: "No plan produced at /tmp/plan.md"}' > "$SUPERPLANE_RESULT_FILE"
                echo "No plan produced at /tmp/plan.md" >&2
                exit 1
              fi
      position:
        x: 393
        'y': 1056
      isCollapsed: false
    - id: add-plan-artifact
      name: Add Task Artifact
      type: TYPE_ACTION
      component: addWorkOrderArtifact
      configuration:
        artifactType: markdown
        body: '{{ fromBase64(previous().data.result.plan) }}'
        orderId: '{{ task().id }}'
        title: PLAN.md
      position:
        x: 360
        'y': 1328
      isCollapsed: true
