apiVersion: v1
kind: Canvas
metadata:
  name: Repository Analysis
  description: Detect repository languages and development commands with Suss.
spec:
  edges:
    - channel: default
      sourceId: onrun-analyze-repository
      targetId: mark-repository-analysis-running
    - channel: default
      sourceId: mark-repository-analysis-running
      targetId: analyze-repository
    - channel: passed
      sourceId: analyze-repository
      targetId: store-repository-analysis
    - channel: failed
      sourceId: analyze-repository
      targetId: mark-repository-analysis-failed
  nodes:
    - id: onrun-analyze-repository
      name: Analyze Repository
      type: TYPE_TRIGGER
      component: onRun
      configuration: {}
      position:
        x: 360
        'y': 240
      isCollapsed: true
    - id: mark-repository-analysis-running
      name: Mark Repository Analysis Running
      type: TYPE_ACTION
      component: setRepositoryAnalysis
      configuration:
        status: running
      position:
        x: 360
        'y': 340
      isCollapsed: true
    - id: analyze-repository
      name: Detect Repository Setup
      type: TYPE_ACTION
      component: runnerClaudeCode
      configuration:
        credentials:
          source: integration
          integration:
            name: claude
        environmentFrom:
          - source: integration
            integration:
              name: github
        environment:
          - name: REPO
            value: '{{ workspace().repository }}'
            valueSource: literal
          - name: BASE
            value: '{{ workspace().default_branch }}'
            valueSource: literal
        executionTimeoutSeconds: 900
        machineType: e1-large-amd64
        model: sonnet
        steps:
          - name: Clone Repository
            type: bash
            command: |-
              set -euo pipefail
              git clone --depth 1 --branch "${BASE:-main}" \
                "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" repo
          - name: Run Suss
            type: bash
            workingDirectory: repo
            command: |-
              set -euo pipefail
              go run github.com/superplanehq/suss/cmd/suss@043a66e4f7e8d2e2919c1e300d827c37b144b206 . --json > /tmp/suss.json
              jq -e '.schemaVersion == "1" and (.projects | type == "array")' /tmp/suss.json >/dev/null
              COMMIT_SHA="$(git rev-parse HEAD)"
              jq -n \
                --arg commitSha "$COMMIT_SHA" \
                --rawfile document /tmp/suss.json \
                '{commitSha: $commitSha, document: ($document | @base64)}' \
                > "$SUPERPLANE_RESULT_FILE"
      position:
        x: 360
        'y': 440
      isCollapsed: false
    - id: store-repository-analysis
      name: Store Repository Analysis
      type: TYPE_ACTION
      component: setRepositoryAnalysis
      configuration:
        document: '{{ fromBase64(previous().data.result.document) }}'
        commitSha: '{{ previous().data.result.commitSha }}'
        status: ready
      position:
        x: 360
        'y': 720
      isCollapsed: true
    - id: mark-repository-analysis-failed
      name: Mark Repository Analysis Failed
      type: TYPE_ACTION
      component: setRepositoryAnalysis
      configuration:
        status: failed
        error: Repository analysis did not finish.
      position:
        x: 720
        'y': 720
      isCollapsed: true
