apiVersion: v1
kind: Canvas
metadata:
  name: Implement
  description: Implement the task in the workspace repositories and open a pull request for each changed repository.
spec:
  edges:
    - channel: default
      sourceId: onrun-implement
      targetId: implementation-agent-no-issue
    - channel: failed
      sourceId: implementation-agent-no-issue
      targetId: add-run-error
  nodes:
    - id: onrun-implement
      name: Start Implementation
      type: TYPE_TRIGGER
      component: onRun
      configuration: {}
      position:
        x: 1542
        "y": 144
      isCollapsed: true
    - id: implementation-agent-no-issue
      name: Implement From Task Description
      type: TYPE_ACTION
      component: runnerClaudeCode
      concurrency:
        max: 5
      configuration:
        credentials:
          source: integration
          integration:
            name: claude
        environmentFrom:
          - source: integration
            integration:
              name: github
        environment:
          - name: REPO_URL
            value: "{{ task().repository_url }}"
            valueSource: literal
          - name: BASE
            value: "{{ task().default_branch }}"
            valueSource: literal
          - name: COAUTHORS
            value: '{{ join(map(filter(task().assignees, {#.email != ""}), "Co-authored-by: " + #.name + " <" + #.email + ">"), "\n") }}'
            valueSource: literal
          - name: CHECKOUT_COMMIT_SETUP
            value: "1"
            valueSource: literal
          - name: DRAFT_PULL_REQUESTS
            value: "false"
            valueSource: literal
        executionTimeoutSeconds: 3600
        machineType: e1-large-amd64
        model: claude-opus-5-5
        steps:
          - name: Implementation
            type: prompt
            workingDirectory: repo
            prompt: |-
              You are implementing a SuperPlane task. The primary repository is cloned in the current working directory on {{ task().default_branch }}. The other workspace repositories, if any, are cloned in ../context/<owner>/<name> on their default branches.

              If the primary repository had no commits, the clone step already pushed an initial commit on {{ task().default_branch }}. Do not change that commit.

              Primary repository: {{ task().repository }}
              Task title: {{ task().title }}

              Task description:
              {{ task().description }}{{ task().spec != "" ? "\n\nSpec:\n" + task().spec : "" }}

              Repository instructions:

              Read the applicable repository instructions before making changes. Check AGENTS.md, CLAUDE.md, contribution documentation, and instructions for the affected paths. Discover and read applicable SKILL.md files, including skills referenced by those instructions.
              Follow repository conventions for implementation, testing, commit messages, and pull requests. Repository instructions take precedence over the general defaults below. The runner still controls commit identity. Do not replace repository-owned instructions or skills with workspace copies.

              1/ Decide which repositories the task needs to change. Change only those repositories. Many tasks change only the primary repository.
              2/ In each repository that you change, create a new branch. Do not commit on the default branch.
              3/ Implement the task. Keep the change focused.
              4/ Commit on the working branch with clear messages.
              5/ Leave PR creation to the next Open pull requests step. Do not push branches yourself.
              6/ Finish with a handoff listing changed repository directories, branches, commits, verification results, assumptions, and known limitations.

              Guidelines:

              1/ Focus on clean code.
              2/ Make long term fixes, not fast patches.
              3/ Follow the testing and verification guidance below.
              4/ For UI work, implement and wire the change into the production page or component.
              5/ A Storybook story, preview, or fixture does not replace the product implementation unless the task explicitly requests a prototype.
              6/ The runner manages commit identity and trailers. Do not set git user.email, and do not add Co-authored-by or Signed-off-by trailers.
              7/ Do not invent a token budget, a time budget, a step limit, or a remaining context size. The application does not set one unless the task text sets one. Do not stop early, skip work, or change the setup because of an imagined limit. If the task text sets a limit, follow that limit.
              8/ No person reads your replies during the run, and no person can answer a question. Do not ask for approval or stop to wait for input. When the task is not clear, choose the most reasonable interpretation, complete the work, and state your assumptions in the pull request description.

              Testing and verification:

              1/ Follow the repository's testing instructions. Use its existing tools and conventions.
              2/ For bug fixes, add a regression test that reproduces the failure when practical.
              3/ For behavior changes, add or update tests that verify observable behavior.
              4/ Avoid tests that only mirror implementation details or assert incidental layout, classes, or wording. Purely cosmetic changes do not need new tests unless repository instructions require them. Add coverage if behavior or accessibility changes.
              5/ Run the relevant tests, lint, and build checks specified by the repository. Fix failures caused by your changes.
              6/ Report which checks passed or failed. State which checks you could not run and explain why. Do not claim verification you did not perform.
          - name: Open pull requests
            type: prompt
            workingDirectory: repo
            prompt: |-
              Open or update and register a pull request for each repository with task changes.
              You must invoke the opening tool or command. A written title, description, or final reply does not complete this step.

              Primary repository: {{ task().repository }}
              Primary default branch: {{ task().default_branch }}
              Task title: {{ task().title }}

              Repository review:

              1/ Review the implementation handoff and inspect repo and each relevant repository under ../context/<owner>/<name>.
              2/ Inspect each repository's status, current branch, commits, and diff against its own origin default branch.
              3/ Use {{ task().default_branch }} for the primary repository. Read origin/HEAD for each context repository's default branch.
              4/ Select only repositories with task changes. Include committed changes even when the working tree is clean.
              5/ For primary-only changes, open only the primary PR. For context-only changes, open only the changed context PRs.
              6/ For changes across repositories, open a PR for every changed repository. Do not create empty PRs for unchanged repositories.

              Pull request title and description:

              Read each changed repository's applicable AGENTS.md, CLAUDE.md, contribution documentation, and SKILL.md files, including referenced skills.
              Follow repository instructions for PR writing. Discover and use each repository's applicable pull request template.
              Repository instructions take precedence over these writing defaults. Do not replace repository-owned instructions or skills with workspace copies.

              1/ Write a repository-specific title and body that explain the problem and resulting behavior.
              2/ Follow each repository's title, description, writing style, and formatting conventions.
              3/ If the repository provides no guidance, use a short, descriptive title and concise Markdown description.
              4/ Include relevant verification and known limitations. Use sections only when they help the reader.
              5/ If there are no formatting rules, put each paragraph on one line. Separate paragraphs, headings, and list items with blank lines.
              6/ Include only verification results you can substantiate. State any checks that could not run and why.
              7/ When multiple repositories change, name the related PRs in each description.
              8/ After all PR URLs are available, call the same opening tool again to update descriptions with related PR references.
              9/ Do not add GitHub closing keywords (Closes, Fixes, Resolves) or the task link. SuperPlane adds them.

              Open and register pull requests:

              1/ For each changed repository, call the SuperPlane open_pull_request tool with its directory, repository-specific title, and body.
              2/ Use directory repo for the primary repository and context/<owner>/<name> for each context repository.
              3/ Tool directories are relative to the workspace root, not the current repository directory. Do not pass ../context paths to the tool.
              4/ The tool pushes the current branch and opens or updates its PR on this task.
              5/ If the tool is unavailable, use superplane task pr open --directory DIR --title TITLE --body-file FILE.
              6/ Run the fallback command from the workspace root, which contains repo and context. The CLI resolves directories from its current directory.
              7/ Use a separate temporary description file for each repository when needed. Do not commit those files.
              8/ Preserve the configured draft setting. Let SuperPlane apply DRAFT_PULL_REQUESTS; do not change the environment to override it.
              9/ The runner manages commit identity and trailers. Do not set git user.email, and do not add Co-authored-by or Signed-off-by trailers.
              10/ Do not push branches or open PRs through another mechanism.

              Confirm registration:

              1/ Call list_pull_requests, or run superplane task pr list, after the opening calls finish.
              2/ Confirm that the task lists a registered PR for each changed repository. Match each repository and its PR URL.
              3/ A pushed branch or externally opened PR alone is insufficient. A written description does not confirm registration.
              4/ Report each opening or registration failure accurately, with the repository and error. Do not claim success for missing PRs.
              5/ Finish with the confirmed repository-to-PR list and any failures before the Check pull requests step runs.
              6/ The final check only rejects zero total PRs. It does not verify coverage for each changed repository.
          - name: Check pull requests
            type: bash
            workingDirectory: repo
            command: |-
              set -euo pipefail

              # The agent opens the pull requests. Fail when the task has none.
              count="$(superplane task pr list | jq '.pull_requests | length')"
              if [ "$count" -eq 0 ]; then
                echo "The agent did not open a pull request. Call open_pull_request for each changed repository." >&2
                exit 1
              fi
              echo "The task has $count pull request(s)."
      position:
        x: 1475
        "y": 312
      isCollapsed: false
    - id: add-run-error
      name: Record Implementation Failure
      type: TYPE_ACTION
      component: addRunError
      configuration:
        message: The implementation agent failed. Open the agent logs to find the cause.
      position:
        x: 1770
        "y": 648
      isCollapsed: true
