apiVersion: v1
kind: Console
metadata:
  name: Visual Evidence
  canvasId: __FACTORY_CANVAS_ID__
spec:
  panels:
    - id: about
      type: markdown
      content:
        title: About this app
        body: |
          > [!SECTION:setup] Visual evidence
          >
          > This app is not a factory line step. The first capture starts when
          > a pull request is attached to the task. Later updates start from
          > pull request events.
          >
          > When the change has visual evidence, it posts one comment.
  layout:
    - i: about
      x: 0
      'y': 0
      w: 12
      h: 6
      minW: 3
      minH: 5
