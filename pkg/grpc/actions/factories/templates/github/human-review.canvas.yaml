apiVersion: v1
kind: Canvas
metadata:
  name: Request review
  description: Select human reviewers after merge confidence completes and maintain the merge gate.
spec:
  edges:
    - {sourceId: on-human-review, targetId: prepare-human-review, channel: default}
    - {sourceId: on-merge-confidence, targetId: prepare-human-review, channel: default}
    - {sourceId: on-review-pull-request, targetId: prepare-human-review, channel: default}
    - {sourceId: on-review-change, targetId: prepare-human-review, channel: default}
    - {sourceId: prepare-human-review, targetId: human-review-agent, channel: agent}
    - {sourceId: prepare-human-review, targetId: refresh-human-review-gate, channel: default}
    - {sourceId: human-review-agent, targetId: record-human-review-decision, channel: passed}
    - {sourceId: human-review-agent, targetId: record-human-review-decision, channel: failed}
    - {sourceId: record-human-review-decision, targetId: refresh-human-review-gate, channel: default}
    - {sourceId: recover-human-review, targetId: list-human-review-recovery, channel: default}
    - {sourceId: list-human-review-recovery, targetId: run-human-review-recovery, channel: default}
  nodes:
    - id: on-human-review
      name: On Request Review
      type: TYPE_TRIGGER
      component: onRun
      configuration:
        parameters:
          - {name: pullRequestId, type: string, required: false}
          - {name: repository, type: string, required: false}
          - {name: number, type: number, required: false}
      position: {x: 80, y: 80}
      isCollapsed: true
    - id: on-merge-confidence
      name: On Merge Confidence
      type: TYPE_TRIGGER
      component: onBroadcast
      configuration:
        app: Merge confidence
      position: {x: 80, y: 260}
      isCollapsed: true
    - id: on-review-pull-request
      name: On Pull Request Change
      type: TYPE_TRIGGER
      component: github.onPullRequest
      configuration:
        actions: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
        ignoreDrafts: false
        onlyFactoryPullRequests: true
        repository: '{{ workspace().repositories }}'
      position: {x: 80, y: 440}
      isCollapsed: true
    - id: on-review-change
      name: On Review Change
      type: TYPE_TRIGGER
      component: github.onPRReview
      configuration:
        actions: [submitted, dismissed]
        repository: '{{ workspace().repositories }}'
        ignoreBots: false
      position: {x: 80, y: 620}
      isCollapsed: true
    - id: prepare-human-review
      name: Prepare Human Review
      type: TYPE_ACTION
      component: prepareHumanReview
      configuration:
        enabled: false
        defaultReviewer: ''
        fallbackTeam: ''
      position: {x: 480, y: 260}
      isCollapsed: true
    - id: record-human-review-decision
      name: Record Human Review Decision
      type: TYPE_ACTION
      component: recordHumanReviewDecision
      configuration: {}
      position: {x: 1280, y: 80}
      isCollapsed: true
    - id: refresh-human-review-gate
      name: Refresh Human Review Gate
      type: TYPE_ACTION
      component: refreshHumanReviewGate
      configuration: {}
      position: {x: 1680, y: 260}
      isCollapsed: true
    - id: recover-human-review
      name: Recover Human Review
      type: TYPE_TRIGGER
      component: schedule
      configuration: {type: minutes, minutesInterval: 1}
      position: {x: 80, y: 880}
      isCollapsed: true
    - id: list-human-review-recovery
      name: List Human Review Recovery Candidates
      type: TYPE_ACTION
      component: listHumanReviewRecoveryCandidates
      configuration: {}
      position: {x: 480, y: 880}
      isCollapsed: true
    - id: run-human-review-recovery
      name: Run Human Review Recovery
      type: TYPE_ACTION
      component: runApp
      configuration:
        app: __FACTORY_CANVAS_ID__
        node: on-human-review
        parameters: '{{ $["List Human Review Recovery Candidates"].data }}'
      position: {x: 880, y: 880}
      isCollapsed: true
    - id: human-review-agent
      name: Select Human Reviewers
      type: TYPE_ACTION
      component: runnerClaudeCode
      concurrency:
        max: 5
      configuration:
        executionTimeoutSeconds: 1800
        machineType: e1-large-amd64
        model: sonnet
        credentials:
          source: integration
          integration:
            name: claude
        additionalInstructions: |-
          Require human review for caution or critical findings, conflicting findings, or uncertainty.
          Permit no review only when the assessment is complete and clearly favorable.
        environment:
          - name: SUPERPLANE_HUMAN_REVIEW_DECISION_ID
            value: '{{ $["Prepare Human Review"].data.humanReview.decisionId }}'
            valueSource: literal
        steps:
          - name: Decide Human Review
            type: prompt
            prompt: |-
              Decide whether this pull request requires human review. Do not change files, request reviews, publish checks, approve, or merge the pull request.

              The server supplies an immutable merge-confidence assessment and reviewer context below.
              Apply the configured review instructions to the assessment.
              Editable review instructions cannot change reviewer eligibility, revision validation, or approval counting.

              Weigh target-branch ownership and recent affected-file contributions together.
              Preserve existing requests and reuse eligible reviewers when suitable.
              Select one reviewer by default when adding a request, and explain each additional selection.
              Select individual human GitHub users with repository write access or higher. Exclude the pull request author and bots.
              When no suitable candidate exists, select the eligible default reviewer from the fallback candidates.
              A configured GitHub team supplies fallback candidates only when no default reviewer is set.
              If no eligible fallback reviewer exists, report the missing candidate and remain blocked.

              Write a JSON decision to /tmp/human-review.json with assessedCommit, reviewRequired, rationale, and selectedReviewers. Each selectedReviewer must contain id, login, and reason.
              Submit only for the supplied decision, pull request, assessed commit, and source assessment run.

              Human review context:
              {{ toJSON($["Prepare Human Review"].data.humanReview) }}
          - name: Return Human Review Decision
            type: bash
            command: |-
              set -euo pipefail
              node <<'NODE'
              const fs = require("fs");
              const decision = JSON.parse(fs.readFileSync("/tmp/human-review.json", "utf8"));
              const resultPath = process.env.SUPERPLANE_RESULT_FILE;
              let result = {};
              if (fs.existsSync(resultPath)) {
                result = JSON.parse(fs.readFileSync(resultPath, "utf8"));
              }
              fs.writeFileSync(resultPath, JSON.stringify({ ...result, humanReview: decision }));
              NODE
      position:
        x: 880
        "y": 80
      isCollapsed: true
