apiVersion: v1
kind: Canvas
metadata:
  name: PR Closure
  description: Close the task when the attached pull request merges or is closed without a merge.
spec:
  edges:
    - channel: default
      sourceId: on-pr-closed
      targetId: add-pr-activity
    - channel: default
      sourceId: add-pr-activity
      targetId: is-pr-merged
    - channel: "true"
      sourceId: is-pr-merged
      targetId: stamp-pr-merged
    - channel: "false"
      sourceId: is-pr-merged
      targetId: stamp-pr-closed
    - channel: default
      sourceId: stamp-pr-merged
      targetId: complete-work-order
    - channel: default
      sourceId: stamp-pr-closed
      targetId: reject-work-order
    - channel: default
      sourceId: complete-work-order
      targetId: has-github-issue-origin
    - channel: "true"
      sourceId: has-github-issue-origin
      targetId: comment-source-issue
    - channel: default
      sourceId: comment-source-issue
      targetId: close-source-issue
  nodes:
    - id: on-pr-closed
      name: On Pull Request Closed
      type: TYPE_TRIGGER
      component: github.onPullRequest
      configuration:
        actions:
          - closed
        onlyFactoryPullRequests: true
        repository: '{{ install_params.appRepository }}'
      position:
        x: 1272
        'y': 72
      isCollapsed: true
    - id: add-pr-activity
      name: Add Pull Request Activity
      type: TYPE_ACTION
      component: addPullRequestActivity
      configuration:
        pullRequestId: '{{ root().data.pullRequest.id }}'
        description: '{{ "PR #" + string(root().data.pull_request.number) + " was " + (root().data.pull_request.merged == true ? "merged" : "closed") }}'
      position:
        x: 1272
        'y': 612
      isCollapsed: true
    - id: is-pr-merged
      name: Pull Request Merged?
      type: TYPE_ACTION
      component: if
      configuration:
        expression: root().data.pull_request.merged == true
      position:
        x: 1202
        'y': 792
      isCollapsed: true
    - id: stamp-pr-merged
      name: Stamp Merged Pull Request
      type: TYPE_ACTION
      component: updatePullRequest
      configuration:
        pullRequestId: '{{ root().data.pullRequest.id }}'
        merged: '{{ root().data.pull_request.merged }}'
        mergedAt: '{{ root().data.pull_request.merged_at }}'
        state: '{{ root().data.pull_request.state }}'
      position:
        x: 1132
        'y': 972
      isCollapsed: true
    - id: stamp-pr-closed
      name: Stamp Closed Pull Request
      type: TYPE_ACTION
      component: updatePullRequest
      configuration:
        pullRequestId: '{{ root().data.pullRequest.id }}'
        closedAt: '{{ root().data.pull_request.closed_at }}'
        merged: '{{ root().data.pull_request.merged }}'
        state: '{{ root().data.pull_request.state }}'
      position:
        x: 1600
        'y': 972
      isCollapsed: true
    - id: complete-work-order
      name: Complete Task
      type: TYPE_ACTION
      component: updateWorkOrderStatus
      configuration:
        orderId: '{{ root().data.workOrder.id }}'
        result: completed
        status: closed
      position:
        x: 1132
        'y': 1332
      isCollapsed: true
    - id: reject-work-order
      name: Reject Task
      type: TYPE_ACTION
      component: updateWorkOrderStatus
      configuration:
        orderId: '{{ root().data.workOrder.id }}'
        result: rejected
        status: closed
      position:
        x: 1600
        'y': 1332
      isCollapsed: true
    - id: has-github-issue-origin
      name: Has GitHub Issue Origin?
      type: TYPE_ACTION
      component: if
      configuration:
        expression: root().data.workOrder.origin != nil && split(root().data.workOrder.origin.url, "https://github.com/")[0] == "" && len(split(root().data.workOrder.origin.url, "/issues/")) == 2
      position:
        x: 1132
        'y': 1512
      isCollapsed: true
    - id: comment-source-issue
      name: Comment on Source Issue
      type: TYPE_ACTION
      component: github.createIssueComment
      configuration:
        repository: '{{ split(split(root().data.workOrder.origin.url, "https://github.com/")[1], "/issues/")[0] }}'
        issueNumber: '{{ split(root().data.workOrder.origin.url, "/issues/")[1] }}'
        body: 'SuperPlane completed this task in pull request [#{{ root().data.pull_request.number }}]({{ root().data.pull_request.html_url }}).'
      position:
        x: 1132
        'y': 1692
      isCollapsed: true
    - id: close-source-issue
      name: Close Source Issue
      type: TYPE_ACTION
      component: github.updateIssue
      configuration:
        repository: '{{ split(split(root().data.workOrder.origin.url, "https://github.com/")[1], "/issues/")[0] }}'
        issueNumber: '{{ split(root().data.workOrder.origin.url, "/issues/")[1] }}'
        state: closed
      position:
        x: 1132
        'y': 1872
      isCollapsed: true
