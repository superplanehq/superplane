apiVersion: v1
kind: Console
metadata:
  name: Human review
  canvasId: __FACTORY_CANVAS_ID__
spec:
  panels:
    - id: about
      type: markdown
      content:
        title: About this app
        body: |
          > [!SECTION:setup] Human review
          >
          > This automation starts after a complete merge-confidence assessment for a tracked GitHub pull request.
          > It selects eligible human reviewers and maintains the merge-confidence/merge-gate check.
          > Administrators must select a fallback GitHub team before enabling the automation.
          > Human review starts disabled. Configure GitHub branch protection separately to require the check.
  layout:
    - i: about
      x: 0
      'y': 0
      w: 12
      h: 6
      minW: 3
      minH: 5
