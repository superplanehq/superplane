apiVersion: v1
kind: Canvas
metadata:
  name: Merge confidence
  description: Score a pull request when it opens or updates, then report the checks you turned on.
spec:
  edges:
    - channel: default
      sourceId: on-pr-risk
      targetId: should-assess
    - channel: "true"
      sourceId: should-assess
      targetId: find-pull-request
    - channel: found
      sourceId: find-pull-request
      targetId: assess-risk
    - channel: passed
      sourceId: assess-risk
      targetId: format-merge-confidence
    - channel: passed
      sourceId: format-merge-confidence
      targetId: should-report-risk
    - channel: "true"
      sourceId: should-report-risk
      targetId: report-risk-score
    - channel: passed
      sourceId: format-merge-confidence
      targetId: should-report-performance
    - channel: "true"
      sourceId: should-report-performance
      targetId: report-performance
    - channel: passed
      sourceId: format-merge-confidence
      targetId: should-report-security
    - channel: "true"
      sourceId: should-report-security
      targetId: report-security
    - channel: passed
      sourceId: format-merge-confidence
      targetId: should-report-drift
    - channel: "true"
      sourceId: should-report-drift
      targetId: report-drift
  nodes:
    - id: on-pr-risk
      name: On Pull Request
      type: TYPE_TRIGGER
      component: github.onPullRequest
      configuration:
        actions:
          - opened
          - synchronize
          - reopened
          - ready_for_review
        repository: '{{ install_params.appRepository }}'
      position:
        x: 80
        "y": 80
      isCollapsed: true
    - id: should-assess
      name: Should Assess?
      type: TYPE_ACTION
      component: if
      configuration:
        expression: 'root().data.pull_request.base.ref == "{{ install_params.defaultBranch }}" && root().data.pull_request.draft != true'
      position:
        x: 360
        "y": 80
      isCollapsed: true
    - id: find-pull-request
      name: Find Pull Request
      type: TYPE_ACTION
      component: findPullRequest
      configuration:
        provider: github
        repository: "{{ root().data.repository.full_name }}"
        number: "{{ root().data.pull_request.number }}"
        url: "{{ root().data.pull_request.html_url }}"
      position:
        x: 640
        "y": 80
      isCollapsed: true
    - id: assess-risk
      name: Assess Merge Confidence
      type: TYPE_ACTION
      component: runnerClaudeCode
      configuration:
        executionTimeoutSeconds: 1800
        includeVisualEvidence: false
        machineType: e1-large-amd64
        model: sonnet
        credentials:
          source: integration
          integration:
            name: claude
        environmentFrom:
          - source: integration
            integration:
              name: github
        environment:
          - name: REPO
            value: "{{ root().data.repository.full_name }}"
            valueSource: literal
          - name: PR_NUMBER
            value: "{{ root().data.pull_request.number }}"
            valueSource: literal
          - name: PR_REVISION
            value: "{{ root().data.pull_request.head.sha }}"
            valueSource: literal
          - name: BASE
            value: "{{ root().data.pull_request.base.ref }}"
            valueSource: literal
        steps:
          - name: Checkout Pull Request
            type: bash
            command: |-
              set -euo pipefail
              gh auth setup-git --hostname github.com --force
              git clone --depth 1 --branch "${BASE}" "https://github.com/${REPO}.git" repo
              cd repo
              git fetch --depth 1 origin "pull/${PR_NUMBER}/head"
              if [ -n "${PR_REVISION:-}" ]; then
                git checkout --detach "${PR_REVISION}" || git checkout --detach FETCH_HEAD
              else
                git checkout --detach FETCH_HEAD
              fi
              revision="$(git rev-parse HEAD)"
              base_ref="$(printf '%s' "${BASE}" | sed 's#/#%2F#g')"
              gh api -H "Accept: application/vnd.github.v3.diff" "/repos/${REPO}/compare/${base_ref}...${revision}" > /tmp/pr.diff
          - name: Review Pull Request
            type: prompt
            workingDirectory: repo
            prompt: |-
              Review this pull request. The repository is checked out at the pull request head.
              The pull request diff is in /tmp/pr.diff. Review that file.
              It is the difference between the base branch and the head.
              Do not change files. Do not commit. Do not push.

              Repository: {{ root().data.repository.full_name }}
              Pull request: #{{ root().data.pull_request.number }}
              Title: {{ root().data.pull_request.title }}
              Author: {{ root().data.pull_request.user.login }}
              Base branch: {{ root().data.pull_request.base.ref }}
              Head SHA: {{ root().data.pull_request.head.sha }}

              The original task is the intent for this change.
              Task title: {{ $["Find Pull Request"].data.workOrder.title }}
              Task description: {{ $["Find Pull Request"].data.workOrder.description }}

              Write ONLY valid JSON to /tmp/merge-confidence.json. No markdown fences.

              JSON schema:
              {
                "risk": { "enabled": true, "score": 1, "summary": "one sentence" },
                "performance": { "enabled": true, "score": 1, "summary": "one sentence" },
                "security": { "enabled": true, "score": 1, "summary": "one sentence" },
                "drift": { "enabled": true, "score": 1, "summary": "one sentence" }
              }

              Enabled checks: {{ install_params.enabledChecks }}.

              Always include risk, performance, security, and drift.
              Set enabled to true for every check named in Enabled checks.
              Do not set enabled to false for a named check.
              A named check stays on even when no practice in the repository applies to the diff.
              For a check that is not named, set enabled to false, score to 0, and summary to an empty string.
              When Enabled checks is none, set enabled to false for every check.

              Risk. Use this section only when risk is enabled.
              score is an integer from 1 to 5. A higher score means more risk.
              Apply these category rules. If a change matches a category, the score is at least that category score.
              If several categories match, use the highest score.
              If no category matches, judge the diff and choose a score from 1 to 5.
              Do not invent a category. Name only categories from the rules below.

              {{ install_params.riskRules }}

              summary is one sentence.
              Start with Higher risk, Moderate risk, or Lower risk.
              Use Higher risk for high or critical. Use Moderate risk for medium. Use Lower risk for low or very low.
              When categories match, say the pull request is introducing the highest matching category.
              End a Lower risk sentence with "only" when every change fits that one category.
              Do not use "only" when the pull request also changes something outside that category.
              Do not describe the edit in a Lower risk sentence that names a category.
              For Moderate risk and Higher risk, add "by" and the concrete change.
              When no category matches, say the pull request matches no configured category.
              Then name the concrete change, including when the score is Lower risk.
              Do not invent a category.
              Do not repeat the score. The check shows the number beside this sentence.
              Do not write a second sentence. Do not write a list.
              Good lower: Lower risk because the pull request is introducing user interface changes only.
              Good higher: Higher risk because the pull request is introducing infrastructure changes by raising the ingress body limit from 64 MB to 80 MB.
              Good none: Moderate risk because the pull request matches no configured category and rewrites the retry loop.

              Performance. Use this section only when performance is enabled.
              score is an integer from 1 to 5. A higher score means the change follows the performance practices in this repository.
              Read the repository for the performance practices it already states.
              Use docs, comments, and the patterns in the existing code.
              Do not use a generic checklist from outside this repository.
              5 means the change follows every practice that applies.
              4 means the change follows the practices that apply, with a small gap.
              3 means the change follows some practices and breaks one that applies.
              2 means the change breaks a practice that applies.
              1 means the change breaks more than one practice that applies.
              If no performance practice applies, keep enabled true and use 5.
              summary is one sentence.
              Name the practice and say whether the change follows it or breaks it.
              If no practice applies, say that no performance practice in this repository applies.
              Do not turn the check off. Do not repeat the score. Do not write a second sentence.

              Security. Use this section only when security is enabled.
              Use the same rules as Performance, for the security practices in this repository.
              Read the repository for the security practices it already states.
              Do not use a generic checklist from outside this repository.
              If no security practice applies, keep enabled true and use 5.
              Say that no security practice in this repository applies.
              Do not turn the check off.

              Drift. Use this section only when drift is enabled.
              score is an integer from 1 to 5. A higher score means the change moved farther from the original task.
              Compare the diff with the task title and the task description.
              1 means the change does what the task asks.
              2 means the change does the task and also makes a small extra change.
              3 means the change does the task and also adds work that raises risk past the task.
              4 means the change does most of the task and also does something the task did not ask for.
              5 means the change does something different from the task, or raises risk far past the task.
              If the task title and the task description are empty, use 1.
              summary is one sentence.
              Say what the task asked for and what the change did.
              Do not repeat the score. Do not write a second sentence.
          - name: Emit Review
            type: bash
            command: |-
              set -euo pipefail
              if [ ! -s /tmp/merge-confidence.json ]; then
                echo "Missing /tmp/merge-confidence.json" >&2
                exit 1
              fi
              jq -e 'has("risk") and has("performance") and has("security") and has("drift")' /tmp/merge-confidence.json >/dev/null
              cp /tmp/merge-confidence.json "$SUPERPLANE_RESULT_FILE"
      position:
        x: 920
        "y": 80
      isCollapsed: true
    - id: format-merge-confidence
      name: Format Merge Confidence
      type: TYPE_ACTION
      component: runnerJS
      configuration:
        execution_mode: host
        execution_timeout_seconds: 120
        machine_type: e1-tiny-amd64
        script: |-
          function main() {
            const review = ($["Assess Merge Confidence"] && $["Assess Merge Confidence"].data && $["Assess Merge Confidence"].data.result) || {};
            return {
              risk: normalizeCheck(review.risk),
              performance: normalizeCheck(review.performance),
              security: normalizeCheck(review.security),
              drift: normalizeCheck(review.drift),
            };
          }

          function normalizeCheck(value) {
            const item = value || {};
            const summary = String(item.summary || "").trim();
            return {
              enabled: item.enabled === true,
              score: clampScore(item.score),
              summary: summary,
            };
          }

          function clampScore(value) {
            const score = Number(value);
            if (!Number.isFinite(score)) return 1;
            return Math.max(1, Math.min(5, Math.round(score)));
          }
      position:
        x: 1200
        "y": 80
      isCollapsed: true
    - id: should-report-risk
      name: Report Risk?
      type: TYPE_ACTION
      component: if
      configuration:
        expression: '$["Format Merge Confidence"].data.result.risk.enabled == true'
      position:
        x: 1480
        "y": 80
      isCollapsed: true
    - id: report-risk-score
      name: Report Risk Score
      type: TYPE_ACTION
      component: reportWorkOrderCheck
      configuration:
        orderId: '{{ $["Find Pull Request"].data.workOrder.id }}'
        checkKey: risk-review
        name: Risk score
        format: fraction
        score: '{{ string($["Format Merge Confidence"].data.result.risk.score) }}'
        maxScore: "5"
        direction: lowerIsBetter
        cautionAt: 3
        criticalAt: 4
        summary: '{{ $["Format Merge Confidence"].data.result.risk.summary }}'
      position:
        x: 1760
        "y": 80
      isCollapsed: true
    - id: should-report-performance
      name: Report Performance?
      type: TYPE_ACTION
      component: if
      configuration:
        expression: '$["Format Merge Confidence"].data.result.performance.enabled == true'
      position:
        x: 1480
        "y": 260
      isCollapsed: true
    - id: report-performance
      name: Report Performance
      type: TYPE_ACTION
      component: reportWorkOrderCheck
      configuration:
        orderId: '{{ $["Find Pull Request"].data.workOrder.id }}'
        checkKey: performance-review
        name: Performance
        format: fraction
        score: '{{ string($["Format Merge Confidence"].data.result.performance.score) }}'
        maxScore: "5"
        direction: higherIsBetter
        cautionAt: 3
        criticalAt: 2
        summary: '{{ $["Format Merge Confidence"].data.result.performance.summary }}'
      position:
        x: 1760
        "y": 260
      isCollapsed: true
    - id: should-report-security
      name: Report Security?
      type: TYPE_ACTION
      component: if
      configuration:
        expression: '$["Format Merge Confidence"].data.result.security.enabled == true'
      position:
        x: 1480
        "y": 440
      isCollapsed: true
    - id: report-security
      name: Report Security
      type: TYPE_ACTION
      component: reportWorkOrderCheck
      configuration:
        orderId: '{{ $["Find Pull Request"].data.workOrder.id }}'
        checkKey: security-review
        name: Security
        format: fraction
        score: '{{ string($["Format Merge Confidence"].data.result.security.score) }}'
        maxScore: "5"
        direction: higherIsBetter
        cautionAt: 3
        criticalAt: 2
        summary: '{{ $["Format Merge Confidence"].data.result.security.summary }}'
      position:
        x: 1760
        "y": 440
      isCollapsed: true
    - id: should-report-drift
      name: Report Drift?
      type: TYPE_ACTION
      component: if
      configuration:
        expression: '$["Format Merge Confidence"].data.result.drift.enabled == true'
      position:
        x: 1480
        "y": 620
      isCollapsed: true
    - id: report-drift
      name: Report Drift
      type: TYPE_ACTION
      component: reportWorkOrderCheck
      configuration:
        orderId: '{{ $["Find Pull Request"].data.workOrder.id }}'
        checkKey: drift-review
        name: Drift
        format: fraction
        score: '{{ string($["Format Merge Confidence"].data.result.drift.score) }}'
        maxScore: "5"
        direction: lowerIsBetter
        cautionAt: 3
        criticalAt: 4
        summary: '{{ $["Format Merge Confidence"].data.result.drift.summary }}'
      position:
        x: 1760
        "y": 620
      isCollapsed: true
