apiVersion: v1
kind: Console
metadata:
  name: Factory Event App
  canvasId: __FACTORY_CANVAS_ID__
spec:
  panels:
    - id: about
      type: markdown
      content:
        title: About this app
        body: |
          > [!SECTION:setup] GitHub issue events
          >
          > This app is not a factory line step. It listens for closed issues
          > on the backlog repository.
          >
          > When the closed issue created a task:
          > - A task still in Backlog closes as rejected.
          > - A task that already left Backlog does not close.
  layout:
    - i: about
      x: 0
      'y': 0
      w: 12
      h: 6
      minW: 3
      minH: 5
