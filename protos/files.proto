syntax = "proto3";

package Superplane.Files;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/superplanehq/superplane/pkg/protos/files";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "SuperPlane Files API";
    version: "1.0";
    description: "API for SuperPlane platform files";
    contact: {
      name: "API Support";
      email: "support@superplane.com";
    };
  };
  schemes: HTTPS;
  schemes: HTTP;
  consumes: "application/json";
  produces: "application/json";
};

service Files {
  rpc CreateFactoryFile(CreateFactoryFileRequest) returns (CreateFactoryFileResponse) {
    option (google.api.http) = {
      post: "/api/v1/factories/{factory_id}/files"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create a workspace file";
      description: "Creates a pending workspace-scoped file. Upload bytes with PUT /api/v1/files/{file_id}/content.";
      tags: "Files";
    };
  }

  rpc ListFactoryFiles(ListFactoryFilesRequest) returns (ListFactoryFilesResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{factory_id}/files"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List workspace files";
      description: "Returns ready files scoped to a workspace";
      tags: "Files";
    };
  }

  rpc CreateWorkOrderFile(CreateWorkOrderFileRequest) returns (CreateWorkOrderFileResponse) {
    option (google.api.http) = {
      post: "/api/v1/factories/{factory_id}/orders/{order_id}/files"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create a task file";
      description: "Creates a pending task-scoped file. Upload bytes with PUT /api/v1/files/{file_id}/content.";
      tags: "Files";
    };
  }

  rpc ListWorkOrderFiles(ListWorkOrderFilesRequest) returns (ListWorkOrderFilesResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{factory_id}/orders/{order_id}/files"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List task files";
      description: "Returns ready files scoped to a task";
      tags: "Files";
    };
  }
}

message File {
  string id = 1;
  string filename = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  string checksum = 5;
  string scope = 6;
  string state = 7;
  string download_url = 8;
  string upload_url = 9;
  google.protobuf.Timestamp created_at = 10;
}

message CreateFactoryFileRequest {
  string factory_id = 1;
  string filename = 2;
  string content_type = 3;
}

message CreateFactoryFileResponse {
  File file = 1;
}

message ListFactoryFilesRequest {
  string factory_id = 1;
}

message ListFactoryFilesResponse {
  repeated File files = 1;
}

message CreateWorkOrderFileRequest {
  string factory_id = 1;
  string order_id = 2;
  string filename = 3;
  string content_type = 4;
}

message CreateWorkOrderFileResponse {
  File file = 1;
}

message ListWorkOrderFilesRequest {
  string factory_id = 1;
  string order_id = 2;
}

message ListWorkOrderFilesResponse {
  repeated File files = 1;
}
