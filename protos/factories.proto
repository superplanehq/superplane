      description: "Throws away the pending planning session draft";
      tags: "Factory";
    };
  }

  rpc AnswerPlanningSessionSurvey(AnswerPlanningSessionSurveyRequest) returns (AnswerPlanningSessionSurveyResponse) {
    option (google.api.http) = {
      post: "/api/v1/factories/{factory_id}/planning-sessions/{session_id}/survey/answer"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Answer planning session survey";
      description: "Submits answers to the pending agent question in a planning session";
      tags: "Factory";
    };
  }

}

