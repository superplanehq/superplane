syntax = "proto3";

package Superplane.Factories;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/superplanehq/superplane/pkg/protos/factories";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Superplane Factories API";
    version: "1.0";
    description: "API for Superplane Factories";
    contact: {
      name: "API Support";
      email: "support@superplane.com";
    };
  };
  schemes: HTTPS;
  schemes: HTTP;
  consumes: "application/json";
  produces: "application/json";
};

service Factories {
  rpc ListFactories(ListFactoriesRequest) returns (ListFactoriesResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List factories";
      description: "Returns a list of factories";
      tags: "Factory";
    };
  }

  rpc CreateFactory(CreateFactoryRequest) returns (CreateFactoryResponse) {
    option (google.api.http) = {
      post: "/api/v1/factories"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create factory";
      description: "Creates a new factory";
      tags: "Factory";
    };
  }

  rpc DescribeFactory(DescribeFactoryRequest) returns (DescribeFactoryResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Describe factory";
      description: "Returns a factory by its ID";
      tags: "Factory";
    };
  }

  rpc UpdateFactory(UpdateFactoryRequest) returns (UpdateFactoryResponse) {
    option (google.api.http) = {
      put: "/api/v1/factories/{id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update factory";
      description: "Updates factory metadata";
      tags: "Factory";
    };
  }

  rpc DeleteFactory(DeleteFactoryRequest) returns (DeleteFactoryResponse) {
    option (google.api.http) = {
      delete: "/api/v1/factories/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete factory";
      description: "Soft-deletes an existing factory";
      tags: "Factory";
    };
  }

  // Factory line APIs

  rpc CreateFactoryLine(CreateFactoryLineRequest) returns (CreateFactoryLineResponse) {
    option (google.api.http) = {
      post: "/api/v1/factories/{factory_id}/lines"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create factory line";
      description: "Creates a new line for a factory";
      tags: "Factory";
    };
  }

  rpc UpdateFactoryLine(UpdateFactoryLineRequest) returns (UpdateFactoryLineResponse) {
    option (google.api.http) = {
      patch: "/api/v1/factories/{factory_id}/lines/{line_id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update factory line";
      description: "Updates a factory line";
      tags: "Factory";
    };
  }

  // Factory app APIs

  rpc ListFactoryApps(ListFactoryAppsRequest) returns (ListFactoryAppsResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{factory_id}/apps"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List factory apps";
      description: "Returns canvases owned by a factory";
      tags: "Factory";
    };
  }

  // Work orders APIs

  rpc ListWorkOrders(ListWorkOrdersRequest) returns (ListWorkOrdersResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{factory_id}/orders"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List factory work orders";
      description: "Returns a list of work orders for a factory";
      tags: "Factory";
    };
  }

  rpc CreateWorkOrder(CreateWorkOrderRequest) returns (CreateWorkOrderResponse) {
    option (google.api.http) = {
      post: "/api/v1/factories/{factory_id}/orders"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create factory work order";
      description: "Creates a new work order for a factory";
      tags: "Factory";
    };
  }

  rpc DescribeWorkOrder(DescribeWorkOrderRequest) returns (DescribeWorkOrderResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{factory_id}/orders/{order_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Describe factory work order";
      description: "Returns a work order by its ID";
      tags: "Factory";
    };
  }

  rpc ListWorkOrderEvents(ListWorkOrderEventsRequest) returns (ListWorkOrderEventsResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{factory_id}/orders/{order_id}/events"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List factory work order events";
      description: "Returns a list of events for a work order";
      tags: "Factory";
    };
  }

  rpc UpdateWorkOrderAssignees(UpdateWorkOrderAssigneesRequest) returns (UpdateWorkOrderAssigneesResponse) {
    option (google.api.http) = {
      patch: "/api/v1/factories/{factory_id}/orders/{order_id}/assignees"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update a work order's assignees";
      description: "Updates the assignees of a work order";
      tags: "Factory";
    };
  }

  rpc DispatchWorkOrder(DispatchWorkOrderRequest) returns (DispatchWorkOrderResponse) {
    option (google.api.http) = {
      patch: "/api/v1/factories/{factory_id}/orders/{order_id}/dispatch"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Dispatch a work order";
      description: "Dispatches a work order to a factory line";
      tags: "Factory";
    };
  }

  rpc CloseWorkOrder(CloseWorkOrderRequest) returns (CloseWorkOrderResponse) {
    option (google.api.http) = {
      patch: "/api/v1/factories/{factory_id}/orders/{order_id}/close"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Close factory work order";
      description: "Closes a work order";
      tags: "Factory";
    };
  }

  rpc UpdateWorkOrderStatus(UpdateWorkOrderStatusRequest) returns (UpdateWorkOrderStatusResponse) {
    option (google.api.http) = {
      patch: "/api/v1/factories/{factory_id}/orders/{order_id}/status"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update work order status";
      description: "Transitions a work order between lifecycle states";
      tags: "Factory";
    };
  }

  rpc AddWorkOrderComment(AddWorkOrderCommentRequest) returns (AddWorkOrderCommentResponse) {
    option (google.api.http) = {
      post: "/api/v1/factories/{factory_id}/orders/{order_id}/comments"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Add work order comment";
      description: "Appends a comment to the work order timeline";
      tags: "Factory";
    };
  }

  rpc ListWorkOrderArtifacts(ListWorkOrderArtifactsRequest) returns (ListWorkOrderArtifactsResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{factory_id}/orders/{order_id}/artifacts"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List work order artifacts";
      description: "Returns artifacts attached to a work order";
      tags: "Factory";
    };
  }

  rpc CreateWorkOrderArtifact(CreateWorkOrderArtifactRequest) returns (CreateWorkOrderArtifactResponse) {
    option (google.api.http) = {
      post: "/api/v1/factories/{factory_id}/orders/{order_id}/artifacts"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create work order artifact";
      description: "Attaches a typed artifact to a work order";
      tags: "Factory";
    };
  }

  // Notification settings APIs.
  // Self-scoped: each user reads and writes only their own settings.
  // The path avoids `/api/v1/factories/{...}` so the gateway does not
  // match it against the `{id}` wildcard routes above.

  rpc DescribeNotificationSettings(DescribeNotificationSettingsRequest) returns (DescribeNotificationSettingsResponse) {
    option (google.api.http) = {
      get: "/api/v1/factory-notification-settings"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Describe notification settings";
      description: "Returns the calling user's work order notification settings";
      tags: "Factory";
    };
  }

  rpc UpdateNotificationSettings(UpdateNotificationSettingsRequest) returns (UpdateNotificationSettingsResponse) {
    option (google.api.http) = {
      put: "/api/v1/factory-notification-settings"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update notification settings";
      description: "Updates the calling user's work order notification settings";
      tags: "Factory";
    };
  }

}

// Factories

message ListFactoriesRequest {}

message ListFactoriesResponse {
  repeated Factory factories = 1;
}

message CreateFactoryRequest {
  string name = 1;
  string description = 2;
  // Workspace key. 2 to 5 uppercase letters, unique per organization.
  // Used with the sequence number to render identifiers such as `SP-1`.
  string key = 3;
}

message CreateFactoryResponse {
  Factory factory = 1;
}

message DescribeFactoryRequest {
  string id = 1;
}

message DescribeFactoryResponse {
  Factory factory = 1;
}

message UpdateFactoryRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  // New workspace key. 2 to 5 uppercase letters, unique per organization.
  // Updating this changes the identifier shown for every work order.
  optional string key = 4;
}

message UpdateFactoryResponse {
  Factory factory = 1;
}

message DeleteFactoryRequest {
  string id = 1;
}

message DeleteFactoryResponse {}

message Factory {
  message App {
    string id = 1;
    string name = 2;
    string description = 3;
    google.protobuf.Timestamp created_at = 4;
    google.protobuf.Timestamp updated_at = 5;
  }

  string id = 1;
  string name = 2;
  string description = 3;
  repeated FactoryLine lines = 4;
  // Workspace key. 2 to 5 uppercase letters, unique per organization.
  string key = 5;
}

message FactoryLine {
  message Step {
    string name = 1;
    string type = 2;
    optional AppStep app = 3;
  }

  message AppStep {
    string app = 1;
    string entrypoint = 2;
  }

  string id = 1;
  string name = 2;
  repeated Step steps = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message CreateFactoryLineRequest {
  string factory_id = 1;
  string name = 2;
  repeated FactoryLine.Step steps = 3;
}

message CreateFactoryLineResponse {
  FactoryLine line = 1;
}

message UpdateFactoryLineRequest {
  string factory_id = 1;
  string line_id = 2;
  optional string name = 3;
  repeated FactoryLine.Step steps = 4;
}

message UpdateFactoryLineResponse {
  FactoryLine line = 1;
}

message ListFactoryAppsRequest {
  string factory_id = 1;
}

message ListFactoryAppsResponse {
  repeated Factory.App apps = 1;
}

// Work orders

message ListWorkOrdersRequest {
  string factory_id = 1;
  repeated string assignee_ids = 2;
  repeated WorkOrder.State states = 3;
  repeated WorkOrder.Result results = 4;
  optional bool unassigned = 5;
}

message ListWorkOrdersResponse {
  repeated WorkOrder orders = 1;
}

message CreateWorkOrderRequest {
  string factory_id = 1;
  string title = 2;
  string description = 3;
  repeated string assignee_ids = 4;
}

message CreateWorkOrderResponse {
  WorkOrder order = 1;
}

message CloseWorkOrderRequest {
  string factory_id = 1;
  string order_id = 2;
  WorkOrder.Result result = 3;
}

message CloseWorkOrderResponse {
  WorkOrder order = 1;
}

message WorkOrder {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_DRAFT = 1;
    STATE_OPEN = 2;
    STATE_CLOSED = 3;
  }

  enum Result {
    RESULT_UNSPECIFIED = 0;
    RESULT_COMPLETED = 1;
    RESULT_REJECTED = 2;
    RESULT_FAILED = 3;
  }

  string id = 1;
  string title = 2;
  string description = 3;
  State state = 4;
  Result result = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  repeated UserRef assignees = 8;
  repeated WorkOrderExecution executions = 9;
  // Author of the work order: either a member (`user`) or the canvas
  // automation (`automation`) that opened the order from a source run.
  WorkOrderCreator created_by = 10;
  // Aggregate usage summed across executions. UI hides values that are zero.
  int64 total_tokens = 11;
  int64 total_cost_cents = 12;
  // Immutable factory-scoped sequence number, allocated atomically at
  // creation time. Combined with the parent factory's key to render the
  // display identifier (for example `SP-42`).
  int64 number = 13;
  // Display identifier composed of the parent factory's key and this
  // order's `number` (for example `SP-42`). Populated by the server.
  string key = 14;
}

message WorkOrderCreator {
  oneof kind {
    UserRef user = 1;
    AutomationRef automation = 2;
  }
}

message UserRef {
  string id = 1;
  string name = 2;
}

message WorkOrderExecution {
  enum State {
    STATE_UNKNOWN = 0;
    STATE_PENDING = 1;
    STATE_STARTED = 2;
    STATE_CANCELLING = 3;
    STATE_FINISHED = 4;
  }

  enum Result {
    RESULT_UNKNOWN = 0;
    RESULT_PASSED = 1;
    RESULT_FAILED = 2;
    RESULT_CANCELLED = 3;
  }

  message LineRef {
    string id = 1;
    string name = 2;
  }

  message RunRef {
    string id = 1;
    string app_id = 2;
    string app_name = 3;
  }

  string id = 1;
  LineRef line = 2;
  string step = 3;
  State state = 4;
  Result result = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  RunRef run = 8;
  // Zero-based index of the step inside the containing line; matches the
  // position in `steps` so the UI can highlight the current step.
  int32 step_index = 9;
  // Steps the run walks through, snapshotted from the line's step
  // definitions. The current execution's `step_index` marks the active step.
  repeated WorkOrderExecutionStep steps = 10;
  // Optional aggregate usage; UI hides zero values.
  int64 total_tokens = 11;
  int64 cost_cents = 12;
  // When the execution finished (set for finished executions only).
  google.protobuf.Timestamp finished_at = 13;
}

message WorkOrderExecutionStep {
  string name = 1;
  int32 step_index = 2;
}

message DescribeWorkOrderRequest {
  string factory_id = 1;
  string order_id = 2;
}

message DescribeWorkOrderResponse {
  WorkOrder order = 1;
}

message UpdateWorkOrderAssigneesRequest {
  string factory_id = 1;
  string order_id = 2;
  repeated string assignee_ids = 3;
}

message UpdateWorkOrderAssigneesResponse {
  WorkOrder order = 1;
}

message DispatchWorkOrderRequest {
  string factory_id = 1;
  string order_id = 2;
  string line_name = 3;
}

message DispatchWorkOrderResponse {
  WorkOrder order = 1;
}

message ListWorkOrderEventsRequest {
  string factory_id = 1;
  string order_id = 2;
  uint32 limit = 3;
  google.protobuf.Timestamp before = 4;
}

message ListWorkOrderEventsResponse {
  repeated WorkOrderEvent events = 1;
  uint32 total_count = 2;
  bool has_next_page = 3;
  google.protobuf.Timestamp last_timestamp = 4;
}

message WorkOrderEvent {
  google.protobuf.Timestamp timestamp = 1;
  string type = 2;
  google.protobuf.Struct event = 3;
}

// Status / comments / artifacts

message UpdateWorkOrderStatusRequest {
  string factory_id = 1;
  string order_id = 2;
  WorkOrder.State state = 3;
  WorkOrder.Result result = 4;
}

message UpdateWorkOrderStatusResponse {
  WorkOrder order = 1;
}

message AddWorkOrderCommentRequest {
  string factory_id = 1;
  string order_id = 2;
  string body = 3;
}

message AddWorkOrderCommentResponse {
  WorkOrderComment comment = 1;
}

message WorkOrderComment {
  string id = 1;
  string body = 2;
  WorkOrderCommentAuthor author = 3;
  google.protobuf.Timestamp created_at = 4;
}

message WorkOrderCommentAuthor {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_USER = 1;
    KIND_AUTOMATION = 2;
  }

  Kind kind = 1;
  string user_id = 2;
  // Populated for `automation` comments: identifies the canvas node
  // (and app) that wrote the comment.
  AutomationRef automation = 3;
}

message AutomationRef {
  string node_id = 1;
  string node_name = 2;
  string app_id = 3;
  string app_name = 4;
}

message ListWorkOrderArtifactsRequest {
  string factory_id = 1;
  string order_id = 2;
}

message ListWorkOrderArtifactsResponse {
  repeated WorkOrderArtifact artifacts = 1;
}

message CreateWorkOrderArtifactRequest {
  string factory_id = 1;
  string order_id = 2;
  WorkOrderArtifact.Type type = 3;
  google.protobuf.Struct data = 4;
}

message CreateWorkOrderArtifactResponse {
  WorkOrderArtifact artifact = 1;
}

message WorkOrderArtifact {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_PR = 1;
    TYPE_MARKDOWN = 2;
    TYPE_BRANCH = 3;
  }

  string id = 1;
  Type type = 2;
  google.protobuf.Struct data = 3;
  UserRef created_by = 4;
  google.protobuf.Timestamp created_at = 5;
}

// Notification settings

// NotificationSettings is a user's organization-wide configuration for
// work order notification emails. Type toggles default to on; the master
// `enabled` switch defaults to off until the user saves settings.
message NotificationSettings {
  enum WorkspaceScope {
    WORKSPACE_SCOPE_UNSPECIFIED = 0;
    WORKSPACE_SCOPE_ALL = 1;
    WORKSPACE_SCOPE_SELECTED = 2;
  }

  bool enabled = 1;
  WorkspaceScope workspace_scope = 2;
  // Factory (workspace) IDs covered when `workspace_scope` is SELECTED.
  repeated string factory_ids = 3;
  // Notification type toggles.
  bool work_order_assigned = 4;
  bool work_order_comment_owned = 5;
  bool work_order_comment_created = 6;
  bool work_order_status_owned = 7;
  bool work_order_artifact_owned = 8;
}

message DescribeNotificationSettingsRequest {}

message DescribeNotificationSettingsResponse {
  NotificationSettings settings = 1;
}

message UpdateNotificationSettingsRequest {
  NotificationSettings settings = 1;
}

message UpdateNotificationSettingsResponse {
  NotificationSettings settings = 1;
}

// Internal AMQP message for factory work-order websocket fan-out.
message FactoryWorkOrderUpdatedMessage {
  string factory_id = 1;
  string order_id = 2;
  string reason = 3;
  google.protobuf.Timestamp timestamp = 4;
}
