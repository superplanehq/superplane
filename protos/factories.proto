  WorkOrderArtifact.Type type = 3;
  google.protobuf.Struct data = 4;
}

message CreateWorkOrderArtifactResponse {
  WorkOrderArtifact artifact = 1;
}

message WorkOrderArtifact {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_PR = 1;
    TYPE_MARKDOWN = 2;
    TYPE_BRANCH = 3;
    TYPE_LINK = 4;
  }

  string id = 1;
