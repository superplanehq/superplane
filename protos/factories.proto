// Work orders

message ListWorkOrdersRequest {
  string factory_id = 1;
  repeated string assignee_ids = 2;
  repeated WorkOrder.State states = 3;
  repeated WorkOrder.Result results = 4;
  optional bool unassigned = 5;
}

message ListWorkOrdersResponse {
  repeated WorkOrder orders = 1;
}

message CreateWorkOrderRequest {
  string factory_id = 1;
  string title = 2;
  string description = 3;
  repeated string assignee_ids = 4;
}

message CreateWorkOrderResponse {
  WorkOrder order = 1;
}

message CloseWorkOrderRequest {
  string factory_id = 1;
  string order_id = 2;
  WorkOrder.Result result = 3;
}

message CloseWorkOrderResponse {
  WorkOrder order = 1;
}

message WorkOrder {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_DRAFT = 1;
    STATE_OPEN = 2;
    STATE_CLOSED = 3;
  }

  enum Result {
    RESULT_UNSPECIFIED = 0;
    RESULT_COMPLETED = 1;
    RESULT_REJECTED = 2;
    RESULT_FAILED = 3;
  }

  string id = 1;
  string title = 2;
  string description = 3;
  State state = 4;
  Result result = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  repeated UserRef assignees = 8;
  // Author of the work order: either a member (`user`) or the canvas
  // automation (`automation`) that opened the order from a source run.
  WorkOrderCreator created_by = 9;
  // Aggregate usage summed across all step executions of all line
  // dispatches. UI hides values that are zero.
  int64 total_tokens = 10;
  int64 total_cost_cents = 11;
  // Immutable factory-scoped sequence number, allocated atomically at
  // creation time. Combined with the parent factory's key to render the
  // display identifier (for example `SP-42`).
  int64 number = 12;
  // Display identifier composed of the parent factory's key and this
  // order's `number` (for example `SP-42`). Populated by the server.
  string key = 13;
  // Every traversal of this work order through a factory line, oldest
  // first. A line dispatched twice (e.g. a failed traversal re-dispatched)
  // produces two separate entries here, each with its own step executions.
  repeated WorkOrderLineDispatch line_dispatches = 14;
  // Current-wait announcements set by automations: what a waiting order
  // is blocked on and what resolves it. One entry per note key; any
  // state transition clears the whole set.
  repeated WorkOrderStatusNote status_notes = 15;
}

// WorkOrderStatusNote announces what a waiting work order is blocked on
// and what resolves it. Notes are latest-only per key: setting a note
// with the same key updates it in place, and a different key sits
// beside it. Any state transition clears the whole set.
message WorkOrderStatusNote {
  string key = 1;
  string kind = 2;
  string headline = 3;
  string body = 4;
  string cta_label = 5;
  string cta_url = 6;
  // Automation that set the note and the run that produced it.
  AutomationRef automation = 7;
  string run_id = 8;
  google.protobuf.Timestamp updated_at = 9;
  // When true, the work order page hides this note while a line is
  // running. The default is false: the note stays visible for the
  // whole open wait.
  bool show_only_when_waiting = 10;
}

message WorkOrderCreator {
  oneof kind {
    UserRef user = 1;
    AutomationRef automation = 2;
  }
}

message UserRef {
  string id = 1;
  string name = 2;
}

// LineRef identifies a factory line as it was at the time it was
// referenced — used both for a line dispatch's own line and (denormalized)
// on the canvas run/automation refs that trace back to it.
message LineRef {
  string id = 1;
  string name = 2;
}

// WorkOrderLineDispatch is one traversal of a work order through a factory
// line: a dispatch creates one, and every step run started while walking
// the line hangs off it as a `step_executions` entry.
message WorkOrderLineDispatch {
  enum State {
    STATE_UNKNOWN = 0;
    STATE_ACTIVE = 1;
    STATE_FINISHED = 2;
  }

  enum Result {
    RESULT_UNKNOWN = 0;
    RESULT_PASSED = 1;
    RESULT_FAILED = 2;
    RESULT_CANCELLED = 3;
  }

  string id = 1;
  LineRef line = 2;
  // Steps snapshotted from the line's definition at dispatch time, so a
  // line edited mid-traversal doesn't change what an in-flight or
  // historical dispatch shows. Serialized once here instead of once per
  // step execution.
  repeated WorkOrderExecutionStep steps = 3;
  State state = 4;
  Result result = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  repeated WorkOrderExecution step_executions = 8;
  // Set while the dispatch waits for admission into a step that is at
  // its maxParallelism. A dispatch waits at no more than one step at a
  // time; no run or step execution exists for a queued step yet.
  optional WorkOrderQueueItem queue_item = 9;
}

// WorkOrderQueueItem is a line dispatch waiting for admission into a step
// that is at its maxParallelism. The run and step execution are created
// when the step admits the work order.
message WorkOrderQueueItem {
  string id = 1;
  string step_name = 2;
  // Zero-based index of the step inside the parent dispatch's `steps`
  // snapshot.
  int32 step_index = 3;
  // 1-based position in the step's FIFO queue across all work orders of
  // the line.
  int32 position = 4;
  google.protobuf.Timestamp created_at = 5;
  // App (canvas) id of the queued step, from the parent dispatch's steps
  // snapshot. Lets the UI place the queued work order on the correct
  // board column even after a line edit moved the step.
  string app_id = 6;
}

message WorkOrderExecution {
  enum State {
    STATE_UNKNOWN = 0;
    STATE_PENDING = 1;
    STATE_STARTED = 2;
    STATE_CANCELLING = 3;
    STATE_FINISHED = 4;
  }

  enum Result {
    RESULT_UNKNOWN = 0;
    RESULT_PASSED = 1;
    RESULT_FAILED = 2;
    RESULT_CANCELLED = 3;
  }

  message RunRef {
    string id = 1;
    string app_id = 2;
    string app_name = 3;
  }

  string id = 1;
  string step = 2;
  State state = 3;
  Result result = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  RunRef run = 7;
  // Zero-based index of the step inside the parent WorkOrderLineDispatch's
  // `steps` snapshot; matches the position there so the UI can highlight
  // the active step.
  int32 step_index = 8;
  // Optional aggregate usage; UI hides zero values.
  int64 total_tokens = 9;
  int64 cost_cents = 10;
  // When the execution finished (set for finished executions only).
  google.protobuf.Timestamp finished_at = 11;
}

message WorkOrderExecutionStep {
  string name = 1;
  int32 step_index = 2;
}

