syntax = "proto3";

package Superplane.Factories;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/superplanehq/superplane/pkg/protos/factories";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Superplane Factories API";
    version: "1.0";
    description: "API for Superplane Factories";
    contact: {
      name: "API Support";
      email: "support@superplane.com";
    };
  };
  schemes: HTTPS;
  schemes: HTTP;
  consumes: "application/json";
  produces: "application/json";
};

service Factories {
  rpc ListFactories(ListFactoriesRequest) returns (ListFactoriesResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List factories";
      description: "Returns a list of factories";
      tags: "Factory";
    };
  }

  rpc CreateFactory(CreateFactoryRequest) returns (CreateFactoryResponse) {
    option (google.api.http) = {
      post: "/api/v1/factories"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create factory";
      description: "Creates a new factory";
      tags: "Factory";
    };
  }

  rpc DescribeFactory(DescribeFactoryRequest) returns (DescribeFactoryResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Describe factory";
      description: "Returns a factory by its ID";
      tags: "Factory";
    };
  }

  rpc UpdateFactory(UpdateFactoryRequest) returns (UpdateFactoryResponse) {
    option (google.api.http) = {
      put: "/api/v1/factories/{id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update factory";
      description: "Updates factory metadata";
      tags: "Factory";
    };
  }

  rpc UpdateFactoryOnboarding(UpdateFactoryOnboardingRequest) returns (UpdateFactoryOnboardingResponse) {
    option (google.api.http) = {
      patch: "/api/v1/factories/{id}/onboarding"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update factory onboarding";
      description: "Saves workspace onboarding progress and optionally marks setup complete";
      tags: "Factory";
    };
  }

  rpc DeleteFactory(DeleteFactoryRequest) returns (DeleteFactoryResponse) {
    option (google.api.http) = {
      delete: "/api/v1/factories/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete factory";
      description: "Soft-deletes an existing factory";
      tags: "Factory";
    };
  }

  // Factory line APIs

  rpc CreateFactoryLine(CreateFactoryLineRequest) returns (CreateFactoryLineResponse) {
    option (google.api.http) = {
      post: "/api/v1/factories/{factory_id}/lines"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create factory line";
      description: "Creates a new line for a factory";
      tags: "Factory";
    };
  }

  rpc UpdateFactoryLine(UpdateFactoryLineRequest) returns (UpdateFactoryLineResponse) {
    option (google.api.http) = {
      patch: "/api/v1/factories/{factory_id}/lines/{line_id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update factory line";
      description: "Updates a factory line";
      tags: "Factory";
    };
  }

  // Factory app APIs

  rpc ListFactoryApps(ListFactoryAppsRequest) returns (ListFactoryAppsResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{factory_id}/apps"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List factory apps";
      description: "Returns canvases owned by a factory";
      tags: "Factory";
    };
  }

  // Factory intake APIs

  rpc ListFactoryIntakes(ListFactoryIntakesRequest) returns (ListFactoryIntakesResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{factory_id}/intakes"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List factory intakes";
      description: "Returns the intakes of a factory";
      tags: "Factory";
    };
  }

  rpc CreateFactoryIntake(CreateFactoryIntakeRequest) returns (CreateFactoryIntakeResponse) {
    option (google.api.http) = {
      post: "/api/v1/factories/{factory_id}/intakes"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create factory intake";
      description: "Creates an intake and the canvas that runs it";
      tags: "Factory";
    };
  }

  rpc UpdateFactoryIntake(UpdateFactoryIntakeRequest) returns (UpdateFactoryIntakeResponse) {
    option (google.api.http) = {
      patch: "/api/v1/factories/{factory_id}/intakes/{intake_id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update factory intake";
      description: "Updates the name and settings of an intake";
      tags: "Factory";
    };
  }

  rpc DeleteFactoryIntake(DeleteFactoryIntakeRequest) returns (DeleteFactoryIntakeResponse) {
    option (google.api.http) = {
      delete: "/api/v1/factories/{factory_id}/intakes/{intake_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete factory intake";
      description: "Deletes an intake and its canvas";
      tags: "Factory";
    };
  }

  rpc ListFactoryIntakeRuns(ListFactoryIntakeRunsRequest) returns (ListFactoryIntakeRunsResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{factory_id}/intakes/{intake_id}/runs"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List factory intake runs";
      description: "Returns what an intake received, how it scored, and where it went";
      tags: "Factory";
    };
  }

  // Factory PR feedback handler APIs

  rpc ListFactoryPRFeedbackHandlers(
    ListFactoryPRFeedbackHandlersRequest
  ) returns (ListFactoryPRFeedbackHandlersResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{factory_id}/pr-feedback-handlers"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List factory PR feedback handlers";
      description: "Returns the PR feedback handlers of a factory";
      tags: "Factory";
    };
  }

  rpc CreateFactoryPRFeedbackHandler(
    CreateFactoryPRFeedbackHandlerRequest
  ) returns (CreateFactoryPRFeedbackHandlerResponse) {
    option (google.api.http) = {
      post: "/api/v1/factories/{factory_id}/pr-feedback-handlers"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create factory PR feedback handler";
      description: "Creates a PR feedback handler and the canvas that runs it";
      tags: "Factory";
    };
  }

  rpc UpdateFactoryPRFeedbackHandler(
    UpdateFactoryPRFeedbackHandlerRequest
  ) returns (UpdateFactoryPRFeedbackHandlerResponse) {
    option (google.api.http) = {
      patch: "/api/v1/factories/{factory_id}/pr-feedback-handlers/{handler_id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update factory PR feedback handler";
      description: "Updates the name and settings of a PR feedback handler";
      tags: "Factory";
    };
  }

  rpc DeleteFactoryPRFeedbackHandler(
    DeleteFactoryPRFeedbackHandlerRequest
  ) returns (DeleteFactoryPRFeedbackHandlerResponse) {
    option (google.api.http) = {
      delete: "/api/v1/factories/{factory_id}/pr-feedback-handlers/{handler_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete factory PR feedback handler";
      description: "Deletes a PR feedback handler and its canvas";
      tags: "Factory";
    };
  }

  rpc ListFactoryPRFeedbackHandlerRuns(
    ListFactoryPRFeedbackHandlerRunsRequest
  ) returns (ListFactoryPRFeedbackHandlerRunsResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{factory_id}/pr-feedback-handlers/{handler_id}/runs"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List factory PR feedback handler runs";
      description: "Returns the runs that addressed pull request feedback";
      tags: "Factory";
    };
  }

  // Work orders APIs

  rpc ListWorkOrders(ListWorkOrdersRequest) returns (ListWorkOrdersResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{factory_id}/orders"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List factory work orders";
      description: "Returns a list of work orders for a factory";
      tags: "Factory";
    };
  }

  rpc CreateWorkOrder(CreateWorkOrderRequest) returns (CreateWorkOrderResponse) {
    option (google.api.http) = {
      post: "/api/v1/factories/{factory_id}/orders"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create factory work order";
      description: "Creates a new work order for a factory";
      tags: "Factory";
    };
  }

  rpc DescribeWorkOrder(DescribeWorkOrderRequest) returns (DescribeWorkOrderResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{factory_id}/orders/{order_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Describe factory work order";
      description: "Returns a work order by its ID";
      tags: "Factory";
    };
  }

  rpc ListWorkOrderEvents(ListWorkOrderEventsRequest) returns (ListWorkOrderEventsResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{factory_id}/orders/{order_id}/events"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List factory work order events";
      description: "Returns a list of events for a work order";
      tags: "Factory";
    };
  }

  rpc UpdateWorkOrderAssignees(UpdateWorkOrderAssigneesRequest) returns (UpdateWorkOrderAssigneesResponse) {
    option (google.api.http) = {
      patch: "/api/v1/factories/{factory_id}/orders/{order_id}/assignees"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update a work order's assignees";
      description: "Updates the assignees of a work order";
      tags: "Factory";
    };
  }

  rpc UpdateWorkOrder(UpdateWorkOrderRequest) returns (UpdateWorkOrderResponse) {
    option (google.api.http) = {
      patch: "/api/v1/factories/{factory_id}/orders/{order_id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update factory work order";
      description: "Updates the title and description of a work order";
      tags: "Factory";
    };
  }

  rpc DispatchWorkOrder(DispatchWorkOrderRequest) returns (DispatchWorkOrderResponse) {
    option (google.api.http) = {
      patch: "/api/v1/factories/{factory_id}/orders/{order_id}/dispatch"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Dispatch a work order";
      description: "Dispatches a work order to a factory line";
      tags: "Factory";
    };
  }

  rpc CloseWorkOrder(CloseWorkOrderRequest) returns (CloseWorkOrderResponse) {
    option (google.api.http) = {
      patch: "/api/v1/factories/{factory_id}/orders/{order_id}/close"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Close factory work order";
      description: "Closes a work order";
      tags: "Factory";
    };
  }

  rpc UpdateWorkOrderStatus(UpdateWorkOrderStatusRequest) returns (UpdateWorkOrderStatusResponse) {
    option (google.api.http) = {
      patch: "/api/v1/factories/{factory_id}/orders/{order_id}/status"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update work order status";
      description: "Transitions a work order between lifecycle states";
      tags: "Factory";
    };
  }

  rpc AddWorkOrderComment(AddWorkOrderCommentRequest) returns (AddWorkOrderCommentResponse) {
    option (google.api.http) = {
      post: "/api/v1/factories/{factory_id}/orders/{order_id}/comments"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Add work order comment";
      description: "Appends a comment to the work order timeline";
      tags: "Factory";
    };
  }

  rpc ListWorkOrderArtifacts(ListWorkOrderArtifactsRequest) returns (ListWorkOrderArtifactsResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{factory_id}/orders/{order_id}/artifacts"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List work order artifacts";
      description: "Returns artifacts attached to a work order";
      tags: "Factory";
    };
  }

  rpc CreateWorkOrderArtifact(CreateWorkOrderArtifactRequest) returns (CreateWorkOrderArtifactResponse) {
    option (google.api.http) = {
      post: "/api/v1/factories/{factory_id}/orders/{order_id}/artifacts"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create work order artifact";
      description: "Attaches a typed artifact to a work order";
      tags: "Factory";
    };
  }

  rpc DescribeFactoryVelocity(DescribeFactoryVelocityRequest) returns (DescribeFactoryVelocityResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{factory_id}/velocity"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Describe factory velocity";
      description: "Returns SuperPlane vs People merge counts and waste for a factory over a period";
      tags: "Factory";
    };
  }

  rpc ListWorkOrderChecks(ListWorkOrderChecksRequest) returns (ListWorkOrderChecksResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{factory_id}/orders/{order_id}/checks"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List work order checks";
      description: "Returns scored checks reported on a work order";
      tags: "Factory";
    };
  }

  rpc DescribeFactoryUsage(DescribeFactoryUsageRequest) returns (DescribeFactoryUsageResponse) {
    option (google.api.http) = {
      get: "/api/v1/factories/{factory_id}/usage"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Describe factory LLM spend";
      description: "Returns token and estimated dollar spend for a workspace, grouped by model";
      tags: "Factory";
    };
  }

}

// Factories

message ListFactoriesRequest {}

message ListFactoriesResponse {
  repeated Factory factories = 1;
}

message CreateFactoryRequest {
  string name = 1;
  string description = 2;
  // Workspace key. 2 to 5 uppercase letters, unique per organization.
  // Used with the sequence number to render identifiers such as `SP-1`.
  string key = 3;
}

message CreateFactoryResponse {
  Factory factory = 1;
}

message DescribeFactoryRequest {
  string id = 1;
}

message DescribeFactoryResponse {
  Factory factory = 1;
}

message UpdateFactoryRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  // New workspace key. 2 to 5 uppercase letters, unique per organization.
  // Updating this changes the identifier shown for every work order.
  optional string key = 4;
}

message UpdateFactoryResponse {
  Factory factory = 1;
}

message UpdateFactoryOnboardingRequest {
  string id = 1;
  // Organization integration used for version control.
  optional string vcs_integration_id = 2;
  // Organization integration used for the coding agent.
  optional string agent_integration_id = 3;
  // App repository slug (for example `acme/api`).
  optional string app_repository = 4;
  // Backlog repository slug. May differ from the app repository.
  optional string backlog_repository = 5;
  optional FactoryOnboarding.IssuesSource issues_source = 6;
  optional FactoryOnboarding.AgentHarness agent_harness = 7;
  // Canvas ID created during Software Factory provisioning.
  optional string provisioned_app_id = 8;
  // Default factory line ID created after the app is ready.
  optional string provisioned_line_id = 9;
  // When true, validate readiness and set onboarding_completed_at.
  optional bool complete = 10;
}

message UpdateFactoryOnboardingResponse {
  Factory factory = 1;
}

message DeleteFactoryRequest {
  string id = 1;
}

message DeleteFactoryResponse {}

message FactoryOnboarding {
  enum IssuesSource {
    ISSUES_SOURCE_UNSPECIFIED = 0;
    ISSUES_SOURCE_VCS = 1;
    ISSUES_SOURCE_LINEAR = 2;
    ISSUES_SOURCE_JIRA = 3;
    ISSUES_SOURCE_SKIP = 4;
  }

  enum AgentHarness {
    AGENT_HARNESS_UNSPECIFIED = 0;
    AGENT_HARNESS_CLAUDE_CODE = 1;
    AGENT_HARNESS_CURSOR = 2;
    AGENT_HARNESS_CODEX = 3;
  }

  // Set when workspace setup finished. Null while onboarding is open.
  google.protobuf.Timestamp completed_at = 1;
  string vcs_integration_id = 2;
  string agent_integration_id = 3;
  string app_repository = 4;
  string backlog_repository = 5;
  IssuesSource issues_source = 6;
  AgentHarness agent_harness = 7;
  string provisioned_app_id = 8;
  string provisioned_line_id = 9;
}

message Factory {
  message App {
    string id = 1;
    string name = 2;
    string description = 3;
    google.protobuf.Timestamp created_at = 4;
    google.protobuf.Timestamp updated_at = 5;
  }

  string id = 1;
  string name = 2;
  string description = 3;
  repeated FactoryLine lines = 4;
  // Workspace key. 2 to 5 uppercase letters, unique per organization.
  string key = 5;
  FactoryOnboarding onboarding = 6;
}

message FactoryLine {
  message Step {
    string type = 1;
    optional AppStep app = 2;
    // Maximum in-flight runs for this step across all work orders on the
    // line. Work orders above this limit wait in the step's queue. Unset
    // means the server default (10). Must be at least 1 when set.
    optional int32 max_parallelism = 3;
  }

  message AppStep {
    string app = 1;
    string entrypoint = 2;
  }

  string id = 1;
  string name = 2;
  repeated Step steps = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  // Trailing 30-day summary. Unset when the line has no closed work orders in the window.
  optional FactoryLineMetrics metrics = 6;
}

message CreateFactoryLineRequest {
  string factory_id = 1;
  string name = 2;
  repeated FactoryLine.Step steps = 3;
}

message CreateFactoryLineResponse {
  FactoryLine line = 1;
}

message UpdateFactoryLineRequest {
  string factory_id = 1;
  string line_id = 2;
  optional string name = 3;
  repeated FactoryLine.Step steps = 4;
}

message UpdateFactoryLineResponse {
  FactoryLine line = 1;
}

message ListFactoryAppsRequest {
  string factory_id = 1;
}

message ListFactoryAppsResponse {
  repeated Factory.App apps = 1;
}

// Factory intakes

message FactoryIntake {
  enum Source {
    SOURCE_UNSPECIFIED = 0;
    SOURCE_GITHUB_ISSUES = 1;
    SOURCE_SENTRY_EXCEPTIONS = 2;
    SOURCE_PAGERDUTY_INCIDENTS = 3;
  }

  // Settings that change what the intake does. They are stored in the canvas
  // graph, because the canvas is what the workers run. This block is a
  // read/write facade over that graph.
  message Settings {
    enum LabelFilterMode {
      LABEL_FILTER_MODE_UNSPECIFIED = 0;
      // Analyze only items that carry one of the labels.
      LABEL_FILTER_MODE_INCLUDE = 1;
      // Skip items that carry one of the labels.
      LABEL_FILTER_MODE_EXCLUDE = 2;
    }

    enum Assignment {
      ASSIGNMENT_UNSPECIFIED = 0;
      ASSIGNMENT_ANY = 1;
      ASSIGNMENT_ASSIGNED = 2;
      ASSIGNMENT_UNASSIGNED = 3;
    }

    // Lowest analysis score that still creates a work order.
    int32 confidence_pct = 1;
    // Labels the filter applies to. Used by GitHub issue intakes only.
    repeated string labels = 2;
    LabelFilterMode label_filter_mode = 3;
    Assignment assignment = 4;
  }

  string id = 1;
  string factory_id = 2;
  // Canvas that implements the intake. Use it to open the automation editor.
  string canvas_id = 3;
  string name = 4;
  string description = 5;
  Source source = 6;
  Settings settings = 7;
  // False when the canvas can no longer receive an item, score it, and create
  // a work order. The intake stays listed so the user can repair it.
  bool healthy = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message FactoryIntakeRun {
  // Where the item ended up after the intake scored it.
  enum Placement {
    PLACEMENT_UNSPECIFIED = 0;
    // The analysis is still running.
    PLACEMENT_ANALYZING = 1;
    // The score was below the threshold, so no work order was created.
    PLACEMENT_BELOW_THRESHOLD = 2;
    PLACEMENT_BACKLOG = 3;
    PLACEMENT_REJECTED = 4;
    // The work order started on a line.
    PLACEMENT_PROGRESSED = 5;
  }

  string id = 1;
  string title = 2;
  // Unset while the analysis runs, or when the analysis returned no score.
  optional int32 confidence_pct = 3;
  Placement placement = 4;
  string work_order_id = 5;
  // Line step the work order reached. Set only when progressed.
  string stage = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp analyzed_at = 8;
}

message ListFactoryIntakesRequest {
  string factory_id = 1;
}

message ListFactoryIntakesResponse {
  repeated FactoryIntake intakes = 1;
}

message CreateFactoryIntakeRequest {
  string factory_id = 1;
  FactoryIntake.Source source = 2;
  // Defaults to a name derived from the source when empty.
  string name = 3;
  optional int32 confidence_pct = 4;
}

message CreateFactoryIntakeResponse {
  FactoryIntake intake = 1;
}

message UpdateFactoryIntakeRequest {
  string factory_id = 1;
  string intake_id = 2;
  optional string name = 3;
  optional FactoryIntake.Settings settings = 4;
}

message UpdateFactoryIntakeResponse {
  FactoryIntake intake = 1;
}

message DeleteFactoryIntakeRequest {
  string factory_id = 1;
  string intake_id = 2;
}

message DeleteFactoryIntakeResponse {}

message ListFactoryIntakeRunsRequest {
  string factory_id = 1;
  string intake_id = 2;
  int32 limit = 3;
  // Page backwards from this timestamp.
  google.protobuf.Timestamp before = 4;
}

message ListFactoryIntakeRunsResponse {
  repeated FactoryIntakeRun runs = 1;
  google.protobuf.Timestamp last_timestamp = 2;
}

// Factory PR feedback handlers

message FactoryPRFeedbackHandler {
  enum Source {
    SOURCE_UNSPECIFIED = 0;
    SOURCE_GITHUB_PULL_REQUESTS = 1;
  }

  // Settings stored in the canvas graph. This block is a read/write facade
  // over that graph.
  message Settings {
    string repository = 1;
    string mention = 2;
    bool ignore_bots = 3;
  }

  string id = 1;
  string factory_id = 2;
  string canvas_id = 3;
  string name = 4;
  string description = 5;
  Source source = 6;
  Settings settings = 7;
  // False when the canvas can no longer receive a mention and address it.
  // The handler stays listed so the user can repair it.
  bool healthy = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message FactoryPRFeedbackHandlerRun {
  enum Trigger {
    TRIGGER_UNSPECIFIED = 0;
    TRIGGER_PR_COMMENT = 1;
    TRIGGER_PR_REVIEW = 2;
    TRIGGER_PR_REVIEW_REPLY = 3;
  }

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_QUEUED = 1;
    STATUS_RUNNING = 2;
    STATUS_PASSED = 3;
    STATUS_FAILED = 4;
    STATUS_CANCELLED = 5;
  }

  string id = 1;
  string title = 2;
  string work_order_id = 3;
