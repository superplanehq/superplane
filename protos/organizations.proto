syntax = "proto3";

package Superplane.Organizations;

import "configuration.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/superplanehq/superplane/pkg/protos/organizations";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Superplane Organizations API";
    version: "1.0";
    description: "API for managing organizations in the Superplane service";
    contact: {
      name: "API Support";
      email: "support@superplane.com";
    };
  };
  schemes: HTTPS;
  schemes: HTTP;
  consumes: "application/json";
  produces: "application/json";
};

service Organizations {
  rpc AcceptInvitation(AcceptInvitationRequest) returns (google.protobuf.Struct) {
    option (google.api.http) = { post: "/api/v1/invitations/{token}/accept" };
  }

  rpc CreateInvitation(CreateInvitationRequest) returns (CreateInvitationResponse) {
    option (google.api.http) = { post: "/api/v1/organizations/{id}/invitations" body: "*" };
  }
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) {
    option (google.api.http) = { get: "/api/v1/organizations/{id}/invitations" };
  }
  rpc ResendInvitation(ResendInvitationRequest) returns (ResendInvitationResponse) {
    option (google.api.http) = { post: "/api/v1/organizations/{id}/invitations/{invitation_id}/resend" body: "*" };
  }
  rpc CancelInvitation(CancelInvitationRequest) returns (CancelInvitationResponse) {
    option (google.api.http) = { delete: "/api/v1/organizations/{id}/invitations/{invitation_id}" };
  }

  rpc DescribeOrganization(DescribeOrganizationRequest) returns (DescribeOrganizationResponse) {
    option (google.api.http) = {
      get: "/api/v1/organizations/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get organization details";
      description: "Returns the details of a specific organization (can be referenced by ID or slug)";
      tags: "Organization";
    };
  }

  rpc UpdateOrganization(UpdateOrganizationRequest) returns (UpdateOrganizationResponse) {
    option (google.api.http) = {
      patch: "/api/v1/organizations/{id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update an organization";
      description: "Updates the specified organization (can be referenced by ID or slug). Set metadata.slug to change the organization's URL slug.";
      tags: "Organization";
    };
  }

  rpc DeleteOrganization(DeleteOrganizationRequest) returns (DeleteOrganizationResponse) {
    option (google.api.http) = {
      delete: "/api/v1/organizations/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete an organization";
      description: "Deletes the specified organization (can be referenced by ID or name)";
      tags: "Organization";
    };
  }

  rpc RemoveUser(RemoveUserRequest) returns (RemoveUserResponse) {
    option (google.api.http) = {
      delete: "/api/v1/organizations/{id}/users/{user_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Remove a user from an organization";
      description: "Removes a user from an organization (can be referenced by ID or name)";
      tags: "Organization";
    };
  }

  rpc SetUserOwner(SetUserOwnerRequest) returns (SetUserOwnerResponse) {
    option (google.api.http) = {
      patch: "/api/v1/organizations/{id}/users/{user_id}/owner"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Set organization owner flag";
      description: "Sets or clears the owner flag for a member. The organization must keep at least one owner.";
      tags: "Organization";
    };
  }

  rpc DescribeOrganizationWorkspaceUsage(DescribeOrganizationWorkspaceUsageRequest) returns (DescribeOrganizationWorkspaceUsageResponse) {
    option (google.api.http) = {
      get: "/api/v1/organizations/{id}/workspace-usage"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Describe organization workspace usage";
      description: "Returns token, VM seconds, and estimated dollar spend for factory runs, grouped by model and machine type";
      tags: "Organization";
    };
  }

  rpc DescribeOrganizationSpendingReport(DescribeOrganizationSpendingReportRequest) returns (DescribeOrganizationSpendingReportResponse) {
    option (google.api.http) = {
      get: "/api/v1/organizations/{id}/spending-report"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Describe organization spending report";
      description: "Returns aggregated spending KPIs, chart series, and breakdown rows for the organization spending explorer";
      tags: "Organization";
    };
  }

  rpc ListOrganizationRunnerFleets(ListOrganizationRunnerFleetsRequest) returns (ListOrganizationRunnerFleetsResponse) {
    option (google.api.http) = {
      get: "/api/v1/organizations/{id}/fleets"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List organization runner fleets";
      description: "Returns the runner fleets that the organization can select";
      tags: "Organization";
    };
  }

  rpc ListHostedLLMModels(ListHostedLLMModelsRequest) returns (ListHostedLLMModelsResponse) {
    option (google.api.http) = {
      get: "/api/v1/organizations/{id}/hosted-llm-models"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List hosted LLM models";
      description: "Returns the SuperPlane-hosted model allowlist for one provider";
      tags: "Organization";
    };
  }

  rpc ListSelectableLLMModels(ListSelectableLLMModelsRequest) returns (ListSelectableLLMModelsResponse) {
    option (google.api.http) = {
      get: "/api/v1/organizations/{id}/selectable-llm-models"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List selectable LLM models";
      description: "Returns SuperPlane-hosted and selected BYOK models a picker may show";
      tags: "Organization";
    };
  }

  rpc ListBYOKLLMModels(ListBYOKLLMModelsRequest) returns (ListBYOKLLMModelsResponse) {
    option (google.api.http) = {
      get: "/api/v1/organizations/{id}/byok-models"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List BYOK LLM models";
      description: "Returns the organization selected-model list and candidate models from the connected provider key";
      tags: "Organization";
    };
  }

  rpc UpdateBYOKLLMModels(UpdateBYOKLLMModelsRequest) returns (UpdateBYOKLLMModelsResponse) {
    option (google.api.http) = {
      put: "/api/v1/organizations/{id}/byok-models"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update BYOK LLM models";
      description: "Replaces the organization selected-model list for one BYOK provider";
      tags: "Organization";
    };
  }

  rpc ListOrganizationHostedLLMModels(ListOrganizationHostedLLMModelsRequest) returns (ListOrganizationHostedLLMModelsResponse) {
    option (google.api.http) = {
      get: "/api/v1/organizations/{id}/hosted-models"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List organization hosted models";
      description: "Returns installation model candidates and the organization selection for every hosted provider";
      tags: "Organization";
    };
  }

  rpc UpdateOrganizationHostedLLMModels(UpdateOrganizationHostedLLMModelsRequest) returns (UpdateOrganizationHostedLLMModelsResponse) {
    option (google.api.http) = {
      put: "/api/v1/organizations/{id}/hosted-models"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update organization hosted models";
      description: "Replaces the organization selection for every hosted provider";
      tags: "Organization";
    };
  }

  rpc ListHostedCreditProducts(ListHostedCreditProductsRequest) returns (ListHostedCreditProductsResponse) {
    option (google.api.http) = {
      get: "/api/v1/organizations/{id}/hosted-credit-products"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List hosted credit products";
      description: "Returns prepaid hosted-credit packs when billing is configured";
      tags: "Organization";
    };
  }

  rpc QuoteHostedCreditCheckout(QuoteHostedCreditCheckoutRequest) returns (QuoteHostedCreditCheckoutResponse) {
    option (google.api.http) = {
      get: "/api/v1/organizations/{id}/hosted-credit-checkout-quote"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Quote hosted credit checkout";
      description: "Returns hosted credit, processing fee, and subtotal before tax";
      tags: "Organization";
    };
  }

  rpc CreateHostedCreditCheckout(CreateHostedCreditCheckoutRequest) returns (CreateHostedCreditCheckoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/organizations/{id}/hosted-credit-checkout"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create hosted credit checkout";
      description: "Creates a checkout session for a prepaid hosted-credit pack";
      tags: "Organization";
    };
  }

  rpc CreateBillingPortalSession(CreateBillingPortalSessionRequest) returns (CreateBillingPortalSessionResponse) {
    option (google.api.http) = {
      post: "/api/v1/organizations/{id}/billing-portal-session"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create billing portal session";
      description: "Creates a customer portal session for invoices and receipts";
      tags: "Organization";
    };
  }

  rpc ListOrganizationCreditGrants(ListOrganizationCreditGrantsRequest) returns (ListOrganizationCreditGrantsResponse) {
    option (google.api.http) = {
      get: "/api/v1/organizations/{id}/credit-grants"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List organization credit grants";
      description: "Returns hosted-credit grants for an organization, newest first";
      tags: "Organization";
    };
  }

  rpc DescribeOrganizationBilling(DescribeOrganizationBillingRequest) returns (DescribeOrganizationBillingResponse) {
    option (google.api.http) = {
      get: "/api/v1/organizations/{id}/billing"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Describe organization billing";
      description: "Returns the organization plan, trial window, and hosted-credit remaining amounts";
      tags: "Organization";
    };
  }

  rpc CreateBusinessCheckout(CreateBusinessCheckoutRequest) returns (CreateBusinessCheckoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/organizations/{id}/business-checkout"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create Business checkout";
      description: "Creates a Polar checkout session for the Business subscription";
      tags: "Organization";
    };
  }

  rpc SelectBillingPlan(SelectBillingPlanRequest) returns (CreateBusinessCheckoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/organizations/{id}/billing/select-plan"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Select billing plan";
      description: "Activates a plan without a base fee or starts checkout for a paid subscription";
      tags: "Organization";
    };
  }

  rpc CreatePaymentMethodSession(CreatePaymentMethodSessionRequest) returns (CreateBillingPortalSessionResponse) {
    option (google.api.http) = {
      post: "/api/v1/organizations/{id}/billing/payment-method-session"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Set up payment method";
      description: "Opens Polar payment settings without creating a charge or subscription";
      tags: "Organization";
    };
  }

  rpc PreviewSeatPurchase(PreviewSeatPurchaseRequest) returns (PreviewSeatPurchaseResponse) {
    option (google.api.http) = {
      post: "/api/v1/organizations/{id}/billing/seats/preview"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Preview seat purchase";
      description: "Estimates the prorated charge for additional seats without charging or changing the subscription";
      tags: "Organization";
    };
  }

  rpc PurchaseSeats(PurchaseSeatsRequest) returns (PurchaseSeatsResponse) {
    option (google.api.http) = {
      post: "/api/v1/organizations/{id}/billing/seats/purchase"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Purchase seats";
      description: "Charges the prorated amount for additional seats at once. Seats are added only after the payment succeeds";
      tags: "Organization";
    };
  }

  rpc SyncOrganizationBilling(SyncOrganizationBillingRequest) returns (DescribeOrganizationBillingResponse) {
    option (google.api.http) = {
      post: "/api/v1/organizations/{id}/billing/sync"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Sync organization billing";
      description: "Reads the Polar Business subscription for the organization and updates the local plan";
      tags: "Organization";
    };
  }

  rpc CancelOrganizationSubscription(CancelOrganizationSubscriptionRequest) returns (DescribeOrganizationBillingResponse) {
    option (google.api.http) = {
      post: "/api/v1/organizations/{id}/billing/cancel"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Cancel organization subscription";
      description: "Cancels the Polar Business subscription at the end of the current period";
      tags: "Organization";
    };
  }

  rpc ResumeOrganizationSubscription(ResumeOrganizationSubscriptionRequest) returns (DescribeOrganizationBillingResponse) {
    option (google.api.http) = {
      post: "/api/v1/organizations/{id}/billing/resume"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Resume organization subscription";
      description: "Clears a scheduled Polar Business cancellation so the subscription renews";
      tags: "Organization";
    };
  }

  rpc AcceptInviteLink(InviteLink) returns (google.protobuf.Struct) {
    option (google.api.http) = {
      post: "/api/v1/invite-links/{token}/accept"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Accept an invite link";
      description: "Accepts an organization invite link for the authenticated account";
      tags: "Organization";
    };
  }

  rpc ListIntegrations(ListIntegrationsRequest) returns (ListIntegrationsResponse) {
    option (google.api.http) = {
      get: "/api/v1/organizations/{id}/integrations"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List integrations in an organization";
      description: "Returns a list of integrations in an organization";
      tags: "Organization";
    };
  }

  rpc DescribeIntegration(DescribeIntegrationRequest) returns (DescribeIntegrationResponse) {
    option (google.api.http) = {
      get: "/api/v1/organizations/{id}/integrations/{integration_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Describe an integration in an organization";
      description: "Returns details of a specific integration in an organization";
      tags: "Organization";
    };
  }

  rpc ListIntegrationResources(ListIntegrationResourcesRequest) returns (ListIntegrationResourcesResponse) {
    option (google.api.http) = {
      get: "/api/v1/organizations/{id}/integrations/{integration_id}/resources"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List integration resources";
      description: "Lists resources for an integration";
      tags: "Organization";
    };
  }

  rpc CreateIntegration(CreateIntegrationRequest) returns (CreateIntegrationResponse) {
    option (google.api.http) = {
      post: "/api/v1/organizations/{id}/integrations"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create organization integration";
      description: "Create an organization integration";
      tags: "Organization";
    };
  }

  rpc UpdateIntegration(UpdateIntegrationRequest) returns (UpdateIntegrationResponse) {
    option (google.api.http) = {
      patch: "/api/v1/organizations/{id}/integrations/{integration_id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update integration";
      description: "Updates the configuration for an organization integration";
      tags: "Organization";
    };
  }

  rpc NextIntegrationSetupStep(NextIntegrationSetupStepRequest) returns (NextIntegrationSetupStepResponse) {
    option (google.api.http) = {
      patch: "/api/v1/organizations/{id}/integrations/{integration_id}/next"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Submit an integration setup step and go to the next";
      description: "Submit an integration setup step and go to the next";
      tags: "Organization";
    };
  }

  rpc PreviousIntegrationSetupStep(PreviousIntegrationSetupStepRequest) returns (PreviousIntegrationSetupStepResponse) {
    option (google.api.http) = {
      patch: "/api/v1/organizations/{id}/integrations/{integration_id}/previous"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Revert the current integration setup step and go to the previous";
      description: "Revert the current integration setup step and go to the previous";
      tags: "Organization";
    };
  }

  rpc UpdateIntegrationCapabilities(UpdateIntegrationCapabilitiesRequest) returns (UpdateIntegrationCapabilitiesResponse) {
    option (google.api.http) = {
      put: "/api/v1/organizations/{id}/integrations/{integration_id}/capabilities"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update integration capabilities";
      description: "Update integration capabilities";
      tags: "Organization";
    };
  }

  rpc UpdateIntegrationProperty(UpdateIntegrationPropertyRequest) returns (UpdateIntegrationPropertyResponse) {
    option (google.api.http) = {
      put: "/api/v1/organizations/{id}/integrations/{integration_id}/properties"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update integration property";
      description: "Update integration property";
      tags: "Organization";
    };
  }

  rpc UpdateIntegrationSecret(UpdateIntegrationSecretRequest) returns (UpdateIntegrationSecretResponse) {
    option (google.api.http) = {
      put: "/api/v1/organizations/{id}/integrations/{integration_id}/secrets"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update integration secret";
      description: "Update integration secret";
      tags: "Organization";
    };
  }

  rpc DeleteIntegration(DeleteIntegrationRequest) returns (DeleteIntegrationResponse) {
    option (google.api.http) = {
      delete: "/api/v1/organizations/{id}/integrations/{integration_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete organization integration";
      description: "Deletes an integration from an organization";
      tags: "Organization";
    };
  }

}

message Organization {
  message Metadata {
    string id = 1;
    string name = 2;
    string description = 3;
    google.protobuf.Timestamp created_at = 4;
    google.protobuf.Timestamp updated_at = 5;
    // URL-friendly, unique identifier used to route to this organization in
    // the frontend. Editable in organization settings.
    string slug = 6;
  }

  message Spec {
    repeated string enabled_experimental_features = 2;
  }

  Metadata metadata = 1;
  Spec spec = 2;
}

message DescribeOrganizationRequest {
  string id = 1;
}

message DescribeOrganizationResponse {
  Organization organization = 1;
}

message UpdateOrganizationRequest {
  string id = 1;
  Organization organization = 2;
}

message UpdateOrganizationResponse {
  Organization organization = 1;
}

message DeleteOrganizationRequest {
  string id = 1;
}

message DeleteOrganizationResponse {}

message InviteLink {
  string id = 1;
  string organization_id = 2;
  string token = 3;
  bool enabled = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message DescribeOrganizationWorkspaceUsageRequest {
  string id = 1;
  // Period window in days. Defaults to 30. Maximum is 90.
  int32 period_days = 2;
}

message DescribeOrganizationWorkspaceUsageResponse {
  int64 total_tokens = 1;
  int64 total_cost_cents = 2;
  int32 period_days = 3;
  repeated UsageByModel by_model = 4;
  int64 remaining_credit_cents = 5;
  int64 grant_total_cents = 6;
  int64 hosted_billed_cents = 7;
  bool remaining_credit_warning = 8;
  bool billing_enabled = 9;
  bool has_billing_customer = 10;
  int64 superplane_grant_cents = 11;
  int64 purchased_credit_cents = 12;
  repeated HostedCreditInvoice invoices = 13;
  int64 total_duration_seconds = 14;
  repeated UsageByMachineType by_machine_type = 15;
  string default_hosted_provider = 16;
  string default_hosted_model = 17;
  google.protobuf.Timestamp welcome_credit_expires_at = 18;
}

message DescribeOrganizationSpendingReportRequest {
  string id = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  string factory_id = 4;
  string model = 5;
  string machine_type = 6;
  string task_owner_id = 7;
  string group_by = 8;
  string time_grain = 9;
  string usage_kind = 10;
  string funding_source = 11;
}

message SpendingReportTotals {
  int64 cost_cents = 1;
  int64 total_tokens = 2;
  int64 duration_seconds = 3;
  int64 hosted_cost_cents = 4;
  int64 byok_cost_cents = 5;
}

message SpendingReportSeriesValue {
  string series_id = 1;
  int64 cost_cents = 2;
}

message SpendingReportSeriesPoint {
  string key = 1;
  string label = 2;
  int64 total_cents = 3;
  repeated SpendingReportSeriesValue values = 4;
}

message SpendingReportBreakdownRow {
  string id = 1;
  string label = 2;
  int64 total_tokens = 3;
  int64 duration_seconds = 4;
  int64 cost_cents = 5;
  double share = 6;
}

message SpendingReportCatalogItem {
  string id = 1;
  string label = 2;
}

message SpendingReportCatalogs {
  repeated SpendingReportCatalogItem workspaces = 1;
  repeated SpendingReportCatalogItem users = 2;
  repeated SpendingReportCatalogItem models = 3;
  repeated SpendingReportCatalogItem machines = 4;
}

message SpendingReportCreditSnapshot {
  int64 remaining_credit_cents = 1;
  int64 grant_total_cents = 2;
  int64 superplane_grant_cents = 3;
  int64 purchased_credit_cents = 4;
  int64 hosted_billed_cents = 5;
  bool remaining_credit_warning = 6;
  bool billing_enabled = 7;
  bool has_billing_customer = 8;
  google.protobuf.Timestamp welcome_credit_expires_at = 9;
}

message DescribeOrganizationSpendingReportResponse {
  SpendingReportTotals kpi_totals = 1;
  SpendingReportTotals explorer_totals = 2;
  repeated SpendingReportSeriesPoint series = 3;
  repeated SpendingReportCatalogItem series_keys = 4;
  repeated SpendingReportBreakdownRow breakdown = 5;
  SpendingReportCreditSnapshot credit = 6;
  SpendingReportCatalogs catalogs = 7;
}

message HostedCreditInvoice {
  string id = 1;
  string created_at = 2;
  int64 amount_cents = 3;
  string status = 4;
  string product_name = 5;
  string checkout_id = 6;
  string currency = 7;
  int64 net_amount_cents = 8;
  int64 tax_amount_cents = 9;
}

message ListHostedLLMModelsRequest {
  string id = 1;
  string provider = 2;
  string factory_id = 3;
}

message ListHostedLLMModelsResponse {
  bool enabled = 1;
  repeated HostedLLMModel models = 2;
}

message HostedLLMModel {
  string id = 1;
  string name = 2;
}

message ListSelectableLLMModelsRequest {
  string id = 1;
  string factory_id = 2;
  string order_id = 3;
}

message SelectableLLMNamedID {
  string id = 1;
  string name = 2;
}

