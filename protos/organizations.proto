  int64 seat_price_cents = 3;
  int64 prorated_charge_cents = 4;
  // period_start is the start of the prorated coverage: the preview time.
  // It is not the billing-period start. See billing_period_start.
  google.protobuf.Timestamp period_start = 5;
  // period_end is the end of the billing period.
  google.protobuf.Timestamp period_end = 6;
  int64 new_monthly_total_cents = 7;
  optional int32 purchasable_seats = 8;
  bool estimate = 9;
  bool excludes_tax = 10;
  // subscription_id is the Polar subscription that the preview priced.
  string subscription_id = 11;
  // billing_period_start is the start of the billing period that the
  // preview priced. A purchase sends it back as confirmed_period_start.
  google.protobuf.Timestamp billing_period_start = 12;
}

message PurchaseSeatsRequest {
  string id = 1;
  int32 additional_seats = 2;
  int32 expected_purchased_seats = 3;
  // operation_key identifies one purchase within the organization. A repeat
  // with the same key and request returns the stored purchase and does not
  // charge again. A repeat with the same key and another request is rejected.
  string operation_key = 4;
  // The confirmed fields bind a new purchase to the subscription and the
  // billing period of the preview that the user confirmed:
  // subscription_id, billing_period_start, and period_end. A new operation
  // needs all three. When they do not match the current subscription, the
  // purchase is rejected before any charge. A recorded operation key replays
  // without them.
  string confirmed_subscription_id = 5;
  google.protobuf.Timestamp confirmed_period_start = 6;
  google.protobuf.Timestamp confirmed_period_end = 7;
}

