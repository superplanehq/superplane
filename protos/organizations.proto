message Integration {

  message Property {
    string name = 1;
    string label = 2;
    string description = 3;
    string type = 4;
    string value = 5;
    bool editable = 6;
  }

  message Secret {
    string name = 1;
    string label = 2;
    string description = 3;
    bool editable = 4;
  }

  message Metadata {
    string id = 1;
    string name = 2;
    string integration_name = 3;
    google.protobuf.Timestamp created_at = 4;
    google.protobuf.Timestamp updated_at = 5;
  }

  message Spec {
    google.protobuf.Struct configuration = 1;
  }

  message Status {
    string state = 1;
    string state_description = 2;
    google.protobuf.Struct metadata = 3;
    BrowserAction browser_action = 4;
    repeated NodeRef used_in = 5;
    repeated CapabilityState capabilities = 6;
    SetupState setup_state = 7;
    repeated Property properties = 8;
    repeated Secret secrets = 9;
    bool legacy_setup = 10;
  }

  message SetupState {
    SetupStepDefinition current_step = 1;
    repeated SetupStepDefinition previous_steps = 2;
  }

  message SetupStepDefinition {
    enum Type {
      UNKNOWN = 0;
      INPUTS = 1;
      REDIRECT_PROMPT = 2;
      CAPABILITY_SELECTION = 3;
      DONE = 4;
    }

    message RedirectPrompt {
      string url = 1;
      string method = 2;
      map<string, string> form_fields = 3;
    }

    Type type = 1;
    string name = 2;
    string label = 3;
    string instructions = 4;
    repeated Configuration.Field inputs = 5;
    RedirectPrompt redirect_prompt = 6;
    repeated string capabilities = 7;
  }

  message CapabilityState {
    enum State {

      //
      // The integration has the capability available,
      // but the integration setup did not expose it,
      // and the user cannot request it anymore.
      //
      STATE_UNAVAILABLE = 0;

      //
      // THe integration has the capability available,
      // but the integration setup did not expose it yet.
      // The user can still request it, though.
      //
      STATE_AVAILABLE = 1;

      //
      // The capability was requested,
      // but the setup flow did not yet exposed the capability requested.
      //
      STATE_REQUESTED = 2;

      //
      // The capability is fully available for use.
      //
      STATE_ENABLED = 3;

      //
      // The capability was made available during the setup flow,
      // but has been manually disabled by the user.
      //
      STATE_DISABLED = 4;
    }

    string name = 1;
    State state = 2;
    optional string reason = 3;
  }

  message NodeRef {
    string canvas_id = 1;
    string canvas_name = 2;
    string node_id = 3;
    string node_name = 4;
    string component = 5;
  }

  Metadata metadata = 1;
  Spec spec = 2;
  Status status = 3;
}

message BrowserAction {
  string url = 1;
  string method = 2;
  map<string, string> form_fields = 3;
  string description = 4;
}

// Event messages for organization lifecycle events
message OrganizationUpdated {
  string organization_id = 1;
