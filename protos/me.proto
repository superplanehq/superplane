syntax = "proto3";

package Superplane.Me;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "authorization.proto";

option go_package = "github.com/superplanehq/superplane/pkg/protos/me";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Superplane Me API";
    version: "1.0";
    contact: {
      name: "API Support";
      email: "support@superplane.com";
    };
  };
  schemes: HTTPS;
  schemes: HTTP;
  consumes: "application/json";
  produces: "application/json";
};

service Me {

  //
  // Endpoint for getting the currently authenticated user.
  //
  rpc Me(MeRequest) returns (MeResponse) {
    option (google.api.http) = {
      get: "/api/v1/me"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get current user";
      description: "Returns the currently authenticated user";
      tags: "Me";
    };
  }

  //
  // Endpoint for regenerating the currently authenticated user's API token.
  //
  rpc RegenerateToken(google.protobuf.Empty) returns (RegenerateTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/me/token"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Regenerate API token";
      description: "Regenerates the currently authencated user's API token";
      tags: "Me";
    };
  }

  // Self-scoped work order notification settings for the calling user.
  rpc DescribeNotificationSettings(DescribeNotificationSettingsRequest) returns (DescribeNotificationSettingsResponse) {
    option (google.api.http) = {
      get: "/api/v1/me/notification-settings"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Describe notification settings";
      description: "Returns the calling user's work order notification settings";
      tags: "Me";
    };
  }

  rpc UpdateNotificationSettings(UpdateNotificationSettingsRequest) returns (UpdateNotificationSettingsResponse) {
    option (google.api.http) = {
      put: "/api/v1/me/notification-settings"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update notification settings";
      description: "Updates the calling user's work order notification settings";
      tags: "Me";
    };
  }
}

message MeRequest {
  bool include_permissions = 1;
}

message MeResponse {
  User user = 1;
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
  string organization_id = 4;
  google.protobuf.Timestamp created_at = 5;
  bool has_token = 6;
  repeated Authorization.Permission permissions = 7;
  repeated string roles = 8;
  repeated string groups = 9;
}

message RegenerateTokenResponse {
  string token = 1;
}

// NotificationSettings is a user's organization-wide configuration for
// work order notification emails. A missing row defaults to all
// workspace events. Nested `workspaces` leaves room for other levels later.
message NotificationSettings {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_WORK_ORDER_ASSIGNED = 1;
    TYPE_WORK_ORDER_COMMENT_OWNED = 2;
    TYPE_WORK_ORDER_COMMENT_CREATED = 3;
    TYPE_WORK_ORDER_STATUS_OWNED = 4;
    TYPE_WORK_ORDER_ARTIFACT_OWNED = 5;
    TYPE_WORK_ORDER_MENTIONED = 6;
  }

  enum WorkspaceScope {
    WORKSPACE_SCOPE_UNSPECIFIED = 0;
    WORKSPACE_SCOPE_ALL = 1;
    WORKSPACE_SCOPE_FILTERED = 2;
    WORKSPACE_SCOPE_NONE = 3;
  }

  message WorkspaceFilter {
    string workspace_id = 1;
    string workspace_key = 2;
    repeated Type event_types = 3;
  }

  message Workspaces {
    WorkspaceScope scope = 1;
    repeated WorkspaceFilter filters = 2;
  }

  Workspaces workspaces = 1;
}

message DescribeNotificationSettingsRequest {}

message DescribeNotificationSettingsResponse {
  NotificationSettings settings = 1;
}

message UpdateNotificationSettingsRequest {
  NotificationSettings settings = 1;
}

message UpdateNotificationSettingsResponse {
  NotificationSettings settings = 1;
}
