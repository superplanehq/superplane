# documentation: https://docs.superplane.com/
# slogan: Open-source automation engine for AI-driven engineering
# category: automation
# tags: automation,ai,ci,workflows
# logo: svgs/superplane.svg
# port: 8000
#
# Coolify: paste this file as Docker Compose Empty, or use it as a one-click
# template later. Pulls published GHCR images. Does not need this repository.
# Set SUPERPLANE_VERSION and ENCRYPTION_MASTER_KEYS before the first deploy:
#   echo "env://coolify-v1:$(openssl rand -base64 32)"
# After owner setup, create an installation-admin personal token, set
# INSTALLATION_ADMIN_TOKEN, and restart Fleet Manager.
# On ARM, set RUNNER_FLEET_ID=e1-large-arm64 and RUNNER_ARCH=arm64.
# Runner and Fleet Manager tags default to the Helm componentReleases pins.

services:
  init:
    image: alpine:3.22
    user: "0:0"
    restart: "no"
    exclude_from_hc: true
    volumes:
      - oidc-keys:/oidc-keys
      - blobs:/blobs
      - runner-logs:/runner-logs
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -f /oidc-keys/oidc.pem ]; then
          apk add --no-cache openssl
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 \
            -out /oidc-keys/oidc.pem
        fi
        chown -R 65534:65534 /oidc-keys /blobs /runner-logs
        chmod 700 /oidc-keys /blobs /runner-logs
        chmod 400 /oidc-keys/oidc.pem

  db:
    image: postgres:17.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: superplane
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.8.17-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${SERVICE_USER_RABBITMQ}
      RABBITMQ_DEFAULT_PASS: ${SERVICE_PASSWORD_RABBITMQ}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/superplanehq/superplane:${SUPERPLANE_VERSION:?}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - oidc-keys:/app/oidc-keys:ro
      - blobs:/var/lib/superplane/blobs
      - runner-logs:/var/lib/superplane/runner-logs
    networks:
      - default
      - runners
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    environment:
      SERVICE_URL_APP_8000:
      BASE_URL: ${SERVICE_URL_APP_8000:-http://localhost:8000}
      WEBHOOKS_BASE_URL: ${SERVICE_URL_APP_8000:-http://localhost:8000}
      PUBLIC_API_BASE_PATH: /api/v1
      WEB_BASE_PATH: ""
      RUNNER_API_BASE_URL: http://app:8000
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: superplane
      DB_USERNAME: postgres
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      APPLICATION_NAME: superplane
      POSTGRES_DB_SSL: "false"
      DB_POOL_SIZE: "20"
      DB_STATEMENT_TIMEOUT: 60s
      DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT: 30s
      RABBITMQ_URL: amqp://${SERVICE_USER_RABBITMQ}:${SERVICE_PASSWORD_RABBITMQ}@rabbitmq:5672
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      SESSION_SECRET: ${SERVICE_PASSWORD_64_SESSION}
      BLOB_STORAGE_SIGNING_KEY: ${SERVICE_PASSWORD_64_BLOBSIGNING}
      ENCRYPTION_MASTER_KEYS: ${ENCRYPTION_MASTER_KEYS:?}
      ENCRYPTION_WRITE_FORMAT: versioned
      SWAGGER_BASE_PATH: /app/api/swagger
      RBAC_MODEL_PATH: /app/rbac/rbac_model.conf
      RBAC_ORG_POLICY_PATH: /app/rbac/rbac_org_policy.csv
      RBAC_CANVAS_POLICY_PATH: /app/rbac/rbac_canvas_policy.csv
      TEMPLATE_DIR: /app/templates
      OIDC_KEYS_PATH: /app/oidc-keys
      BLOB_STORAGE_PROVIDER: filesystem
      BLOB_STORAGE_LOCAL_PATH: /var/lib/superplane/blobs
      RUNNER_ACTIVE_LOG_FS_PATH: /var/lib/superplane/runner-logs
      START_PUBLIC_API: "yes"
      START_WEB_SERVER: "yes"
      START_WEBSOCKET_SERVER: "yes"
      START_GRPC_GATEWAY: "yes"
      START_EVENT_DISTRIBUTER: "yes"
      START_RBAC_POLICY_RELOAD_CONSUMER: "yes"
      START_CONSUMERS: "yes"
      START_EVENT_ROUTER: "yes"
      START_RUN_FINALIZER: "yes"
      START_RUN_INITIALIZER: "yes"
      START_NODE_EXECUTOR: "yes"
      START_EXECUTION_TERMINATOR: "yes"
      START_NODE_QUEUE_WORKER: "yes"
      START_NODE_REQUEST_WORKER: "yes"
      START_APP_MESSAGE_WORKER: "yes"
      START_INTEGRATION_REQUEST_WORKER: "yes"
      START_WEBHOOK_PROVISIONER: "yes"
      START_WEBHOOK_CLEANUP_WORKER: "yes"
      START_INTEGRATION_CLEANUP_WORKER: "yes"
      START_CANVAS_CLEANUP_WORKER: "yes"
      START_NODE_REQUEST_CLEANUP_WORKER: "yes"
      START_ORGANIZATION_CLEANUP_WORKER: "yes"
      START_FACTORY_CLEANUP_WORKER: "yes"
      START_FACTORY_VELOCITY_SYNC_WORKER: "yes"
      START_PRICE_BOOK_SYNC_WORKER: "yes"
      START_PLANNING_SESSION_CLEANUP_WORKER: "yes"
      START_EVENT_RETENTION_WORKER: "yes"
      START_FILE_CLEANUP_WORKER: "yes"
      START_RUNNER_API: "yes"
      START_RUNNER_LOG_COMPACTOR: "yes"
      START_RUNNER_CLEANUP_WORKER: "yes"
      APP_ENV: production
      OWNER_SETUP_ENABLED: "yes"
      ENABLE_PASSWORD_LOGIN: "yes"
      BLOCK_SIGNUP: "yes"
      REDIRECT_HTTP_REQUESTS: "yes"
      SUPERPLANE_INSTALLATION_TYPE: single-host
      OTEL_ENABLED: "no"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}

  fleet-manager:
    image: ghcr.io/superplanehq/fleet-manager:${FLEET_MANAGER_VERSION:-v0.1.4}-docker
    pull_policy: always
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      INSTALLATION_ADMIN_TOKEN: ${INSTALLATION_ADMIN_TOKEN:-}
      FLEET_MANAGER_CONFIG: |
        id: coolify
        superplaneUrl: http://app:8000
        reconciliation:
          pollTimeout: 30s
          errorRetryInterval: 2s
        http:
          requestTimeout: 60s
        fleets:
          - id: ${RUNNER_FLEET_ID:-e1-large-amd64}
            runnerVersion: ${RUNNER_VERSION:-v0.2.0}
            provider: docker
            maxCapacity: 1
            warmCapacity: 1
            spec:
              operatingSystem: linux
              architecture: ${RUNNER_ARCH:-amd64}
              cpuMillicores: 2000
              memoryMb: 8192
              diskGb: 30
              # Omit capabilities docker: the runner image has no Docker client.
            docker:
              image: ghcr.io/superplanehq/runner:${RUNNER_VERSION:-v0.2.0}
              architecture: ${RUNNER_ARCH:-amd64}
              runnerApiUrl: http://app:8000
              network: superplane-runners
              extraHosts:
                - host.docker.internal:host-gateway

networks:
  default:
  runners:
    name: superplane-runners

volumes:
  pgdata:
  rabbitmq:
  oidc-keys:
  blobs:
  runner-logs:
