version: v1.0
name: "Prepare SuperPlane Release"

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204

global_job_config:
  env_vars:
    - name: DOCKER_BUILDKIT
      value: "1"
  prologue:
    commands:
      - checkout
      - test -n "$RELEASE_VERSION"
      - test -n "$SEMAPHORE_GIT_SHA"
      - test "$(git rev-parse HEAD)" = "$SEMAPHORE_GIT_SHA"

blocks:
  - name: "Validate Release"
    dependencies: []
    task:
      jobs:
        - name: "Validate source and release tooling"
          commands:
            - bash release/verify-component-release-source.sh superplane "$RELEASE_VERSION"
            - make test.release

  - name: "Build amd64 Image"
    dependencies: ["Validate Release"]
    task:
      agent:
        machine:
          type: f1-standard-2
          os_image: ubuntu2204
      jobs:
        - name: "Prepare linux/amd64 image"
          commands:
            - make dev.up
            - make dev.setup
            - docker buildx create --driver docker-container --use --name "superplane-release-$SEMAPHORE_JOB_ID"
            - docker buildx inspect --bootstrap
            - bash release/superplane/build-image.sh "$RELEASE_VERSION" "$SEMAPHORE_GIT_SHA" amd64 "superplane-amd64.oci.tar"
            - artifact push workflow "superplane-amd64.oci.tar"
            - artifact push workflow "superplane-amd64.oci.tar.sha256"
            - artifact push workflow "superplane-amd64.oci.tar.descriptor.json"

  - name: "Build arm64 Image"
    dependencies: ["Validate Release"]
    task:
      agent:
        machine:
          type: r1-standard-4
          os_image: ubuntu2404
      jobs:
        - name: "Prepare linux/arm64 image"
          commands:
            - make dev.up
            - make dev.setup
            - docker buildx create --driver docker-container --use --name "superplane-release-$SEMAPHORE_JOB_ID"
            - docker buildx inspect --bootstrap
            - bash release/superplane/build-image.sh "$RELEASE_VERSION" "$SEMAPHORE_GIT_SHA" arm64 "superplane-arm64.oci.tar"
            - artifact push workflow "superplane-arm64.oci.tar"
            - artifact push workflow "superplane-arm64.oci.tar.sha256"
            - artifact push workflow "superplane-arm64.oci.tar.descriptor.json"

  - name: "Build Release Assets"
    dependencies: ["Validate Release"]
    task:
      jobs:
        - name: "Prepare chart and bundle assets"
          commands:
            - make dev.up
            - make dev.setup
            - bash release/superplane/build-assets.sh "$RELEASE_VERSION" "$SEMAPHORE_GIT_SHA" "build/superplane-assets/$RELEASE_VERSION"
            - tar -C build/superplane-assets -czf "superplane-assets-$RELEASE_VERSION.tar.gz" "$RELEASE_VERSION"
            - artifact push workflow "superplane-assets-$RELEASE_VERSION.tar.gz"

  - name: "Assemble Release"
    dependencies:
      - "Build amd64 Image"
      - "Build arm64 Image"
      - "Build Release Assets"
    task:
      jobs:
        - name: "Bind prepared artifacts"
          commands:
            - artifact pull workflow "superplane-amd64.oci.tar"
            - artifact pull workflow "superplane-amd64.oci.tar.sha256"
            - artifact pull workflow "superplane-amd64.oci.tar.descriptor.json"
            - artifact pull workflow "superplane-arm64.oci.tar"
            - artifact pull workflow "superplane-arm64.oci.tar.sha256"
            - artifact pull workflow "superplane-arm64.oci.tar.descriptor.json"
            - bash release/superplane/verify-prepared-archive.sh superplane-amd64.oci.tar
            - bash release/superplane/verify-prepared-archive.sh superplane-arm64.oci.tar
            - artifact pull workflow "superplane-assets-$RELEASE_VERSION.tar.gz"
            - mkdir -p build/superplane
            - tar -C build/superplane -xzf "superplane-assets-$RELEASE_VERSION.tar.gz"
            - mv superplane-amd64.oci.tar superplane-arm64.oci.tar "build/superplane/$RELEASE_VERSION/"
            - |
              set -euo pipefail
              release_dir="build/superplane/$RELEASE_VERSION"
              (cd "$release_dir" && sha256sum \
                superplane-sbom.json \
                superplane-single-host.tar.gz \
                "superplane-${RELEASE_VERSION#v}.tgz" \
                >checksums.txt)
            - bash release/fetch-component-release-history.sh
            - |
              set -euo pipefail
              release_dir="build/superplane/$RELEASE_VERSION"
              node release/component-release.js generate-release-notes \
                --component superplane \
                --version "$RELEASE_VERSION" \
                --sha "$SEMAPHORE_GIT_SHA" \
                --output "$release_dir/release-notes.md"
              node release/component-release.js create-manifest \
                --component superplane \
                --version "$RELEASE_VERSION" \
                --sha "$SEMAPHORE_GIT_SHA" \
                --workflow-id "$SEMAPHORE_WORKFLOW_ID" \
                --pipeline-id "$SEMAPHORE_PIPELINE_ID" \
                --directory "$release_dir" \
                --assets "superplane-sbom.json,superplane-single-host.tar.gz,superplane-${RELEASE_VERSION#v}.tgz,checksums.txt,superplane-amd64.oci.tar,superplane-arm64.oci.tar" \
                --output "$release_dir/release-manifest.json"
              (cd "$release_dir" && sha256sum release-manifest.json >release-manifest.sha256)
              bash release/component-release-artifact.sh \
                push superplane "$RELEASE_VERSION" "$release_dir"

  - name: "Smoke Test Single Host"
    dependencies: ["Assemble Release"]
    task:
      jobs:
        - name: "Install the release tarball"
          commands:
            - bash release/component-release-artifact.sh pull superplane "$RELEASE_VERSION" "build/superplane/$RELEASE_VERSION"
            - |
              set -euo pipefail
              release_dir="build/superplane/$RELEASE_VERSION"
              image="ghcr.io/superplanehq/superplane:${RELEASE_VERSION}"
              docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                -v "${PWD}:${PWD}" \
                -w "${PWD}" \
                quay.io/skopeo/stable:v1.22.3-immutable@sha256:c0ee1f4edca5c01cb8d5611124f92f3cc47196ecab68aee5d0f90834e00574d5 \
                copy \
                "oci-archive:${release_dir}/superplane-amd64.oci.tar" \
                "docker-daemon:${image}"
              bash release/superplane-single-host-tarball/smoke-test.sh \
                "${release_dir}/superplane-single-host.tar.gz" \
                "${image}"

promotions:
  - name: Publish SuperPlane Release
    pipeline_file: publish-superplane-release.yml
    deployment_target: release
    auto_promote:
      when: "branch = 'main' AND result = 'passed'"
    parameters:
      env_vars:
        - name: RELEASE_VERSION
          required: true
          default_value: "${{parameters.RELEASE_VERSION}}"
          description: Prepared SuperPlane version
