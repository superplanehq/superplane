version: v1.0
name: Publish runner binary to S3

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

global_job_config:
  secrets:
    - name: runner-s3

  prologue:
    commands:
      - checkout
      - sem-version go 1.22
      - cache restore
      - go mod download
      - cache store
      - aws sts get-caller-identity

blocks:
  - name: linux/amd64 runner
    dependencies: []
    task:
      agent:
        machine:
          type: f1-standard-2
          os_image: ubuntu2404

      jobs:
        - name: Build amd64 runner
          commands:
            - export CGO_ENABLED=0
            - export GOOS=linux
            - export GOARCH=amd64
            - mkdir -p bin
            - go build -trimpath -ldflags="-s -w" -o bin/runner-linux-amd64 ./runner/cmd/runner
            - aws s3 cp bin/runner-linux-amd64 s3://superplane-runner/latest/runner-linux-amd64 --sse AES256

  - name: linux/arm64 runner
    dependencies: []
    task:
      agent:
        machine:
          type: r1-standard-2
          os_image: ubuntu2404

      jobs:
        - name: Build arm64 runner
          commands:
            - export CGO_ENABLED=0
            - export GOOS=linux
            - export GOARCH=arm64
            - mkdir -p bin
            - go build -trimpath -ldflags="-s -w" -o bin/runner-linux-arm64 ./runner/cmd/runner
            - aws s3 cp bin/runner-linux-arm64 s3://superplane-runner/latest/runner-linux-arm64 --sse AES256

  - name: Recycle runners
    dependencies:
      - linux/amd64 runner
      - linux/arm64 runner
    task:
      secrets:
        - name: aws-prod
      env_vars:
        - name: AWS_DEFAULT_REGION
          value: us-east-1
      jobs:
        - name: Terminate stale EC2 runners
          commands:
            - |
              RUNNER_IDS=$(aws ec2 describe-instances \
                --filters "Name=tag:superplane_managed_runner,Values=true" \
                          "Name=instance-state-name,Values=running,pending" \
                --query 'Reservations[*].Instances[*].InstanceId' \
                --output text)
              if [ -n "$RUNNER_IDS" ]; then
                echo "Recycling runners: $RUNNER_IDS"
                aws ec2 terminate-instances --instance-ids $RUNNER_IDS
              else
                echo "No runners to recycle"
              fi
