version: v1.0
name: Publish runner binary to S3

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204

global_job_config:
  secrets:
    - name: runner-s3

  prologue:
    commands:
      - checkout
      - sem-version go 1.22
      - cache restore
      - go mod download
      - cache store
      - aws sts get-caller-identity

blocks:
  - name: linux/amd64 runner
    task:
      agent:
        machine:
          type: f1-standard-2
          os_image: ubuntu2404

      jobs:
        - name: Build amd64 runner
          commands:
            - export CGO_ENABLED=0
            - export GOOS=linux
            - export GOARCH=amd64
            - go build -trimpath -ldflags="-s -w" -o runner ./runner/cmd/runner
            - aws s3 cp runner s3://superplanehq-runner-artifacts/production/runner-linux-amd64 --sse AES256

  - name: linux/arm64 runner
    task:
      agent:
        machine:
          type: r1-standard-2
          os_image: ubuntu2404

      jobs:
        - name: Build arm64 runner
          commands:
            - export CGO_ENABLED=0
            - export GOOS=linux
            - export GOARCH=arm64
            - go build -trimpath -ldflags="-s -w" -o runner ./runner/cmd/runner
            - aws s3 cp runner s3://superplanehq-runner-artifacts/production/runner-linux-arm64 --sse AES256
