# Promoted when /runner is green on main.
# After runner-images exists, set deployment_target on the deploy promotion.
version: v1.0
name: Publish runner Docker images

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

promotions:
  - name: Deploy runner services
    pipeline_file: runner-deploy-services.yml
    auto_promote:
      when: "result = 'passed'"

blocks:
  - name: Push to GHCR
    task:
      jobs:
        - name: ghcr publish
          commands:
            - checkout
            - export IMAGE_PREFIX="ghcr.io/superplanehq/runner"
            - export IMAGE_TAG="$(echo "$SEMAPHORE_GIT_SHA" | cut -c1-12)"
            - echo "${GHCR_TOKEN}" | docker login ghcr.io -u superplanehq --password-stdin
            - cd runner
            - make docker-publish-ghcr
