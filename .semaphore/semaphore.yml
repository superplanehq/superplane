version: v1.0
name: CI
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204

global_job_config:
  env_vars:
    - name: DOCKER_BUILDKIT
      value: "1"
    # Dummy public GitHub App so factory E2E can open workspace setup.
    # Local development without these values still blocks onboarding.
    - name: SUPERPLANE_GITHUB_APP_ID
      value: "1"
    - name: SUPERPLANE_GITHUB_APP_SLUG
      value: "superplane-e2e"
    - name: SUPERPLANE_GITHUB_APP_PRIVATE_KEY
      value: "-----BEGIN RSA PRIVATE KEY-----\\ne2e\\n-----END RSA PRIVATE KEY-----"
    - name: SUPERPLANE_GITHUB_APP_WEBHOOK_SECRET
      value: "e2e-webhook-secret"
    - name: SUPERPLANE_GITHUB_APP_CLIENT_ID
      value: "e2e-client-id"
    - name: SUPERPLANE_GITHUB_APP_CLIENT_SECRET
      value: "e2e-client-secret"
  prologue:
    commands:
      - checkout
      - mkdir -p tmp/go tmp/go-build

auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch != 'main'
blocks:
  - name: "Backend Tests"
    dependencies: []
    run:
      when: "change_in('/', {exclude: ['/docs/**', '/runner/**', '**/*.md', '**/*.mdx'], default_branch: 'main'})"
    task:
      prologue:
        commands:
          # Only main stores these caches, so the keys carry no branch name.
          # See scripts/ci_cache_store_go.sh.
          - "cache restore go-mod-$(checksum go.sum),go-mod"
          - "cache restore go-build-$(checksum go.sum),go-build"
          - make dev.up
          - make dev.setup
      jobs:
        - name: Lint
          commands:
            - make lint

        - name: Unit Tests
          parallelism: 4
          commands:
            - make test.coverage.autoparallel SHARD_INDEX=$SEMAPHORE_JOB_INDEX SHARD_COUNT=$SEMAPHORE_JOB_COUNT

        - name: E2E Tests
          parallelism: 10
          commands:
            - make test.e2e.autoparallel SHARD_INDEX=$SEMAPHORE_JOB_INDEX SHARD_COUNT=$SEMAPHORE_JOB_COUNT

        - name: Checks
          commands:
            - make check.db.structure
            - make check.db.migrations
            - make check.components.docs
            - make check.format.go
            - make check.example.payloads
            - make check.proto.field.numbers
            - make check.configuration.fields
            - make check.grpc.actions.status
            - make check.models.tx.debt
            - make check.generated.artifacts

      epilogue:
        always:
          commands:
            - "[ -f junit-report.xml ] && test-results publish junit-report.xml"
            - "if [ -d tmp/screenshots ] && ls tmp/screenshots/**/*.png >/dev/null 2>&1; then artifact push job tmp/screenshots; fi"
            - bash scripts/ci_cache_store_go.sh

  - name: "Security"
    dependencies: []
    run:
      when: "change_in('/', {exclude: ['/docs/**', '/runner/**', '**/*.md', '**/*.mdx'], default_branch: 'main'})"
    task:
      prologue:
        commands:
          - make dev.up
      jobs:
        - name: Tool configs
          commands:
            - make check.tool.configs

        - name: IoC markers
          commands:
            - bash ./scripts/check_ioc_markers.sh

        - name: Install hooks
          commands:
            - bash ./scripts/check_install_hooks.sh

        - name: Secrets
          commands:
            - bash ./scripts/check_committed_secrets.sh

        - name: npm audit
          commands:
            - make check.npm.audit.critical

  - name: "Frontend Tests"
    dependencies: []
    run:
      when: "change_in('/', {exclude: ['/docs/**', '/runner/**', '**/*.md', '**/*.mdx'], default_branch: 'main'})"
    task:
      prologue:
        commands:
          - "cache restore go-mod-$(checksum go.sum),go-mod"
          - "cache restore go-build-$(checksum go.sum),go-build"
          - make dev.up
          - make dev.setup
      jobs:
        - name: Storybook Build
          commands:
            - make check.tool.configs
            - make check.build.storybook

        - name: Unit Tests
          parallelism: 2
          commands:
            - make check.tool.configs
            - make check.test.ui.shard SHARD_INDEX=$SEMAPHORE_JOB_INDEX SHARD_COUNT=$SEMAPHORE_JOB_COUNT

        - name: Format Check
          commands:
            - make check.tool.configs
            - make check.format.js

        - name: EsLint
          commands:
            - make check.tool.configs
            - make check.lint.ui

        - name: Knip (dead files check)
          commands:
            - make check.tool.configs
            - make check.lint.ui.knip

      epilogue:
        always:
          commands:
            - "if [ -f junit-report.xml ]; then test-results publish junit-report.xml; fi"

  - name: "Build Image"
    dependencies: []
    run:
      when: "change_in('/', {exclude: ['/docs/**', '/runner/**', '**/*.md', '**/*.mdx'], default_branch: 'main'})"
    task:
      secrets:
        - name: ghcr-push-token
        - name: r2-static-assets
      prologue:
        commands:
          - "cache restore go-mod-$(checksum go.sum),go-mod"
          - "cache restore go-build-$(checksum go.sum),go-build"
          - make dev.up
          - make dev.setup.npm
      jobs:
        - name: Build image
          commands:
            - bash scripts/build-image

  - name: "Runner Tests"
    dependencies: []
    run:
      when: "change_in('/runner', {default_branch: 'main'})"
    task:
      prologue:
        commands:
          - sem-version go 1.25
          - cache restore go-mod-runner-$(checksum runner/go.sum),go-mod-runner
          - (cd runner && go mod download)
          - cache store go-mod-runner-$(checksum runner/go.sum),go-mod-runner
      jobs:
        - name: fmt, vet, build, tests
          commands:
            - cd runner
            - |
              FILES=$(gofmt -l fleet-manager runner shared task-broker test)
              if [ -n "$FILES" ]; then echo "gofmt needed on:"; echo "$FILES"; exit 1; fi
            - go vet ./...
            - mkdir -p bin
            - make build
            - sem-service start postgres 16
            - export TEST_DATABASE_URL='postgresql://postgres:@0.0.0.0:5432/postgres?sslmode=disable'
            - go test ./... -count=1 -p 1

after_pipeline:
  task:
    jobs:
      - name: Submit Reports
        commands:
          - test-results gen-pipeline-report

# Create SuperPlane targets runner-images, runner-s3, and runner-ami,
# then set deployment_target on the runner promotions. Do not use production.
promotions:
  - name: Deploy to Production
    pipeline_file: deploy-to-production.yml
    deployment_target: production
    auto_promote:
      when: "branch = 'main' AND result = 'passed' AND change_in('/', {exclude: ['/docs/**', '/runner/**', '**/*.md', '**/*.mdx'], default_branch: 'main'})"

  - name: Publish runner images
    pipeline_file: runner-docker-publish.yml
    auto_promote:
      when: "result = 'passed' AND branch = 'main' AND change_in('/runner', {default_branch: 'main'})"

  - name: Publish runner binaries to S3
    pipeline_file: runner-binary-s3.yml
    auto_promote:
      when: "result = 'passed' AND branch = 'main' AND change_in('/runner', {default_branch: 'main'})"

  - name: Build runner AMIs
    pipeline_file: runner-build-amis.yml
