# Promoted when main is green — secret "ghcr" exposes GHCR_TOKEN.
version: v1.0
name: Publish Docker images

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

blocks:
  - name: Push to GHCR
    task:
      secrets:
        - name: ghcr
      jobs:
        - name: ghcr publish
          commands:
            - checkout
            - export IMAGE_PREFIX="ghcr.io/$(echo "$SEMAPHORE_GIT_REPO_SLUG" | tr '[:upper:]' '[:lower:]')"
            - export IMAGE_TAG="$(echo "$SEMAPHORE_GIT_SHA" | cut -c1-12)"
            - echo "${GHCR_TOKEN}" | docker login ghcr.io -u "$(echo "$SEMAPHORE_GIT_REPO_SLUG" | cut -d/ -f1)" --password-stdin
            - make docker-publish-ghcr

promotions:
  - name: Deploy services
    pipeline_file: deploy-services.yml
    auto_promote:
      when: "result = 'passed'"
