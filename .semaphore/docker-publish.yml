# Promoted from .semaphore/semaphore.yml — requires secret "ghcr" (GHCR_USERNAME, GHCR_TOKEN).
version: v1.0
name: Publish Docker images

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

blocks:
  - name: Push to GHCR
    task:
      secrets:
        - name: ghcr
      jobs:
        - name: build and push fleet-manager task-broker runner
          commands:
            - checkout
            - test -n "${SEMAPHORE_GIT_REPO_SLUG:?SEMAPHORE_GIT_REPO_SLUG must be set}"
            - export PREFIX="ghcr.io/$(echo "${SEMAPHORE_GIT_REPO_SLUG}" | tr '[:upper:]' '[:lower:]')"
            - export SHORT_SHA="$(echo "${SEMAPHORE_GIT_SHA:?}" | cut -c1-12)"
            - |
              if [ -z "${GHCR_USERNAME:-}" ] || [ -z "${GHCR_TOKEN:-}" ]; then
                echo "GHCR_USERNAME and GHCR_TOKEN must come from Semaphore secret 'ghcr'."
                exit 1
              fi
            - echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            - |
              for svc in fleet-manager task-broker runner; do
                img="${PREFIX}/${svc}"
                docker build -f "${svc}/Dockerfile" -t "${img}:${SHORT_SHA}" .
                docker push "${img}:${SHORT_SHA}"
                if [ "${SEMAPHORE_GIT_REF_TYPE:-}" = "tag" ] && [ -n "${SEMAPHORE_GIT_TAG_NAME:-}" ]; then
                  docker tag "${img}:${SHORT_SHA}" "${img}:${SEMAPHORE_GIT_TAG_NAME}"
                  docker push "${img}:${SEMAPHORE_GIT_TAG_NAME}"
                fi
                if [ "${SEMAPHORE_GIT_REF_TYPE:-}" = "branch" ] && [ "${SEMAPHORE_GIT_BRANCH:-}" = "main" ]; then
                  docker tag "${img}:${SHORT_SHA}" "${img}:latest"
                  docker push "${img}:latest"
                fi
              done
