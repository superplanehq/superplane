# Auto-promoted from main after docker-publish passes.
# Requires Semaphore secret "deploy-ssh" with:
#   SSH_PRIVATE_KEY      — contents of igor-runners.pem (base64 or raw PEM)
#   FLEET_AUTH_TOKEN     — AUTH_TOKEN for fleet-manager container
#   TASK_BROKER_AUTH_TOKEN — AUTH_TOKEN for task-broker container
#   BROKER_PUBLIC_URL    — e.g. http://98.91.210.215:8081
version: v1.0
name: Deploy services

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

blocks:
  - name: Deploy fleet-manager
    task:
      secrets:
        - name: deploy-ssh
      jobs:
        - name: SSH deploy fleet-manager
          commands:
            - checkout
            - chmod 600 ~/.ssh/deploy.pem
            - export SSH_KEY=~/.ssh/deploy.pem
            - export SSH_HOST=13.220.51.216
            - export FLEET_MANAGER_IMAGE="ghcr.io/superplanehq/runner/fleet-manager:latest"
            - ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy.pem ubuntu@13.220.51.216 "docker pull $FLEET_MANAGER_IMAGE && docker stop fleet-manager && docker rm fleet-manager && docker run -d --name fleet-manager --restart unless-stopped -p 8080:8080 -v fleet-manager-data:/home/nonroot --env-file /home/ubuntu/fleet-manager.env $FLEET_MANAGER_IMAGE && docker ps --filter name=fleet-manager"

  - name: Deploy task-broker
    task:
      secrets:
        - name: deploy-ssh
      jobs:
        - name: SSH deploy task-broker
          commands:
            - checkout
            - chmod 600 ~/.ssh/deploy.pem
            - export SSH_KEY=~/.ssh/deploy.pem
            - export SSH_HOST=98.91.210.215
            - export AUTH_TOKEN="$TASK_BROKER_AUTH_TOKEN"
            - export BROKER_PUBLIC_URL="$BROKER_PUBLIC_URL"
            - export TASK_BROKER_IMAGE="ghcr.io/superplanehq/runner/task-broker:latest"
            - bash scripts/start-task-broker-remote.sh

  - name: Recycle runner instances
    task:
      secrets:
        - name: deploy-ssh
      jobs:
        - name: Terminate stale EC2 runners
          commands:
            - sudo apt-get install -qy awscli
            - chmod 600 ~/.ssh/deploy.pem
            - |
              # Fetch instance IDs via fleet-manager host
              IDS=$(ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy.pem ubuntu@13.220.51.216 '
                TOKEN=$(curl -sf -X PUT http://169.254.169.254/latest/api/token -H X-aws-ec2-metadata-token-ttl-seconds:21600)
                CREDS=$(curl -sf -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/iam/security-credentials/fleet-manager-ec2-role)
                export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | python3 -c "import sys,json; print(json.load(sys.stdin)[\"AccessKeyId\"])")
                export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | python3 -c "import sys,json; print(json.load(sys.stdin)[\"SecretAccessKey\"])")
                export AWS_SESSION_TOKEN=$(echo "$CREDS" | python3 -c "import sys,json; print(json.load(sys.stdin)[\"Token\"])")
                export AWS_DEFAULT_REGION=us-east-1
                python3 -c "
import boto3,os
ec2=boto3.client(\"ec2\",region_name=\"us-east-1\",aws_access_key_id=os.environ[\"AWS_ACCESS_KEY_ID\"],aws_secret_access_key=os.environ[\"AWS_SECRET_ACCESS_KEY\"],aws_session_token=os.environ[\"AWS_SESSION_TOKEN\"])
r=ec2.describe_instances(Filters=[{\"Name\":\"tag:superplane_managed_runner\",\"Values\":[\"true\"]},{\"Name\":\"instance-state-name\",\"Values\":[\"pending\",\"running\"]}])
ids=[i[\"InstanceId\"] for res in r[\"Reservations\"] for i in res[\"Instances\"]]
if ids: ec2.terminate_instances(InstanceIds=ids)
print(\" \".join(ids))
"
              ')
              if [ -n "$IDS" ]; then
                echo "Terminated runner instances: $IDS"
              else
                echo "No active runner instances to terminate"
              fi
              echo "Fleet-manager will provision fresh instances on next reconcile (up to 60s)"
