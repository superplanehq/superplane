version: v1.0
name: Deploy services

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

global_job_config:
  secrets:
    - name: aws-prod
  env_vars:
    - name: AWS_DEFAULT_REGION
      value: us-east-1

blocks:
  - name: Deploy task-broker
    dependencies: []
    task:
      jobs:
        - name: ECS deploy task-broker
          commands:
            - aws ecs update-service --cluster default --service task-broker-v2 --force-new-deployment
            - aws ecs wait services-stable --cluster default --services task-broker-v2

  - name: Deploy fleet-manager
    dependencies: []
    task:
      jobs:
        - name: ECS deploy fleet-manager
          commands:
            - aws ecs update-service --cluster default --service fleet-manager --force-new-deployment
            - aws ecs wait services-stable --cluster default --services fleet-manager
