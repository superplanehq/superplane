# Auto-promoted from main after docker-publish passes.
# Requires Semaphore secret "deploy-ssh" with:
#   SSH_PRIVATE_KEY      — contents of igor-runners.pem (base64 or raw PEM)
#   FLEET_AUTH_TOKEN     — AUTH_TOKEN for fleet-manager container
#   TASK_BROKER_AUTH_TOKEN — AUTH_TOKEN for task-broker container
#   BROKER_PUBLIC_URL    — e.g. http://98.91.210.215:8081
version: v1.0
name: Deploy services

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

blocks:
  - name: Deploy fleet-manager
    task:
      secrets:
        - name: deploy-ssh
      jobs:
        - name: SSH deploy fleet-manager
          commands:
            - checkout
            - chmod 600 ~/.ssh/deploy.pem
            - export SSH_KEY=~/.ssh/deploy.pem
            - export SSH_HOST=13.220.51.216
            - export FLEET_MANAGER_IMAGE="ghcr.io/superplanehq/runner/fleet-manager:latest"
            - ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy.pem ubuntu@13.220.51.216 "docker pull $FLEET_MANAGER_IMAGE && docker stop fleet-manager && docker rm fleet-manager && docker run -d --name fleet-manager --restart unless-stopped -p 8080:8080 -v fleet-manager-data:/home/nonroot --env-file /home/ubuntu/fleet-manager.env $FLEET_MANAGER_IMAGE && docker ps --filter name=fleet-manager"

  - name: Deploy task-broker
    task:
      secrets:
        - name: deploy-ssh
      jobs:
        - name: SSH deploy task-broker
          commands:
            - checkout
            - chmod 600 ~/.ssh/deploy.pem
            - export SSH_KEY=~/.ssh/deploy.pem
            - export SSH_HOST=98.91.210.215
            - export AUTH_TOKEN="$TASK_BROKER_AUTH_TOKEN"
            - export BROKER_PUBLIC_URL="$BROKER_PUBLIC_URL"
            - export TASK_BROKER_IMAGE="ghcr.io/superplanehq/runner/task-broker:latest"
            - bash scripts/start-task-broker-remote.sh

  - name: Recycle runner instances
    task:
      secrets:
        - name: deploy-ssh
      jobs:
        - name: Terminate stale EC2 runners
          commands:
            - checkout
            - chmod 600 ~/.ssh/deploy.pem
            - export SSH_KEY=~/.ssh/deploy.pem
            - bash scripts/recycle-runners.sh
