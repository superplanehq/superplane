# Auto-promoted from main after docker-publish passes.
# Requires Semaphore secret "deploy-ssh" with:
#   SSH_PRIVATE_KEY      — contents of igor-runners.pem
#   FLEET_AUTH_TOKEN     — AUTH_TOKEN for fleet-manager container
#   TASK_BROKER_AUTH_TOKEN — AUTH_TOKEN for task-broker container
#   BROKER_PUBLIC_URL    — e.g. http://100.24.107.156:8081
version: v1.0
name: Deploy services

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

blocks:
  - name: Deploy fleet-manager
    task:
      secrets:
        - name: deploy-ssh
      jobs:
        - name: SSH deploy fleet-manager
          commands:
            - checkout
            - echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy.pem && chmod 600 ~/.ssh/deploy.pem
            - export FLEET_MANAGER_IMAGE="ghcr.io/superplanehq/runner/fleet-manager:latest"
            - ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy.pem ubuntu@44.220.93.243 "sudo docker pull $FLEET_MANAGER_IMAGE && sudo docker stop fleet-manager && sudo docker rm fleet-manager && sudo docker run -d --name fleet-manager --restart unless-stopped -p 8080:8080 -v fleet-manager-data:/home/nonroot --env-file /home/ubuntu/fleet-manager.env -e AWS_DEFAULT_REGION=us-east-1 $FLEET_MANAGER_IMAGE && sudo docker ps --filter name=fleet-manager"

  - name: Deploy task-broker
    task:
      secrets:
        - name: deploy-ssh
      jobs:
        - name: SSH deploy task-broker
          commands:
            - checkout
            - echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy.pem && chmod 600 ~/.ssh/deploy.pem
            - export SSH_KEY=~/.ssh/deploy.pem
            - export SSH_HOST=100.24.107.156
            - export AUTH_TOKEN="$TASK_BROKER_AUTH_TOKEN"
            - export BROKER_PUBLIC_URL="$BROKER_PUBLIC_URL"
            - bash scripts/start-task-broker-remote.sh

  - name: Recycle runner instances
    dependencies:
      - Deploy fleet-manager
    task:
      secrets:
        - name: deploy-ssh
      jobs:
        - name: Terminate stale EC2 runners
          commands:
            - checkout
            - echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy.pem && chmod 600 ~/.ssh/deploy.pem
            - export SSH_KEY=~/.ssh/deploy.pem
            - bash scripts/recycle-runners.sh
