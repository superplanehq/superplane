version: v1.0
name: Build runner AMIs
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

promotions:
  - name: Release runner AMIs
    pipeline_file: release-amis.yml

blocks:
  - name: Build AMIs (amd64 + arm64)
    task:
      secrets:
        - name: aws-credentials
      env_vars:
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        - name: PACKER_VERSION
          value: "1.11.2"
      jobs:
        - name: packer build
          commands:
            - checkout

            # Install Packer
            - |
              curl -fsSL \
                "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip" \
                -o /tmp/packer.zip
              unzip -q /tmp/packer.zip -d /tmp
              sudo mv /tmp/packer /usr/local/bin/packer
              packer version

            # Initialize Packer plugins
            - packer init packer/runner.pkr.hcl

            # Build both AMIs in parallel
            - |
              packer build \
                -var "aws_region=${AWS_DEFAULT_REGION}" \
                packer/runner.pkr.hcl

            # Extract AMI IDs and store in SSM staging parameters.
            # These are separate from the live fleet config — the release pipeline
            # promotes them when ready.
            - |
              AMD64_AMI=$(python3 -c "
              import json
              with open('packer/manifest.json') as f:
                  m = json.load(f)
              for b in m['builds']:
                  if 'amd64' in b['name']:
                      print(b['artifact_id'].split(':')[-1])
                      break
              ")

              ARM64_AMI=$(python3 -c "
              import json
              with open('packer/manifest.json') as f:
                  m = json.load(f)
              for b in m['builds']:
                  if 'arm64' in b['name']:
                      print(b['artifact_id'].split(':')[-1])
                      break
              ")

              echo "amd64 AMI: $AMD64_AMI"
              echo "arm64 AMI: $ARM64_AMI"

              aws ssm put-parameter \
                --name "/superplane/fleet-manager/ami/amd64" \
                --value "$AMD64_AMI" \
                --type String \
                --overwrite

              aws ssm put-parameter \
                --name "/superplane/fleet-manager/ami/arm64" \
                --value "$ARM64_AMI" \
                --type String \
                --overwrite

              echo "Staged AMI IDs written to SSM:"
              echo "  /superplane/fleet-manager/ami/amd64 = $AMD64_AMI"
              echo "  /superplane/fleet-manager/ami/arm64 = $ARM64_AMI"
