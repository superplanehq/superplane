manager:
  id: test-gcp
superplane:
  url: https://superplane.example.com
credentials:
  existingSecret: fleet-manager-token
serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: fleet-manager@example.iam.gserviceaccount.com
fleets:
  - id: e1-large-arm64
    runnerVersion: v0.1.0
    warmCapacity: 0
    maxCapacity: 1
    spec:
      operatingSystem: linux
      architecture: arm64
      cpuMillicores: 2000
      memoryMb: 8192
      diskGb: 30
      capabilities: [docker]
    provider: gcp
    gcp:
      projectId: example
      zones: [us-central1-a]
      machineType: t2a-standard-4
      image: projects/example/global/images/fleet-runner
      architecture: arm64
      subnetwork: projects/example/regions/us-central1/subnetworks/runners
      serviceAccountEmail: runner@example.iam.gserviceaccount.com
      networkTags: [runner]
      diskSizeGb: 30
