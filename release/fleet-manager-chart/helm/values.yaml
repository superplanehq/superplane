manager:
  id: my-cluster

superplane:
  url: https://superplane.example.com

installationAdminToken: ""

runner:
  releaseBaseUrl: https://github.com/superplanehq/superplane/releases/download/runner%2F{version}

image:
  repository: ghcr.io/superplanehq/fleet-manager
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

serviceAccount:
  create: true
  name: superplane-fleet-manager
  annotations: {}

podLabels: {}
podAnnotations: {}

reconciliation:
  interval: 5s
  errorRetryInterval: 15s

http:
  requestTimeout: 90s

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

startupJob:
  activeDeadlineSeconds: 300

fleets:
  - id: e1-large-amd64
    runnerVersion: v0.1.0
    warmCapacity: 0
    maxCapacity: 1
    spec:
      operatingSystem: linux
      architecture: amd64
      cpuMillicores: 2000
      memoryMb: 8192
      diskGb: 30
      capabilities:
        - docker
    provider: aws
    aws:
      region: us-east-1
      ami: <PUBLIC_AMI_ID_FOR_REGION_AND_ARCH>
      instanceType: <INSTANCE_TYPE>
      architecture: amd64
      subnetIds:
        - <SUBNET_ID>
      securityGroupIds:
        - <SECURITY_GROUP_ID>
      iamInstanceProfile: <INSTANCE_PROFILE>
      volumeSizeGb: 30
