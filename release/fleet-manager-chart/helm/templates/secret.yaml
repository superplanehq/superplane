apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleet-manager.configSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  fleet-manager.yaml: |
    {{- include "fleet-manager.runtimeConfig" . | nindent 4 }}
