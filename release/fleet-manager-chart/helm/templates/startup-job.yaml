apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fleet-manager.name" . }}-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-manager.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.startupJob.activeDeadlineSeconds }}
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-manager-setup
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync-fleets
          image: {{ .Values.startupJob.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              {{- .Files.Get "files/sync-fleets.sh" | nindent 14 }}
            - "--"
            {{- range .Values.fleets }}
            {{- $create := dict "fleetId" .id "runnerVersion" .runnerVersion "spec" .spec }}
            {{- $update := dict "runnerVersion" .runnerVersion "spec" .spec }}
            - {{ .id | quote }}
            - {{ $create | toJson | b64enc | quote }}
            - {{ $update | toJson | b64enc | quote }}
            {{- end }}
          env:
            - name: SUPERPLANE_URL
              value: {{ .Values.superplane.url | trimSuffix "/" | quote }}
            - name: INSTALLATION_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.existingSecret }}
                  key: {{ .Values.credentials.tokenKey }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 1Mi
