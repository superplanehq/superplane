# Default values for superplane.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  registry: ghcr.io/superplanehq
  name: superplane
  # Empty uses Chart.AppVersion. Published charts set it to the matching
  # vMAJOR.MINOR.PATCH or release-candidate image tag. Legacy charts can use
  # <git-sha>-selfhosted, and local builds can override this value.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

workers:
  replicas: 1
  dbPoolSize: 5
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

api:
  ownerSetupEnabled: true
  blockSignup: false
  # Set all four required fields to create the owner account automatically
  # at startup and skip the /setup wizard. Empty disables the bootstrap and
  # keeps the interactive wizard. orgName is optional (defaults to "Demo").
  # password is base64-encoded and stored in a Kubernetes Secret, like the
  # other chart secrets. Set secretName to reference an existing Secret
  # that holds SUPERPLANE_OWNER_PASSWORD instead of creating one.
  ownerBootstrap:
    email: ""
    password: ""
    firstName: ""
    lastName: ""
    orgName: ""
    secretName: ""
  replicas: 1
  dbPoolSize: 5
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

# WebSocket hubs run separately from the API. Ingress sends /ws here.
websocket:
  replicas: 1
  dbPoolSize: 5
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

domain:
  name: ""
  configMapName: "base-domain"

authentication:
  secretName: ""
  enablePasswordLogin: true
  github:
    enabled: true
    clientId: ""
    clientSecret: ""
  google:
    enabled: true
    clientId: ""
    clientSecret: ""

#
# Key used to encrypt sensitive values before storing them in the database.
#
encryption:
  secretName: ""
  key: ""

#
# Optional Enterprise license from an existing Kubernetes secret. When set,
# the mounted file is the only license source and administrators cannot
# change the license in the UI. Leave empty to install the license in the UI.
#
license:
  secretName: ""
  secretKey: "license.jws"
  # URL of the signed license key list. Use "none" without network access.
  # Leave empty to use the SuperPlane issuer.
  keysURL: ""
  # Hide the license expiry banner. Self-hosted installations keep it visible.
  hideExpiryBanner: false

telemetry:
  secretName: ""
  opentelemetry:
    enabled: true
    endpoint: ""
    protocol: ""
    headers: ""
    serviceName: ""

installation:
  type: "kubernetes"
  beaconEnabled: true

#
# Fleet Manager setup metadata for the installation wizard.
#
fleetManagerSetup:
  enabled: true
  provider: ""
  managerId: ""
  namespace: ""
  serviceAccountName: superplane-fleet-manager
  infrastructure: {}

# Saved versions are the fallback when release lookup fails.
componentReleases:
  runnerVersion: v0.2.0
  runnerVersions:
    - v0.2.0
  fleetManagerVersion: v0.1.4

sentry:
  secretName: ""
  enabled: false
  dsn: ""
  environment: ""

dash0Web:
  secretName: ""
  enabled: false
  otlpEndpoint: ""
  authToken: ""
  serviceName: "superplane-web"
  environment: ""

posthog:
  secretName: ""
  enabled: false
  key: ""

polar:
  secretName: ""
  enabled: false
  accessToken: ""
  environment: "sandbox"
  webhookSecret: ""
  # Optional. Overrides the Polar API version that SuperPlane pins in code.
  apiVersion: ""

#
# SuperPlane Linear OAuth application.
# When enabled, Connect authorizes this public app.
# On the Linear application, set the callback URL to
# {BASE_URL}/api/v1/linear/oauth/callback.
# Set the webhook URL to {BASE_URL}/api/v1/linear/webhook
# and select Issues, Comments, and Issue attachments.
# webhookSecret is that application's webhook signing secret.
# When it is set, Connect requests the read and write scopes.
# When it is empty, Connect also requests the admin scope.
#
linear:
  secretName: ""
  enabled: false
  clientId: ""
  clientSecret: ""
  webhookSecret: ""

#
# Secret used to sign JWT session tokens
#
jwt:
  secretName: ""
  secret: ""

#
# Secret used to sign OIDC tokens (RSA private keys, base64-encoded)
#
oidc:
  secretName: ""
  keys: {}

session:
  secretName: ""
  key: ""

#
# Ingress configuration
#
ingress:
  enabled: true

  #
  # Specify the name of the static IP address
  # Required when ingress.className=gce
  #
  staticIpName: ""

  #
  # Set the Ingress class:
  # - gce: when deploying chart on GKE
  # - traefik: when deploying on VM with k3s
  #
  className: "gce"

  #
  # SSL Configuration
  #
  ssl:
    enabled: true
    type: "google"

    #
    # Use a Google-managed certificate.
    # Requires the name of the Google managed certificate in GCP
    #
    google:
      certName: ""

    #
    # Use a ALB certificate.
    #
    alb:
      certName: ""

    #
    # Use cert-manager to manage SSL certificates.
    # Requires cert-manager to be installed separately before installing this chart.
    # Install cert-manager with: helm install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --set installCRDs=true
    # Set ingress.ssl.type to "cert-manager" to use this option.
    #
    certManager:
      issuerRef:
        name: ""
        kind: "ClusterIssuer" # Can be "Issuer" or "ClusterIssuer"
      secretName: "superplane-tls-secret"
      # Optional: Additional annotations for the Certificate resource
      annotations: {}
      # Create ClusterIssuer automatically (only used when kind is "ClusterIssuer")
      createClusterIssuer: false
      acme:
        # Email address for Let's Encrypt registration
        email: ""
        # ACME server URL (defaults to Let's Encrypt production)
        server: "https://acme-v02.api.letsencrypt.org/directory"

    #
    # Provide a custom certificate managed by yourself.
    # Requires the fullchain certificate and the private key used to generate it,
    # which will be stored in a Kubernetes secret for usage.
    #
    custom:
      secretName: "superplane-tls-secret"
      crt: ""
      key: ""

#
# Postgres configuration
#
database:
  secretName: ""
  host: "postgres"
  port: 5432
  username: postgres
  password: postgres
  ssl: false
  statementTimeout: "60s"
  idleInTransactionSessionTimeout: "30s"
  local:
    enabled: true
    version: 14.15-alpine3.21
    maxConnections: "1000"
    sharedBuffers: 1024MB
    size: 4Gi

#
# RabbitMQ configuration
#
rabbitmq:
  secretName: ""
  host: "rabbitmq"
  port: 5672
  managementPort: 15672
  username: rabbitmq
  password: rabbitmq
  protocol: amqp
  local:
    enabled: true
    version: 3.13.7-management-alpine
    size: 2Gi

#
# Platform blob storage. Self-host defaults to a local directory.
# Hosted SuperPlane sets provider to gcs and a bucket name.
# Azure self-host sets provider to azure and account to the storage account name.
#
blobStorage:
  provider: filesystem
  account: ""
  bucket: ""
  region: ""
  localPath: /var/lib/superplane/blobs
  credentialsFile: ""

#
# Extra labels for pods that use a workload identity.
# AKS requires azure.workload.identity/use: "true".
#
podLabels: {}

#
# Pod securityContext for the API, workers, websocket, and runner pods.
# Empty emits no pod securityContext. Pods that mount runner logs still set
# fsGroup from runner.activeLogs.fsGroup. That fsGroup wins over this map.
#
podSecurityContext: {}

#
# Container securityContext for the API, workers, websocket, and runner
# containers. These defaults match the previous fixed template.
#
securityContext:
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

#
# Migration Job. The SuperPlane image runs as nobody (65534).
# These defaults match the previous fixed template.
# A non-empty podSecurityContext is merged over migrate.podSecurityContext.
# A container securityContext that differs from the chart default is merged
# over migrate.securityContext.
#
migrate:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL

#
# Runner API and runner workers. Off by default.
# The runner API serves /runner/v1. Runner workers compact finished task
# logs into blob storage and remove stale runners.
# Set blobStorage.provider to gcs, s3, or azure before you enable the runner.
# filesystem is local to one pod, so the runner cannot share those blobs.
# Omit runner.workers.enabled to follow runner.api.enabled.
# Active logs are a shared filesystem. The API reads live logs from this
# volume. Leave existingClaim empty to create a ReadWriteOnce claim. The
# API then schedules on the runner API node, or on the worker node when
# the runner API is off. The websocket and the workers prefer another
# node so the shared log pods have CPU. A one-node cluster can still
# schedule them. A rollout stops the old API pod before
# a new pod starts, because that claim attaches to one node. Set
# existingClaim to a ReadWriteMany claim when replicas run on more than
# one node.
#
runner:
  api:
    enabled: false
    replicas: 1
  workers:
    replicas: 1
  activeLogs:
    path: /var/lib/superplane/runner-active-logs
    existingClaim: ""
    size: 10Gi
    # Group that owns the log volume. The SuperPlane image runs as nobody (65534).
    fsGroup: 65534

#
# Email configuration
#
email:
  secretName: ""
  resendApiKey: ""
  fromName: ""
  fromAddress: ""

#
# In-app feedback delivery. The worker sends mail to support@superplane.com
# and posts the same report to this Discord webhook when the URL is set.
# Helm stores the webhook in a dedicated feedback secret, not the email secret.
#
feedback:
  discordWebhookUrl: ""

#
# Kubernetes service account for the API, worker, and WebSocket pods.
# Set create to true to create it, or set name to use an existing account.
# Set annotations to bind a cloud identity, for example GKE Workload Identity.
#
serviceAccount:
  create: false
  name: ""
  annotations: {}
