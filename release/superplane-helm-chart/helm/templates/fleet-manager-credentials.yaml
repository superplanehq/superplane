{{- if and .Values.fleetManagerSetup.enabled .Values.fleetManagerSetup.credentials.provision }}
{{- $hookAnnotations := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-fleet-manager-credential
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-5") $hookAnnotations) | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-fleet-manager-credential
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-5") $hookAnnotations) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ required "fleetManagerSetup.credentials.existingSecret is required when credential provisioning is enabled" .Values.fleetManagerSetup.credentials.existingSecret }}
    verbs: ["get"]
  # Kubernetes cannot restrict top-level create requests by resource name.
  # This short-lived hook account has no update, delete, list, or watch access.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-fleet-manager-credential
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-5") $hookAnnotations) | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-fleet-manager-credential
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-fleet-manager-credential
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-fleet-manager-credential
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-5") $hookAnnotations) | nindent 4 }}
spec:
  activeDeadlineSeconds: {{ .Values.fleetManagerSetup.credentialJob.activeDeadlineSeconds }}
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: superplane
        service: {{ .Release.Name }}-fleet-manager-credential
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Release.Name }}-fleet-manager-credential
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: {{ .Values.fleetManagerSetup.credentialJob.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
{{ .Files.Get "files/provision-fleet-manager-token.sh" | indent 14 }}
          env:
            - name: SECRET_NAME
              value: {{ .Values.fleetManagerSetup.credentials.existingSecret | quote }}
            - name: TOKEN_KEY
              value: {{ .Values.fleetManagerSetup.credentials.tokenKey | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}
{{- end }}
