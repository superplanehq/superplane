{{- if .Values.runner.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-runner-api
  namespace: {{ .Release.Namespace }}
{{- if eq .Values.ingress.className "gce" }}
  annotations:
    cloud.google.com/backend-config: '{"default": "ingress-runner-api-backend-config"}'
    cloud.google.com/neg: '{"ingress": true}'
{{- end }}
spec:
  type: NodePort
  selector:
    app: superplane
    service: {{ .Release.Name }}-runner-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-runner-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: superplane
    service: {{ .Release.Name }}-runner-api
spec:
  replicas: {{ .Values.runner.api.replicas }}
  selector:
    matchLabels:
      app: superplane
      service: {{ .Release.Name }}-runner-api
  template:
    metadata:
      name: {{ .Release.Name }}-runner-api
      labels:
        app: superplane
        service: {{ .Release.Name }}-runner-api
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ include "superplane.serviceAccountName" . }}
      {{- end }}
      securityContext:
        fsGroup: {{ .Values.runner.activeLogs.fsGroup }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}-runner-api
          image: "{{ .Values.image.registry }}/{{ .Values.image.name }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/build/superplane"]
          envFrom:
            - configMapRef:
                name: {{ .Values.domain.configMapName }}
            - secretRef:
                name: {{ include "secrets.database.name" . }}
            - secretRef:
                name: {{ include "secrets.rabbitmq.name" . }}
            - secretRef:
                name: {{ include "secrets.authentication.name" . }}
            - secretRef:
                name: {{ include "secrets.telemetry.name" . }}
            - secretRef:
                name: {{ include "secrets.encryption.name" . }}
            - secretRef:
                name: {{ include "secrets.jwt.name" . }}
            - secretRef:
                name: {{ include "secrets.session.name" . }}
            - secretRef:
                name: {{ include "secrets.sentry.name" . }}
            - secretRef:
                name: {{ include "secrets.dash0Web.name" . }}
            {{- if .Values.posthog.enabled }}
            - secretRef:
                name: {{ include "secrets.posthog.name" . }}
            {{- end }}
            {{- if .Values.polar.enabled }}
            - secretRef:
                name: {{ include "secrets.polar.name" . }}
            {{- end }}
            {{- if .Values.linear.enabled }}
            - secretRef:
                name: {{ include "secrets.linear.name" . }}
            {{- end }}
          env:
            {{- include "runner.processEnv" (dict "enabled" (list "START_RUNNER_API")) | nindent 12 }}
            - name: PUBLIC_API_BASE_PATH
              value: "/api/v1"
            - name: RBAC_MODEL_PATH
              value: /app/rbac/rbac_model.conf
            - name: RBAC_ORG_POLICY_PATH
              value: /app/rbac/rbac_org_policy.csv
            - name: RBAC_CANVAS_POLICY_PATH
              value: /app/rbac/rbac_canvas_policy.csv
            - name: APPLICATION_NAME
              value: superplane
            - name: DB_POOL_SIZE
              value: "{{ .Values.api.dbPoolSize }}"
            - name: DB_STATEMENT_TIMEOUT
              value: "{{ .Values.database.statementTimeout }}"
            - name: DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT
              value: "{{ .Values.database.idleInTransactionSessionTimeout }}"
            - name: TEMPLATE_DIR
              value: /app/templates
            - name: OIDC_KEYS_PATH
              value: /app/oidc-keys
            - name: BLOB_STORAGE_PROVIDER
              value: {{ .Values.blobStorage.provider | quote }}
            - name: BLOB_STORAGE_BUCKET
              value: {{ .Values.blobStorage.bucket | quote }}
            - name: BLOB_STORAGE_REGION
              value: {{ .Values.blobStorage.region | quote }}
            - name: BLOB_STORAGE_LOCAL_PATH
              value: {{ .Values.blobStorage.localPath | quote }}
            - name: BLOB_STORAGE_CREDENTIALS_FILE
              value: {{ .Values.blobStorage.credentialsFile | quote }}
            - name: RUNNER_ACTIVE_LOG_FS_PATH
              value: {{ .Values.runner.activeLogs.path | quote }}
          volumeMounts:
            - name: oidc-keys
              mountPath: /app/oidc-keys
              readOnly: true
            - name: runner-active-logs
              mountPath: {{ .Values.runner.activeLogs.path }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 5
          securityContext:
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: oidc-keys
          secret:
            secretName: {{ include "secrets.oidc.name" . }}
        - name: runner-active-logs
          persistentVolumeClaim:
            claimName: {{ include "runner.activeLogs.claimName" . }}
{{- end }}
