{{- if eq .Values.encryption.secretName "" }}
{{- $masters := .Values.encryption.masterKeys | required "Set encryption.masterKeys." -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "secrets.encryption.name" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  ENCRYPTION_MASTER_KEYS: {{ $masters | b64enc | quote }}
  {{- if .Values.encryption.key }}
  ENCRYPTION_KEY: {{ .Values.encryption.key | quote }}
  {{- end }}
{{- end }}
