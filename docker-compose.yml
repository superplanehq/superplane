services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      POSTGRES_DB: broker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker"]
      interval: 2s
      timeout: 5s
      retries: 10

  task-broker:
    build:
      context: .
      dockerfile: task-broker/Dockerfile
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://broker:broker@db:5432/broker?sslmode=disable
      AUTH_TOKEN: dev-token
      LISTEN_ADDR: :8081
    depends_on:
      db:
        condition: service_healthy
